# The format registry. docs/formats.md has the rules.
#
# Each [format.<id>] entry is one stored or wire format that a release of
# one version writes and a release of another version reads:
#
#   writes     the version this release writes with its default configuration
#   reads_min  the oldest version this release reads
#   reads_max  the newest version this release reads
#   shared     true when two releases of a mixed fleet read each other's
#              output; false for a file that one process writes and reads
#   permanent  optional, true when the data stays for all time: a release
#              never stops reading an old version
#   code       "path#symbol": a file that defines the format, and a name in
#              that file. A test checks that each file holds the symbol as a
#              whole word. It is a pointer, not a proof.
#   activation optional { flag = "...", writes = N }: the version the writer
#              writes when an operator switches the flag on
#   layout     optional table [format.<id>.layout]: a fingerprint of each
#              part of a frozen layout. A test computes each one from code.
#
# For a set of message kinds, the version is the highest kind number.
# A format with no version constant has a frozen layout. It has version 1.
#
# `just check-formats BASE` compares this file with the file at the base
# revision. docs/formats.md lists the rules and the waiver tables.

# The sealer's Aeron Cluster snapshot. The loader refuses a version outside
# the read range, so a member that rolls back cannot load a newer
# snapshot. A member that joins late can get a snapshot of another member,
# so the format is shared. This release reads v11 and still writes v10.
[format.sealer-snapshot]
writes = 10
reads_min = 1
reads_max = 11
shared = true
code = [
    "cluster/sealer-service/core/src/main/java/io/kardamom/sealer/CanonicalSealerState.java#SNAPSHOT_WRITE_VERSION",
    "cluster/sealer-service/core/src/main/java/io/kardamom/sealer/CanonicalSealerState.java#SNAPSHOT_READ_VERSION",
]

# The ingress message kinds of the sealer. The Rust writers send kinds 0
# to 7. The sealer itself writes kind 8 into its log. The executor sends
# kind 9 (the recorded cursor) only with KARDAMOM_EXEC_CURSOR on
# (--exec-cursor); the default is off. Every member drops a frame of a
# kind it does not know, counts it, and never orders it. A new kind that
# changes the replicated state is sent only after every member reads it:
# members of two releases decide alike until then. So switch the flag on
# only after every member reads kind 9. The release before this one orders
# an unknown kind of 85 bytes or more as a user record. So during the first
# roll to this release, no client may send an unknown kind: an old member
# orders such a frame and a new member drops it. No client sends one today
# (the Rust writers send kinds 0 to 7).
[format.sealer-ingress-kinds]
writes = 8
reads_min = 0
reads_max = 9
shared = true
code = [
    "cluster/sealer-service/service/src/main/java/io/kardamom/sealer/cluster/SealerWire.java#KIND_RECORDED_CURSOR",
    "crates/cluster-adapter/src/wire/mod.rs#KIND_RECORDED_CURSOR",
    "crates/executor/src/bin/kardamom-executor/args.rs#KARDAMOM_EXEC_CURSOR",
]
activation = { flag = "KARDAMOM_EXEC_CURSOR", writes = 9 }

# The egress message kinds of the sealer. The Rust reader drops an unknown
# kind with a warning. The sealer sends kind 13 (the record-lag reject)
# only when recordLagBudget is above 0.
#
# The status frame (kind 9) is 50 bytes, or 67 bytes with the record-lag
# fields at the tail. A reader of either release reads either size: an old
# reader ignores the tail, and a new reader reads a frame with no tail as
# the guard off.
[format.sealer-egress-kinds]
writes = 12
reads_min = 1
reads_max = 13
shared = true
code = [
    "cluster/sealer-service/service/src/main/java/io/kardamom/sealer/cluster/SealerWire.java#EGRESS_KIND_RECORD_LAG_REJECT",
    "crates/cluster-adapter/src/wire/mod.rs#EGRESS_KIND_RECORD_LAG_REJECT",
    "crates/cluster-adapter/src/wire/mod.rs#STATUS_WITH_RECORD_LAG_LEN",
]
activation = { flag = "recordLagBudget", writes = 13 }

# The record type inside a relayed egress frame. The Rust writers send
# types 0 to 3, and the sealer writes type 4 (void). The Rust reader drops
# a frame with an unknown type, so an old executor misses a canonical
# record.
[format.sealer-record-types]
writes = 4
reads_min = 0
reads_max = 4
shared = true
code = [
    "crates/cluster-adapter/src/wire/mod.rs#RT_VOID",
    "cluster/sealer-service/core/src/main/java/io/kardamom/sealer/VoidLedger.java#RT_VOID",
]

# The seed file that kardamom-reconstruct writes and an empty sealer
# cluster starts from. The sealer refuses any other version.
[format.sealer-seed]
writes = 1
reads_min = 1
reads_max = 1
shared = true
code = [
    "crates/reconstruct/src/seed.rs#const VERSION",
    "cluster/sealer-service/core/src/main/java/io/kardamom/sealer/SealerSeed.java#int VERSION",
]

# The major part of the Aeron Cluster app version. Aeron refuses a session
# or a log whose major differs from the member's major.
[format.cluster-app-version]
writes = 0
reads_min = 0
reads_max = 0
shared = true
code = [
    "cluster/sealer-service/service/src/main/java/io/kardamom/sealer/cluster/ClusterNode.java#APP_VERSION",
    "crates/cluster-client/src/session/mod.rs#APP_SEMANTIC_VERSION",
]

# The executor and validator state database. The database refuses a
# version other than its own, and there is no migration. A change is
# one-way and coordinated.
[format.state-db]
writes = 3
reads_min = 3
reads_max = 3
shared = false
code = ["crates/state/src/meta.rs#SCHEMA_VERSION"]

# The checkpoint manifest. The reader ignores the version key and unknown
# keys. The optional `schema_version` key states the state-db schema of the
# image, and the peer-fetch header `x-checkpoint-schema` carries the same
# value. An adopter skips, with a log line and a count, an image whose
# schema it does not read. A manifest without the key passes, and the
# image says its schema when it opens. The image inside the checkpoint is
# a state database, so the state-db entry also applies to a checkpoint.
[format.checkpoint-manifest]
writes = 1
reads_min = 1
reads_max = 1
shared = true
code = ["crates/state/src/checkpoint/manifest.rs#MANIFEST_VERSION"]

# The KAR1 batch on DA and L1. The batch stays there for all time. The
# batcher decodes its own last post at start, and the indexer and
# kardamom-reconstruct decode every post.
[format.kar1-batch]
writes = 5
reads_min = 4
reads_max = 5
shared = true
permanent = true
code = ["crates/batcher/src/frame.rs#BlockLayout"]

# Frozen layout. The batcher spool: one rkyv ClosedBlock per file, in the
# directory `spool/v<N>` of its version. A release opens only its own
# version directory. It drops every other entry of the spool root, and a
# spool whose block file does not decode, with a warning and a count. The
# dropped range is read again from the sealer, which keeps every frame
# above the posted head. A spool never stops the batcher.
[format.batcher-spool]
writes = 1
reads_min = 1
reads_max = 1
shared = false
code = [
    "crates/batcher/src/live/spool.rs#SPOOL_VERSION",
    "crates/batcher/src/batch.rs#pub struct ClosedBlock",
]
[format.batcher-spool.layout]
ClosedBlock = "rkyv size 48 align 8"
RecordedTx = "rkyv size 88 align 8"
RemoteEpochRecord = "rkyv size 64 align 8"

# Frozen layout. The batcher cursor, as serde JSON. An old reader ignores
# a new field. A new field has a serde default, so a new reader reads an
# old cursor.
[format.batcher-cursor]
writes = 1
reads_min = 1
reads_max = 1
shared = false
code = ["crates/batcher/src/live/cursor.rs#pub struct BatchCursor"]
[format.batcher-cursor.layout]
BatchCursor = '{"next_index":1,"next_block":2,"last_batch_index":3}'

# Frozen layout. The da-watcher L1 cursor: the block number and the block
# hash on one line. The reader ignores any field after the hash, so a
# later release can add one at the tail. A line with fewer fields, or a
# field that does not parse, is an operator halt (L1CursorUnreadable).
[format.l1-cursor]
writes = 1
reads_min = 1
reads_max = 1
shared = false
code = ["crates/da_watcher/src/l1_cursor.rs#pub struct L1Cursor"]
[format.l1-cursor.layout]
L1Cursor = "7 0x0707070707070707070707070707070707070707070707070707070707070707"

# Frozen layout. The rkyv records on the Aeron streams and in the tx_data
# archives: receipts, block deltas, boundaries, service events, transaction
# status, transaction errors, and transaction envelopes. An enum adds a
# variant only at the end.
[format.aeron-stream-records]
writes = 1
reads_min = 1
reads_max = 1
shared = true
code = [
    "crates/types/src/receipt.rs#pub struct Receipt",
    "crates/types/src/delta.rs#pub struct BlockDelta",
    "crates/types/src/boundary.rs#pub struct BlockBoundary",
    "crates/types/src/service.rs#pub struct ServiceEvent",
    "crates/types/src/tx_status.rs#pub struct TxStatus",
    "crates/types/src/tx_error.rs#pub struct TxError",
    "crates/types/src/envelope.rs#pub struct TxEnvelope",
]
[format.aeron-stream-records.layout]
Receipt = "rkyv size 256 align 16"
BlockDelta = "rkyv size 40 align 8"
BlockBoundary = "rkyv size 64 align 16"
ServiceEvent = "rkyv size 64 align 8"
TxStatus = "rkyv size 112 align 16"
TxError = "rkyv size 80 align 16"
TxEnvelope = "rkyv size 80 align 8"

# Frozen layout. The notifier outbox: rkyv OutboxRecord frames. An unknown
# stage code reads as no stage.
[format.notifier-outbox]
writes = 1
reads_min = 1
reads_max = 1
shared = false
code = ["crates/notifier/src/outbox.rs#pub struct OutboxRecord"]
[format.notifier-outbox.layout]
OutboxRecord = "rkyv size 120 align 8"

# Frozen layout. The Redis cache keys and values. Redis keeps no data on
# disk, and the cache is advisory. A new layout uses a new key prefix.
[format.redis-cache]
writes = 1
reads_min = 1
reads_max = 1
shared = true
code = ["crates/cache/src/keys.rs#pub fn receipt"]
[format.redis-cache.layout]
account = "acct:0x0000000000000000000000000000000000000000"
receipt = "rcpt:0x0000000000000000000000000000000000000000:5"
head = "head:3"
pending = "pending:0x0000000000000000000000000000000000000000"
index_tag = "00000000000000000007"

# The service discovery records in Consul. A runtime ignores a record of
# another version, so a mixed fleet does not find its peers. The version
# covers both runtime-owned record kinds: kardamom-mdc-publisher and
# kardamom-mdc-subscriber.
[format.discovery-record]
writes = 1
reads_min = 1
reads_max = 1
shared = true
code = ["crates/log/src/discovery/record.rs#DISCOVERY_VERSION"]

# Releases that break a rule on purpose. Each entry covers one version of
# one format: the version that the check names. Only an entry that is new
# against the base counts. docs/formats.md has the rules.
#
# [one_way.sealer-snapshot]
# version = 11
# reason = "The members write snapshot v11. A member of the base release cannot load it."
[one_way]

[coordinated]

[retired]

# Frozen layout. The canary's nonce journal: one serde JSON file per ring
# account. A file that does not parse stops the canary at start; the
# operator removes it after checking the account's nonce.
[format.canary-journal]
writes = 1
reads_min = 1
reads_max = 1
shared = false
code = ["crates/canary/src/ring/journal.rs#pub struct InFlight"]
[format.canary-journal.layout]
InFlight = '{"nonce":1,"hash":"0x0202020202020202020202020202020202020202020202020202020202020202","raw":"0x03","published":true}'

# Frozen layout. The canary's data directory: the contract addresses and
# the anchor hash, as serde JSON. A new field has a serde default.
[format.canary-store]
writes = 1
reads_min = 1
reads_max = 1
shared = false
code = ["crates/canary/src/store.rs#pub struct Contracts"]
[format.canary-store.layout]
Contracts = '{"counter":"0x0404040404040404040404040404040404040404"}'
anchor = '"0x0505050505050505050505050505050505050505050505050505050505050505"'
