# Bench-only contracts (kardamom-load --workload defi). Deliberately a
# SEPARATE foundry project: the parent project's settings are pinned for
# CREATE2 address stability and must not be perturbed. Nothing here is
# address-sensitive — the harness deploys fresh instances per run.
[profile.default]
src = "src"
out = "out"
libs = []
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
