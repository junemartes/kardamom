# PINNED SETTINGS — DO NOT CHANGE WITHOUT BUMPING THE FACTORY SALT SUFFIX
#
# The kardamom factory proxy address is derived from the compiled bytecode of
# KardamomFactoryV1 (via ERC-7955 CREATE2 factory + canonical salts). Any change
# below that affects the produced bytecode WILL shift the factory's canonical
# address. If you intend to change settings here:
#   1. Bump the salt suffix in crates/deployer/src/addresses.rs
#      (e.g. "kardamom.factory.proxy.v1" -> "v2")
#   2. Mirror the change in crates/deployer/build.rs (settings passed to
#      foundry-compilers); the two builders must produce byte-identical output
#      or the embedded bytecode parity check fails.
#   3. Regenerate contracts/expected_bytecode_hash.txt
#   4. Re-run cargo test -p kardamom-deployer --test factory_address_sync and
#      update KardamomUUPSBase.FACTORY with the new computed address.

[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
# bytecode_hash = "none" strips the CBOR metadata trailer so forge build and
# the cargo `foundry-compilers` invocation in crates/deployer/build.rs produce
# byte-identical bytecode (the trailer otherwise diverges due to solc path
# input differences).
bytecode_hash = "none"
fuzz = { runs = 256 }
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
tab_width = 4
