name: docker-e2e

on:
  # Runs on every PR (and pushes to main). Exercises the tx_data publish →
  # record → subscribe path against a real Aeron container (the per-component
  # docker_e2e smoke). The full multi-process pipeline proof moved to the
  # cluster-e2e workflow in the cluster-only migration (it requires the Aeron
  # Cluster). `skip-docker-e2e` on a PR opts out (e.g. docs-only changes).
  pull_request:
  push:
    branches: [main]
  # Manual trigger so contributors can fire it on demand.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Smaller than the default 200 so this CI job stays under 30 minutes.
  KARDAMOM_E2E_N: 100

jobs:
  full-pipeline-e2e:
    # Runs on every PR. Opt OUT with the `skip-docker-e2e` label for changes
    # that can't affect the pipeline (e.g. docs-only PRs) to keep their CI fast.
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-docker-e2e')
    name: full-pipeline-e2e
    runs-on: ubuntu-latest
    # Headroom for the two deposit round-trips on top of the original
    # transfer + smoke tests.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The Aeron Media Driver build requires cmake + libuuid headers; the
      # rusteron-* crates compile the C client from source via the cmake
      # build-script. Pre-install before we touch cargo.
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake uuid-dev libbsd-dev libssl-dev pkg-config build-essential

      - uses: dtolnay/rust-toolchain@stable
      # Foundry supplies `forge` (the deployer crate's build script shells
      # out to it to embed contract bytecode — `-p e2e --tests` builds the
      # deployer) and `anvil` for the L1-backed deposit round-trip. Without
      # anvil that test skips itself and passes vacuously.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pin a concrete version: `stable`/`latest` make foundryup hit the
          # GitHub releases API, which 403s under the unauthenticated per-IP
          # rate limit on Actions runners. A concrete tag downloads directly.
          version: v1.7.1
      # rusteron's build.rs compiles the Aeron C library with -march=native;
      # those objects land in target/ and travel in the rust cache. GitHub's
      # runner fleet is CPU-heterogeneous, so a cache populated on a newer
      # microarchitecture SIGILLs (exit 132) when restored on an older one —
      # observed as a 6/7-shard wave of sequencers crash-looping with empty
      # stderr the moment they touched Aeron. Key the cache by CPU model so
      # native objects never cross microarchitectures.
      - name: CPU microarch cache key
        id: cpukey
        run: echo "cpu=$(grep -m1 'model name' /proc/cpuinfo | md5sum | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docker-e2e
          prefix-key: v0-rust-${{ steps.cpukey.outputs.cpu }}

      # Sanity: ensure the Docker daemon is reachable (ubuntu-latest runners
      # ship with Docker pre-installed, but it's worth a quick probe so we
      # fail loudly here rather than mid-test).
      - name: docker info
        run: docker info

      # Build the kardamom-log docker-e2e test surface (the tx_data Aeron smoke
      # below). The full IPC-pipeline e2e (the in-process + multi-process
      # proof-of-pipeline + deposit round-trips) was REMOVED in the cluster-only
      # migration — those tests spawned the standalone sealer, which no longer
      # exists. That whole-pipeline coverage now lives in the cluster-e2e
      # workflow (real Aeron Cluster (Raft) + nomad + chaos cases).
      - name: cargo build (docker-e2e feature)
        run: |
          cargo build \
            -p kardamom-log \
            --features 'kardamom-log/docker-e2e' \
            --tests

      # Per-component docker_e2e smoke: tx_data publish → record → subscribe over
      # a real Aeron container. (tx_ordering is the cluster's job now; the legacy
      # tx_ordering Aeron docker_e2e was removed with the single-sealer path.)
      - name: per-component docker_e2e smoke
        run: |
          cargo test \
            -p kardamom-log \
            --features 'docker-e2e' \
            --test aeron_live_e2e -- --ignored --nocapture
