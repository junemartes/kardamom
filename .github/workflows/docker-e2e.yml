name: docker-e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-docker-e2e')
    name: build dependency recovery artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake uuid-dev libbsd-dev libssl-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/foundry
      - uses: ./.github/actions/solc-cache
      - uses: ./.github/actions/rust-build-cache
        with:
          shared-key: docker-e2e
      - name: Build and package the test runtime
        run: |
          python3 scripts/ci/dependency_tests.py prepare --bundle /tmp/dependency-bundle
          tar -C /tmp/dependency-bundle -cf - . | gzip -1 > /tmp/dependency-bundle.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-binaries
          path: /tmp/dependency-bundle.tgz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  dependency-recovery:
    needs: build
    name: dependency recovery (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dependency-binaries
          path: /tmp/dependency-artifact
      - name: Unpack the shared runtime
        run: |
          mkdir /tmp/dependency-bundle
          tar -C /tmp/dependency-bundle -xzf /tmp/dependency-artifact/dependency-bundle.tgz
          rm /tmp/dependency-artifact/dependency-bundle.tgz
      - uses: ./.github/actions/foundry
      - uses: ./.github/actions/aeron-jar
      - name: Run one shard without compilation
        run: |
          python3 scripts/ci/dependency_tests.py run --bundle /tmp/dependency-bundle --shard ${{ matrix.shard }} --output /tmp/dependency-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-results-${{ matrix.shard }}
          path: |
            /tmp/dependency-results
            /tmp/kardamom-ingress-account-profile.jsonl
          retention-days: 14
