name: docker-e2e

on:
  # Run on PRs that explicitly enable the label, plus pushes to main.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # Manual trigger so contributors can fire it on demand.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Smaller than the default 200 so this CI job stays under 30 minutes.
  KARDAMOM_E2E_N: 100

jobs:
  full-pipeline-e2e:
    # Only run on PRs that opt in via the "run-docker-e2e" label, or on
    # main pushes / manual dispatches. Skipping by default keeps PR CI fast
    # since cmake + the Aeron build + the container pull / build add 10-15
    # minutes of wall-clock.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-docker-e2e')
    name: full-pipeline-e2e
    runs-on: ubuntu-latest
    # Headroom for the two deposit round-trips on top of the original
    # transfer + smoke tests.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The Aeron Media Driver build requires cmake + libuuid headers; the
      # rusteron-* crates compile the C client from source via the cmake
      # build-script. Pre-install before we touch cargo.
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake uuid-dev libbsd-dev libssl-dev pkg-config build-essential

      - uses: dtolnay/rust-toolchain@stable
      # Foundry supplies `forge` (the deployer crate's build script shells
      # out to it to embed contract bytecode — `-p e2e --tests` builds the
      # deployer) and `anvil` for the L1-backed deposit round-trip. Without
      # anvil that test skips itself and passes vacuously.
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docker-e2e

      # Sanity: ensure the Docker daemon is reachable (ubuntu-latest runners
      # ship with Docker pre-installed, but it's worth a quick probe so we
      # fail loudly here rather than mid-test).
      - name: docker info
        run: docker info

      # Build the workspace's docker-e2e feature surface so the test
      # binary is up to date before we cargo-test the ignored case.
      - name: cargo build (docker-e2e feature)
        run: |
          cargo build \
            -p kardamom-log \
            -p e2e \
            --features 'kardamom-log/docker-e2e,e2e/full-pipeline-e2e' \
            --tests

      # Run the headline test: the cross-component proof-of-pipeline
      # (the in-process variant that wires all services as tokio tasks
      # against one shared Aeron container).
      - name: full-pipeline-e2e proof-of-pipeline test
        run: |
          cargo test \
            -p e2e \
            --features 'full-pipeline-e2e' \
            --test full_pipeline_e2e -- --ignored --nocapture proof_of_pipeline

      # Multi-process variant: spawn each kardamom-* binary as its own
      # OS process pointed at the bind-mounted Aeron container, drive
      # transfers through the proxy's JSON-RPC server. The most realistic
      # deployment shape — matches what ansible / nomad would launch.
      - name: full-pipeline-e2e multi-process test
        run: |
          cargo test \
            -p e2e \
            --features 'full-pipeline-e2e' \
            --test multiprocess_e2e -- --ignored --nocapture multiprocess_e2e_signed_transfer_round_trip

      # Deposit round-trip: da-watcher feeds a deposit through the
      # tx_deposits stream, the executor mints it on L2 and the receipt
      # surfaces over JSON-RPC.
      - name: full-pipeline-e2e deposit round-trip
        run: |
          cargo test \
            -p e2e \
            --features 'full-pipeline-e2e' \
            --test multiprocess_e2e -- --ignored --nocapture multiprocess_e2e_deposit_round_trip

      # L1-backed variant: real anvil L1, ETHLockbox deployed via the
      # factory, deposit observed at `finalized` by the da-watcher and
      # minted on L2.
      - name: full-pipeline-e2e anvil L1 deposit round-trip
        run: |
          cargo test \
            -p e2e \
            --features 'full-pipeline-e2e' \
            --test multiprocess_e2e -- --ignored --nocapture anvil_pipeline_e2e_l1_deposit_and_l2_round_trip

      # Per-component docker_e2e smoke tests (gate-only today; they bring up
      # AeronTestCluster and assert the harness comes up). Run after the
      # headline test so a failure there is the headline failure.
      - name: per-component docker_e2e smoke
        run: |
          cargo test \
            -p kardamom-log \
            --features 'docker-e2e' \
            --test docker_e2e -- --ignored --nocapture
          cargo test \
            -p kardamom-log \
            --features 'docker-e2e' \
            --test aeron_live_e2e -- --ignored --nocapture
