name: chain-semantics-e2e

on:
  # Target L of the chain-semantics suite
  # (docs/agents/chain-semantics-e2e-suite-spec.md): the scenario drivers
  # against the local stack — real service binaries + a 1-member Java Aeron
  # Cluster sealer + per-test media drivers, observed through JSON-RPC and
  # /metrics only. Runs on every PR; opt out with the `skip-chain-semantics`
  # label for changes that cannot affect the pipeline (e.g. docs-only PRs).
  # Target C (the same drivers on the cluster-e2e DinD cluster) lands as a
  # cluster-e2e shard separately.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-chain-semantics')
    name: build chain-semantics artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The rusteron-* crates compile the Aeron C client from source via a
      # cmake build script.
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake uuid-dev libbsd-dev libssl-dev pkg-config build-essential

      - uses: dtolnay/rust-toolchain@stable
      # Foundry supplies `forge`: the deployer crate's build script shells
      # out to it to embed contract bytecode, and `-p e2e --tests` builds the
      # deployer. Pinned concrete version (stable/latest hit the GitHub
      # releases API and 403 under the runner's unauthenticated rate limit).
      - uses: ./.github/actions/foundry
      # forge build downloads the pinned solc on a cold host; the cache
      # keeps that download off binaries.soliditylang.org.
      - uses: ./.github/actions/solc-cache
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/rust-build-cache
        with:
          shared-key: chain-semantics-e2e

      - name: Build the sealer jar
        working-directory: cluster/sealer-service
        run: ./gradlew :service:shadowJar

      - uses: ./.github/actions/aeron-jar

      - name: Build and package the semantics runtime
        run: |
          python3 scripts/ci/semantics_tests.py prepare --bundle /tmp/semantics-bundle
          tar -C /tmp/semantics-bundle -cf - . | gzip -1 > /tmp/semantics-bundle.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: semantics-binaries
          path: /tmp/semantics-bundle.tgz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  chain-semantics:
    needs: build
    name: chain-semantics-e2e (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: semantics-binaries
          path: /tmp/semantics-artifact
      - name: Unpack the shared runtime
        run: |
          mkdir /tmp/semantics-bundle
          tar -C /tmp/semantics-bundle -xzf /tmp/semantics-artifact/semantics-bundle.tgz
          rm /tmp/semantics-artifact/semantics-bundle.tgz
      - uses: ./.github/actions/foundry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run one shard without compilation
        run: |
          python3 scripts/ci/semantics_tests.py run --bundle /tmp/semantics-bundle --shard ${{ matrix.shard }} --output /tmp/semantics-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantics-results-${{ matrix.shard }}
          path: /tmp/semantics-results
          retention-days: 3
