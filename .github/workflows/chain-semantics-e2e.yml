name: chain-semantics-e2e

on:
  # Target L of the chain-semantics suite
  # (docs/agents/chain-semantics-e2e-suite-spec.md): the scenario drivers
  # against the local stack — real service binaries + a 1-member Java Aeron
  # Cluster sealer + per-test media drivers, observed through JSON-RPC and
  # /metrics only. Runs on every PR; opt out with the `skip-chain-semantics`
  # label for changes that cannot affect the pipeline (e.g. docs-only PRs).
  # Target C (the same drivers on the cluster-e2e DinD cluster) lands as a
  # cluster-e2e shard separately.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Mirrors AERON_JAR_VERSION in the justfile (`just aeron-jar`).
  AERON_JAR_VERSION: 1.45.0
  # The shards of the suite. The `shard` matrix below names each index.
  SHARDS: 4

jobs:
  # One compile for the whole suite: the service binaries, the test
  # executable and the sealer jar, packed as one artifact.
  build:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-chain-semantics')
    name: chain-semantics build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The rusteron-* crates compile the Aeron C client from source via a
      # cmake build script.
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake uuid-dev libbsd-dev libssl-dev pkg-config build-essential

      - uses: dtolnay/rust-toolchain@stable
      # Foundry supplies `forge`: the deployer crate's build script shells
      # out to it to embed contract bytecode, and `-p e2e --tests` builds the
      # deployer. Pinned concrete version (stable/latest hit the GitHub
      # releases API and 403 under the runner's unauthenticated rate limit).
      - uses: ./.github/actions/foundry
      # forge build downloads the pinned solc on a cold host; the cache
      # keeps that download off binaries.soliditylang.org.
      - uses: ./.github/actions/solc-cache
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The dev-profile caches that the CI test job saves on a base branch.
      - uses: ./.github/actions/rust-build-cache
        with:
          shared-key: dev
          save-if: false

      - name: Build the sealer jar
        working-directory: cluster/sealer-service
        run: ./gradlew :service:shadowJar

      # Every binary a scenario spawns or shells out to: the pipeline three,
      # the validator (S6/S7), statecheck (S6's CLI check), the da-watcher
      # (S1/S2 bridge), reconstruct (S8's DA-parity gate), and the batcher
      # and the egress (S13e/S13f/S13g, the carry window).
      - name: Build service binaries
        run: |
          set -o pipefail
          cargo build --locked --bins --message-format=json-render-diagnostics \
            -p kardamom-ingress -p kardamom-sequencer -p kardamom-executor \
            -p kardamom-validator -p kardamom-state -p kardamom-da-watcher -p kardamom-l1-indexer \
            -p kardamom-batcher -p kardamom-reconstruct -p kardamom-notifier -p kardamom-canary \
            -p kardamom-egress | tee /tmp/bins.jsonl \
            | jq -r 'select(.reason == "compiler-message") | .message.rendered'

      - name: Build the suite
        run: |
          set -o pipefail
          cargo test -p e2e --features full-pipeline-e2e --test chain_semantics --locked \
            --no-run --message-format=json-render-diagnostics | tee /tmp/suite.jsonl \
            | jq -r 'select(.reason == "compiler-message") | .message.rendered'

      # The harness finds the service binaries next to the test executable
      # (target/debug), so the bundle keeps the paths of the build. Cargo
      # gives a test the native library paths of the build scripts; a shard
      # gets the Aeron libraries from target/debug/native instead.
      - name: Pack the suite
        run: |
          set -euo pipefail
          jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' \
            /tmp/bins.jsonl /tmp/suite.jsonl | sort -u > /tmp/executables
          paths="$(jq -r 'select(.reason == "build-script-executed") | .linked_paths[]' /tmp/bins.jsonl /tmp/suite.jsonl \
            | sed 's/^[a-z]*=//' | sort -u | paste -sd:)"
          mkdir -p target/debug/native
          while read -r exe; do
            LD_LIBRARY_PATH="$paths" ldd "$exe" | awk '/=> \// {print $3}' \
              | grep -v -e '^/lib' -e '^/usr/lib' || true
          done < /tmp/executables | sort -u | xargs -r cp -t target/debug/native
          if LD_LIBRARY_PATH="$PWD/target/debug/native" xargs -a /tmp/executables ldd | grep 'not found'; then
            echo "a native library is missing from the bundle" >&2
            exit 1
          fi
          xargs -a /tmp/executables strip --strip-debug
          sed "s|^$PWD/||" /tmp/executables > /tmp/members
          echo target/debug/native >> /tmp/members
          echo cluster/sealer-service/service/build/libs/kardamom-cluster-node.jar >> /tmp/members
          tar -czf /tmp/chain-semantics.tar.gz -T /tmp/members
          ls -lh /tmp/chain-semantics.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: chain-semantics-bundle
          path: /tmp/chain-semantics.tar.gz
          retention-days: 3

  # Each test brings up its own stack (2 JVMs + 4 service processes), and
  # the L1-backed ones add an anvil on top. Two of those at once on one
  # runner starve the Aeron media driver: it shows up as "MediaDriver
  # keepalive: age>10000ms" and then a scenario times out waiting for a
  # receipt that the wedged transport never delivered. So each shard runs
  # its tests one at a time, and the shards run on their own runners. A
  # shard takes every SHARDS-th test in name order. The serial suite takes
  # 14 to 21 minutes on one runner, and the largest shard about a third.
  shard:
    name: chain-semantics (shard ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      # anvil for the L1-backed scenarios.
      - uses: ./.github/actions/foundry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache the aeron-all jar
        run: |
          mkdir -p /tmp/kardamom-aeron-local
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            "https://repo1.maven.org/maven2/io/aeron/aeron-all/${AERON_JAR_VERSION}/aeron-all-${AERON_JAR_VERSION}.jar" \
            -o "/tmp/kardamom-aeron-local/aeron-all-${AERON_JAR_VERSION}.jar"
      - uses: actions/download-artifact@v4
        with:
          name: chain-semantics-bundle
          path: /tmp/chain-semantics
      - run: tar -xzf /tmp/chain-semantics/chain-semantics.tar.gz
      # The test runs from the package directory, as under `cargo test`.
      - name: Run the chain-semantics shard (Target L)
        working-directory: crates/e2e
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/debug/native"
          suite="$(ls "$GITHUB_WORKSPACE"/target/debug/deps/chain_semantics-*)"
          "$suite" --ignored --list --format terse | sed -n 's/: test$//p' | sort \
            | awk -v n="$SHARDS" -v i="$SHARD" '(NR - 1) % n == i' > /tmp/tests
          echo "shard $SHARD of $SHARDS: $(wc -l < /tmp/tests) tests"
          # With no name, the executable would run every test.
          [ -s /tmp/tests ] || exit 0
          xargs -a /tmp/tests "$suite" --ignored --nocapture --test-threads=1 --exact

  # The required check: it passes when every shard passed, or when the
  # label skipped the suite.
  chain-semantics:
    name: chain-semantics-e2e
    needs: [build, shard]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Every shard passed
        env:
          BUILD: ${{ needs.build.result }}
          SHARDS_RESULT: ${{ needs.shard.result }}
          SKIPPED: ${{ contains(github.event.pull_request.labels.*.name, 'skip-chain-semantics') }}
        run: |
          [ "$SKIPPED" = true ] && [ "$BUILD" = skipped ] && exit 0
          [ "$SHARDS_RESULT" = success ] || { echo "build: $BUILD, shards: $SHARDS_RESULT" >&2; exit 1; }
