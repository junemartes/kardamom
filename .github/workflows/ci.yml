name: CI

on:
  # A push to a base branch saves the build caches. A pull request only
  # restores them (.github/actions/rust-build-cache).
  push:
    branches: [main, 'integration/**']
  pull_request:
  # Manual trigger. The three e2e workflows already have one; CI lacking it
  # meant that when GitHub stopped delivering `pull_request` events for a
  # branch, the lint/test lane was the one lane with no way to run at all.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Mechanical checks from docs/STYLE.md: `just style` runs clippy
  # (pedantic, with every default lint as an error), rustfmt and the
  # forbidden patterns. The job also checks the no_std build of the exec
  # core and the format registry. One job for all of them gives each push
  # one clippy compile.
  style:
    name: style
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: riscv32imac-unknown-none-elf
      - uses: ./.github/actions/foundry
      # forge build downloads the pinned solc on a cold host; the cache
      # keeps that download off binaries.soliditylang.org.
      - uses: ./.github/actions/solc-cache
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libbsd-dev uuid-dev
      - uses: ./.github/actions/rust-build-cache
        with:
          shared-key: check
          save-if: ${{ github.event_name == 'push' }}
      - uses: ./.github/actions/just
      - run: just style
      # The exec core (and the types crate under it) must stay linkable
      # inside a zk-guest build: `no_std` + `alloc`, no Aeron/libmdbx/tokio.
      # A bare-metal target is the only reliable gate. A host-target check
      # with --no-default-features still links std transitively and passes.
      - name: no_std exec-core
        run: cargo check -p kardamom-types -p kardamom-exec-core --no-default-features --target riscv32imac-unknown-none-elf --locked
      # The format registry against the base branch (docs/formats.md). The
      # checkout of a pull request is its merge into the base, so the tip
      # of the base branch is the base revision.
      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
      - name: Check formats against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: just check-formats "origin/$BASE_REF"
      - run: python3 -m unittest discover -s scripts/hooks/tests
      - run: python3 -m unittest discover -s scripts/ci/tests

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/foundry
      # forge build downloads the pinned solc on a cold host; the cache
      # keeps that download off binaries.soliditylang.org.
      - uses: ./.github/actions/solc-cache
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libbsd-dev uuid-dev
      - uses: ./.github/actions/rust-build-cache
      - name: Build workspace and capture test artifacts
        run: cargo build --workspace --all-targets --locked --message-format=json-render-diagnostics > /tmp/workspace-build.jsonl
      - name: Package in-process recovery tests
        run: |
          python3 scripts/ci/component_tests.py prepare --artifacts /tmp/workspace-build.jsonl --bundle /tmp/component-bundle
          tar -C /tmp/component-bundle -czf /tmp/component-bundle.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: component-test-binaries
          path: /tmp/component-bundle.tar.gz
          retention-days: 3

  component-recovery:
    name: in-process recovery (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: component-test-binaries
          path: /tmp/component-download
      - name: Run prebuilt actor recovery tests
        run: |
          mkdir /tmp/component-bundle
          tar -C /tmp/component-bundle -xzf /tmp/component-download/component-bundle.tar.gz
          python3 scripts/ci/component_tests.py run --bundle /tmp/component-bundle --shard ${{ matrix.shard }} --output /tmp/component-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-results-${{ matrix.shard }}
          path: /tmp/component-results
          if-no-files-found: error
          retention-days: 7

  # The sealer's JUnit suite (~2,250 lines: failover, replay, snapshot
  # restore, fanout, contiguity guard) previously ran on no workflow — both
  # Gradle-touching workflows only built shadowJar
  # (docs/agents/l1-client-suite-port-spec.md, W3).
  sealer-test:
    name: sealer tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            cluster/sealer-service/**/*.gradle
            cluster/sealer-service/gradle/wrapper/gradle-wrapper.properties
      - name: Run sealer JUnit suite
        working-directory: cluster/sealer-service
        run: ./gradlew :core:test :core:allocationGate :service:test --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sealer-test-reports
          path: |
            cluster/sealer-service/core/build/reports/tests
            cluster/sealer-service/service/build/reports/tests/test

  # EEST state-test conformance against the pinned fixture release
  # (docs/agents/l1-client-suite-port-spec.md, W1). Latest fork only; the
  # xfail list is crates/exec-core/tests/eest_expected_failures.json.
  eest-conformance:
    name: eest conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/just
      # A release build of one test. It restores the release caches that
      # the allocation gate saves.
      - uses: ./.github/actions/rust-build-cache
        with:
          shared-key: release
          save-if: false
      - name: Fixture tag
        id: eest
        run: echo "tag=$(just eest-tag)" >> "$GITHUB_OUTPUT"
      - name: Cache fixtures
        uses: actions/cache@v4
        with:
          path: ~/.cache/kardamom/eest
          key: eest-fixtures-${{ steps.eest.outputs.tag }}
      - name: Fetch fixtures
        run: just eest-fixtures
      - name: Run conformance
        run: |
          KARDAMOM_EEST_FIXTURES="$(just eest-fixtures | tail -1)" \
            cargo test -p kardamom-exec-core --release --test eest_state --locked -- --ignored --nocapture

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/foundry
      # forge build downloads the pinned solc on a cold host; the cache
      # keeps that download off binaries.soliditylang.org.
      - uses: ./.github/actions/solc-cache
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libbsd-dev uuid-dev
      # The dev-profile caches. This job compiles every target of the
      # workspace, so it saves them for the other dev-profile jobs.
      - uses: ./.github/actions/rust-build-cache
        with:
          shared-key: dev
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo test --workspace --all-targets --locked
      - name: Component evidence runner checks
        run: python3 scripts/tests/test_components.py

  doc-test:
    name: doc-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/foundry
      # forge build downloads the pinned solc on a cold host; the cache
      # keeps that download off binaries.soliditylang.org.
      - uses: ./.github/actions/solc-cache
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libbsd-dev uuid-dev
      - uses: ./.github/actions/rust-build-cache
        with:
          shared-key: dev
          save-if: false
      - run: cargo test --workspace --doc --locked

  # Every Solidity check on one runner: each one takes a minute or less,
  # and five runners for them cost more queue time than they save. The
  # steps run even when an earlier one fails, so that one run reports
  # every finding.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/foundry
      # forge build downloads the pinned solc on a cold host; the cache
      # keeps that download off binaries.soliditylang.org.
      - uses: ./.github/actions/solc-cache
      - uses: ./.github/actions/just
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: forge fmt
        run: forge fmt --check
      - name: Install contract dependencies
        if: ${{ !cancelled() }}
        run: |
          forge install --no-git --shallow \
            foundry-rs/forge-std \
            openzeppelin/openzeppelin-contracts@v5.0.2 \
            openzeppelin/openzeppelin-contracts-upgradeable@v5.0.2
      - name: forge build
        id: build
        if: ${{ !cancelled() }}
        run: forge build --sizes
      # The Rust `sol!` bindings read the committed ABIs, so they must match
      # this build.
      - name: ABI check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: just abi-check
        working-directory: .
      - name: forge test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: forge test -vvv
      - name: solhint
        if: ${{ !cancelled() }}
        run: |
          npm install -g solhint@5.0.5
          solhint --max-warnings 0 -c .solhint.json 'src/**/*.sol'
          solhint --max-warnings 0 -c test/.solhint.json 'test/**/*.sol'
      - name: slither
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: medium

  alloc-gate:
    name: allocation regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System deps (Aeron FFI links libbsd/uuid)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libbsd-dev uuid-dev
      - uses: dtolnay/rust-toolchain@stable
      # The DHAT build in the release profile. It saves the release
      # caches, which the EEST job restores too.
      - uses: ./.github/actions/rust-build-cache
        with:
          shared-key: release
          save-if: ${{ github.event_name == 'push' }}
      - uses: ./.github/actions/just
      - name: DHAT allocation ceilings (perf/alloc-baselines.env)
        run: just alloc-gate
