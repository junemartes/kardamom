name: CI

on:
  # A push to a base branch saves the build caches. A pull request only
  # restores them (.github/actions/rust-build-cache).
  push:
    branches: [main, 'integration/**']
  pull_request:
  # Manual trigger. The three e2e workflows already have one; CI lacking it
  # meant that when GitHub stopped delivering `pull_request` events for a
  # branch, the lint/test lane was the one lane with no way to run at all.
  workflow_dispatch:

# A new push to a pull request cancels its older run. A push to a base
# branch never cancels a run: that run saves the build caches, and the
# base branch gets a new merge often. A newer push waits, and GitHub keeps
# only the newest waiting run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Mechanical checks from docs/STYLE.md: `just style` runs clippy
  # (pedantic, with every default lint as an error), rustfmt and the
  # forbidden patterns. The job also checks the no_std build of the exec
  # core and the format registry. One job for all of them gives each push
  # one clippy compile.
  style:
    name: style
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: riscv32imac-unknown-none-elf
      - uses: ./.github/actions/foundry
      # forge build downloads the pinned solc on a cold host; the cache
      # keeps that download off binaries.soliditylang.org.
      - uses: ./.github/actions/solc-cache
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libbsd-dev uuid-dev
      - uses: ./.github/actions/rust-build-cache
        with:
          shared-key: check
          save-if: ${{ github.event_name == 'push' }}
      - uses: ./.github/actions/just
      - run: just style
      # The exec core (and the types crate under it) must stay linkable
      # inside a zk-guest build: `no_std` + `alloc`, no Aeron/libmdbx/tokio.
      # A bare-metal target is the only reliable gate. A host-target check
      # with --no-default-features still links std transitively and passes.
      - name: no_std exec-core
        run: cargo check -p kardamom-types -p kardamom-exec-core --no-default-features --target riscv32imac-unknown-none-elf --locked
      # The format registry against the base branch (docs/formats.md). The
      # checkout of a pull request is its merge into the base, so the tip
      # of the base branch is the base revision.
      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
      - name: Check formats against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: just check-formats "origin/$BASE_REF"
      - run: python3 -m unittest discover -s scripts/hooks/tests
      - run: python3 -m unittest discover -s scripts/ci/tests

  # One compile of every workspace test target. The docker features of the
  # component suites are on, so the same build supplies the component bundle
  # and the nextest archive of the workspace tests. Only pushes save the
  # compiler cache; a pull request restores the cache of its base branch.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Line tables keep file and line numbers in backtraces. Full debug info
    # makes the test binaries several times larger, and the archive and the
    # upload of the binaries take minutes.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/foundry
      # forge build downloads the pinned solc on a cold host; the cache
      # keeps that download off binaries.soliditylang.org.
      - uses: ./.github/actions/solc-cache
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libbsd-dev uuid-dev
      - uses: ./.github/actions/rust-build-cache
        with:
          save-if: ${{ github.event_name == 'push' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Build the workspace tests
        run: |
          features="$(python3 scripts/ci/component_tests.py features)"
          cargo test --workspace --locked --no-run --features "$features" \
            --message-format=json-render-diagnostics > /tmp/workspace-build.jsonl
          # A stack suite runs the service binaries; build them only when the catalog has one.
          if python3 scripts/ci/component_tests.py has-stack; then
            cargo build --workspace --locked --bins --features "$features" \
              --message-format=json-render-diagnostics > /tmp/workspace-services.jsonl
          fi
          cargo nextest archive --workspace --locked --features "$features" \
            --zstd-level 1 --archive-file /tmp/workspace-tests.tar.zst
      - name: Package the component recovery tests
        run: |
          logs=(--artifacts /tmp/workspace-build.jsonl)
          if [ -e /tmp/workspace-services.jsonl ]; then logs+=(--artifacts /tmp/workspace-services.jsonl); fi
          python3 scripts/ci/component_tests.py prepare "${logs[@]}" --bundle /tmp/component-bundle
          tar -C /tmp/component-bundle -cf - . | zstd -T0 -3 -q -o /tmp/component-bundle.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: component-test-binaries
          path: /tmp/component-bundle.tar.zst
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-nextest-archive
          path: /tmp/workspace-tests.tar.zst
          compression-level: 0
          retention-days: 3

  # The compiled sealer test runtime. A component shard runs JUnit methods
  # from it without Gradle.
  sealer-runtime:
    name: build sealer tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Package the sealer test runtime
        run: |
          python3 scripts/ci/component_tests.py prepare-sealer --sealer /tmp/sealer-runtime
          tar -C /tmp/sealer-runtime -czf /tmp/sealer-runtime.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: component-sealer-runtime
          path: /tmp/sealer-runtime.tar.gz
          compression-level: 0
          retention-days: 3

  # Every catalogued component suite: in-process, docker and gradle tests,
  # in a fixed number of shards planned from scripts/ci/component-timings.json.
  # A shard compiles nothing. It pulls the docker images once, or loads them
  # from the cache that a push saves.
  component-recovery:
    name: component recovery (${{ matrix.shard }})
    needs: [build, sealer-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/foundry
      - uses: ./.github/actions/aeron-jar
      # The key names every image tag, and the week. A new tag in the list
      # or a tag that moves upstream refreshes the cache within a week.
      - name: Name the docker image cache
        id: image-key
        run: |
          tags="$(python3 scripts/ci/component_tests.py image-names | tr ' ' '-' | tr -c 'a-zA-Z0-9.-' '_')"
          echo "key=component-images-v2-${tags}-${{ hashFiles('crates/log/docker/aeron/**') }}-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: images
        with:
          path: /tmp/component-images.tar.zst
          key: ${{ steps.image-key.outputs.key }}
      - name: Start the docker images in the background
        env:
          CACHED: ${{ steps.images.outputs.cache-hit }}
        run: |
          if [ "$CACHED" = "true" ]; then
            nohup sh -c 'zstd -dc /tmp/component-images.tar.zst | docker load -q && touch /tmp/images.ok' > /tmp/images.log 2>&1 &
          else
            nohup sh -c 'python3 scripts/ci/component_tests.py images && touch /tmp/images.ok' > /tmp/images.log 2>&1 &
          fi
      - uses: actions/download-artifact@v4
        with:
          name: component-test-binaries
          path: /tmp/component-download
      - uses: actions/download-artifact@v4
        with:
          name: component-sealer-runtime
          path: /tmp/component-download
      - name: Unpack the bundles
        run: |
          mkdir /tmp/component-bundle /tmp/sealer-runtime
          zstd -dc /tmp/component-download/component-bundle.tar.zst | tar -C /tmp/component-bundle -xf -
          tar -C /tmp/sealer-runtime -xzf /tmp/component-download/sealer-runtime.tar.gz
          rm -r /tmp/component-download
      - name: Wait for the docker images
        run: |
          while ! [ -e /tmp/images.ok ] && pgrep -f "docker load|component_tests.py images" > /dev/null; do sleep 1; done
          cat /tmp/images.log
          test -e /tmp/images.ok
      - name: Run the shard
        run: |
          python3 scripts/ci/component_tests.py run --shard ${{ matrix.shard }} \
            --bundle /tmp/component-bundle --sealer /tmp/sealer-runtime --output /tmp/component-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-results-${{ matrix.shard }}
          path: /tmp/component-results
          if-no-files-found: error
          retention-days: 7
      - name: Save the docker images
        if: github.event_name == 'push' && matrix.shard == 0 && steps.images.outputs.cache-hit != 'true'
        run: docker save $(python3 scripts/ci/component_tests.py image-names) | zstd -T0 -3 -q -o /tmp/component-images.tar.zst
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && matrix.shard == 0 && steps.images.outputs.cache-hit != 'true'
        with:
          path: /tmp/component-images.tar.zst
          key: ${{ steps.image-key.outputs.key }}

  # The JUnit suite of the sealer, less the methods of the component
  # recovery catalog.
  sealer-test:
    name: sealer tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            cluster/sealer-service/**/*.gradle
            cluster/sealer-service/gradle/wrapper/gradle-wrapper.properties
      # The component recovery shards run the catalogued JUnit methods. This
      # job runs the rest, so that each test runs once.
      - name: Leave out the catalogued sealer tests
        run: python3 scripts/ci/sealer_excludes.py "$RUNNER_TEMP/sealer-excludes.gradle"
      - name: Run sealer JUnit suite
        working-directory: cluster/sealer-service
        run: ./gradlew --init-script "$RUNNER_TEMP/sealer-excludes.gradle" :core:test :core:allocationGate :service:test --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sealer-test-reports
          path: |
            cluster/sealer-service/core/build/reports/tests
            cluster/sealer-service/service/build/reports/tests/test

  # EEST state-test conformance against the pinned fixture release
  # (docs/agents/l1-client-suite-port-spec.md, W1). Latest fork only; the
  # xfail list is crates/exec-core/tests/eest_expected_failures.json.
  eest-conformance:
    name: eest conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/just
      # A release build of one test. It restores the release caches that
      # the allocation gate saves.
      - uses: ./.github/actions/rust-build-cache
        with:
          shared-key: release
          save-if: false
      - name: Fixture tag
        id: eest
        run: echo "tag=$(just eest-tag)" >> "$GITHUB_OUTPUT"
      - name: Cache fixtures
        uses: actions/cache@v4
        with:
          path: ~/.cache/kardamom/eest
          key: eest-fixtures-${{ steps.eest.outputs.tag }}
      - name: Fetch fixtures
        run: just eest-fixtures
      - name: Run conformance
        run: |
          KARDAMOM_EEST_FIXTURES="$(just eest-fixtures | tail -1)" \
            cargo test -p kardamom-exec-core --release --test eest_state --locked -- --ignored --nocapture

  # The workspace tests from the nextest archive of the build job: this
  # job compiles nothing. The archive holds the lib, bin, test and example
  # targets. nextest cannot list a test target without the libtest harness
  # (alloc_stage_table), so the filter leaves it out, and the doc-test job
  # runs it with the bench targets.
  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # anvil and forge for the tests that start an L1 or build contracts.
      - uses: ./.github/actions/foundry
      - uses: ./.github/actions/solc-cache
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: actions/download-artifact@v4
        with:
          name: workspace-nextest-archive
          path: /tmp/workspace-archive
      # The archive goes to target/ of the checkout, the path of the build
      # job: a test that finds a binary by its compile-time path
      # (CARGO_BIN_EXE_*) finds it there.
      - name: Run the workspace tests
        run: |
          cargo nextest run --archive-file /tmp/workspace-archive/workspace-tests.tar.zst \
            --workspace-remap . --extract-to . --extract-overwrite --no-fail-fast \
            -E 'not binary_id(kardamom-notifier::alloc_stage_table)'
      - name: Component evidence runner checks
        run: python3 scripts/tests/test_components.py

  doc-test:
    name: doc-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/foundry
      # forge build downloads the pinned solc on a cold host; the cache
      # keeps that download off binaries.soliditylang.org.
      - uses: ./.github/actions/solc-cache
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libbsd-dev uuid-dev
      # The dev-profile caches. This job compiles the libraries and the
      # benches of the workspace, so it saves them for the other
      # dev-profile jobs.
      - uses: ./.github/actions/rust-build-cache
        with:
          shared-key: dev
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo test --workspace --doc --locked
      # The bench targets in test mode: each benchmark runs once. The
      # nextest archive of the test job holds no bench target, and nextest
      # cannot list the test target without the libtest harness.
      - run: cargo test --workspace --benches --test alloc_stage_table --locked

  # Every Solidity check on one runner: each one takes a minute or less,
  # and five runners for them cost more queue time than they save. The
  # steps run even when an earlier one fails, so that one run reports
  # every finding.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/foundry
      # forge build downloads the pinned solc on a cold host; the cache
      # keeps that download off binaries.soliditylang.org.
      - uses: ./.github/actions/solc-cache
      - uses: ./.github/actions/just
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: forge fmt
        run: forge fmt --check
      - name: Install contract dependencies
        if: ${{ !cancelled() }}
        run: |
          forge install --no-git --shallow \
            foundry-rs/forge-std \
            openzeppelin/openzeppelin-contracts@v5.0.2 \
            openzeppelin/openzeppelin-contracts-upgradeable@v5.0.2
      - name: forge build
        id: build
        if: ${{ !cancelled() }}
        run: forge build --sizes
      # The Rust `sol!` bindings read the committed ABIs, so they must match
      # this build.
      - name: ABI check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: just abi-check
        working-directory: .
      - name: forge test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: forge test -vvv
      - name: solhint
        if: ${{ !cancelled() }}
        run: |
          npm install -g solhint@5.0.5
          solhint --max-warnings 0 -c .solhint.json 'src/**/*.sol'
          solhint --max-warnings 0 -c test/.solhint.json 'test/**/*.sol'
      - name: slither
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: medium

  alloc-gate:
    name: allocation regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System deps (Aeron FFI links libbsd/uuid)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libbsd-dev uuid-dev
      - uses: dtolnay/rust-toolchain@stable
      # The DHAT build in the release profile. It saves the release
      # caches, which the EEST job restores too.
      - uses: ./.github/actions/rust-build-cache
        with:
          shared-key: release
          save-if: ${{ github.event_name == 'push' }}
      - uses: ./.github/actions/just
      - name: DHAT allocation ceilings (perf/alloc-baselines.env)
        run: just alloc-gate
