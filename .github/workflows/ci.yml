name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. The three e2e workflows already have one; CI lacking it
  # meant that when GitHub stopped delivering `pull_request` events for a
  # branch, the lint/test lane was the one lane with no way to run at all.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libbsd-dev uuid-dev
      # rusteron's build.rs compiles the Aeron C library with -march=native
      # (hardcoded, no opt-out); those objects land in target/ and travel in
      # the rust cache. GitHub's runner fleet is CPU-heterogeneous, so a cache
      # populated on a wider-ISA VM SIGILLs (exit 132, empty stderr) when
      # restored on a narrower one — observed as multi-shard waves of
      # sequencers crash-looping the moment they touched Aeron. Key the cache
      # by the CPU's feature-flag set so native objects never cross ISAs.
      - name: CPU microarch cache key
        id: cpukey
        # Key by the CPUID FEATURE FLAGS, not the model name: hypervisors mask
        # feature bits per VM independently of the brand string, and the reroll
        # SIGILL'd again on a full-match model-name cache (host runnervmvrwv9
        # reports the same model as the fleet but a narrower ISA). The flags
        # line is exactly the surface -march=native compiles against.
        run: echo "cpu=$(grep -m1 '^flags' /proc/cpuinfo | md5sum | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.cpukey.outputs.cpu }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libbsd-dev uuid-dev
      # rusteron's build.rs compiles the Aeron C library with -march=native
      # (hardcoded, no opt-out); those objects land in target/ and travel in
      # the rust cache. GitHub's runner fleet is CPU-heterogeneous, so a cache
      # populated on a wider-ISA VM SIGILLs (exit 132, empty stderr) when
      # restored on a narrower one — observed as multi-shard waves of
      # sequencers crash-looping the moment they touched Aeron. Key the cache
      # by the CPU's feature-flag set so native objects never cross ISAs.
      - name: CPU microarch cache key
        id: cpukey
        # Key by the CPUID FEATURE FLAGS, not the model name: hypervisors mask
        # feature bits per VM independently of the brand string, and the reroll
        # SIGILL'd again on a full-match model-name cache (host runnervmvrwv9
        # reports the same model as the fleet but a narrower ISA). The flags
        # line is exactly the surface -march=native compiles against.
        run: echo "cpu=$(grep -m1 '^flags' /proc/cpuinfo | md5sum | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.cpukey.outputs.cpu }}
      - run: cargo build --workspace --all-targets --locked

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libbsd-dev uuid-dev
      # rusteron's build.rs compiles the Aeron C library with -march=native
      # (hardcoded, no opt-out); those objects land in target/ and travel in
      # the rust cache. GitHub's runner fleet is CPU-heterogeneous, so a cache
      # populated on a wider-ISA VM SIGILLs (exit 132, empty stderr) when
      # restored on a narrower one — observed as multi-shard waves of
      # sequencers crash-looping the moment they touched Aeron. Key the cache
      # by the CPU's feature-flag set so native objects never cross ISAs.
      - name: CPU microarch cache key
        id: cpukey
        # Key by the CPUID FEATURE FLAGS, not the model name: hypervisors mask
        # feature bits per VM independently of the brand string, and the reroll
        # SIGILL'd again on a full-match model-name cache (host runnervmvrwv9
        # reports the same model as the fleet but a narrower ISA). The flags
        # line is exactly the surface -march=native compiles against.
        run: echo "cpu=$(grep -m1 '^flags' /proc/cpuinfo | md5sum | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.cpukey.outputs.cpu }}
      - run: cargo test --workspace --all-targets --locked

  doc-test:
    name: doc-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libbsd-dev uuid-dev
      # rusteron's build.rs compiles the Aeron C library with -march=native
      # (hardcoded, no opt-out); those objects land in target/ and travel in
      # the rust cache. GitHub's runner fleet is CPU-heterogeneous, so a cache
      # populated on a wider-ISA VM SIGILLs (exit 132, empty stderr) when
      # restored on a narrower one — observed as multi-shard waves of
      # sequencers crash-looping the moment they touched Aeron. Key the cache
      # by the CPU's feature-flag set so native objects never cross ISAs.
      - name: CPU microarch cache key
        id: cpukey
        # Key by the CPUID FEATURE FLAGS, not the model name: hypervisors mask
        # feature bits per VM independently of the brand string, and the reroll
        # SIGILL'd again on a full-match model-name cache (host runnervmvrwv9
        # reports the same model as the fleet but a narrower ISA). The flags
        # line is exactly the surface -march=native compiles against.
        run: echo "cpu=$(grep -m1 '^flags' /proc/cpuinfo | md5sum | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.cpukey.outputs.cpu }}
      - run: cargo test --workspace --doc --locked

  forge-build:
    name: forge build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install contract dependencies
        run: |
          forge install --no-git --shallow \
            foundry-rs/forge-std \
            openzeppelin/openzeppelin-contracts@v5.0.2 \
            openzeppelin/openzeppelin-contracts-upgradeable@v5.0.2
      - run: forge build --sizes

  forge-test:
    name: forge test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install contract dependencies
        run: |
          forge install --no-git --shallow \
            foundry-rs/forge-std \
            openzeppelin/openzeppelin-contracts@v5.0.2 \
            openzeppelin/openzeppelin-contracts-upgradeable@v5.0.2
      - run: forge test -vvv

  forge-fmt:
    name: forge fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge fmt --check

  solhint:
    name: solhint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install solhint
        run: npm install -g solhint@5.0.5
      - name: Lint src
        run: solhint --max-warnings 0 -c .solhint.json 'src/**/*.sol'
      - name: Lint tests
        run: solhint --max-warnings 0 -c test/.solhint.json 'test/**/*.sol'

  slither:
    name: slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install contract dependencies
        working-directory: contracts
        run: |
          forge install --no-git --shallow \
            foundry-rs/forge-std \
            openzeppelin/openzeppelin-contracts@v5.0.2 \
            openzeppelin/openzeppelin-contracts-upgradeable@v5.0.2
      - uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: medium

