name: cluster-validate

on:
  workflow_dispatch:

jobs:
  exp:
    name: exp (${{ matrix.part }} x${{ matrix.procs }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [DeployTest, CarryTest]
        procs: [1]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-test-host
      - name: Tests
        env:
          PROCS: ${{ matrix.procs }}
          PART: ${{ matrix.part }}
        run: |
          seq 0 $((PROCS - 1)) | xargs -P "$PROCS" -I{} sh -c \
            'DEPLOY_TEST_SHARD={}/'"$PROCS"' python3 -m unittest discover -s deploy/cluster/ansible/tests -p test_deploy.py -k "test_deploy.'"$PART"'." -v > /tmp/shard-{}.log 2>&1; rc=$?; echo "shard {} rc=$rc $(date +%T)"; exit $rc' || rc=1
          for f in /tmp/shard-*.log; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done
          exit ${rc:-0}
