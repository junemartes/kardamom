name: cluster-validate

# Static validation for the deploy/cluster scaffold (DESIGN.md §10): the full
# VM cluster can't run in CI (needs nested virtualization), but the linters,
# job-spec validation, and the group_vars contract check are cheap.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/cluster/**'
      - 'justfile'
      - 'crates/log/docker/aeron/Dockerfile'
      - '.github/workflows/cluster-validate.yml'
  # Every pull request, with no path filter: the main ruleset requires the
  # tofu checks, and a filtered workflow never reports them on a pull
  # request that leaves deploy/cluster alone, so that pull request could
  # never merge.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: yamllint + ansible-lint + contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/cluster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install linters
        run: pip install yamllint ansible-lint
      # Galaxy resets connections now and then; three tries cover it.
      - name: Install Ansible collections (module resolution for ansible-lint)
        run: |
          n=0
          until ansible-galaxy collection install ansible.posix community.docker community.general; do
            n=$((n + 1))
            [ "$n" -ge 3 ] && exit 1
            sleep 15
          done
      - name: yamllint
        run: yamllint ansible/
      - name: ansible-lint
        run: ansible-lint ansible/
      - name: Contract drift check (group_vars/all.yml vs mirrors)
        run: ansible-playbook -i localhost, ansible/contract.yml

  # The deploy tests run full Ansible plays against a fake Nomad API. On
  # one 2-core runner the classes starved each other: three took about 40
  # minutes each and the job hit its 45-minute limit. Each class now runs
  # on its own runner. The job named `nomad job validate` is the required
  # check; it waits for every part and passes only when all passed.
  deploy-tests:
    name: deploy tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [specs, DeployTest, SealerTest, RecordTest, RollbackTest, others]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible for isolated deployment tests
        run: |
          pip install ansible-core
          n=0
          until ansible-galaxy collection install ansible.posix community.docker community.general; do
            n=$((n + 1))
            [ "$n" -ge 3 ] && exit 1
            sleep 15
          done
      - name: Install Nomad (version from the cluster contract)
        run: |
          ver="$(sed -n 's/^nomad_version: "\([^"]*\)".*/\1/p' deploy/cluster/ansible/group_vars/all.yml)"
          curl -fsSL "https://releases.hashicorp.com/nomad/${ver}/nomad_${ver}_linux_amd64.zip" -o /tmp/nomad.zip
          sudo unzip -o /tmp/nomad.zip -d /usr/local/bin
          nomad version
      - name: Start a dev agent (job validation needs the API)
        run: |
          nomad agent -dev -bind 127.0.0.1 > /tmp/nomad-dev.log 2>&1 &
          for _ in $(seq 1 30); do
            nomad node status > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "nomad dev agent failed to start" >&2
          cat /tmp/nomad-dev.log >&2
          exit 1
      - name: Validate job specs
        if: matrix.part == 'specs'
        # Run from deploy/cluster: the specs resolve file("config/...") against
        # the CLI working directory.
        working-directory: deploy/cluster
        run: |
          rc=0
          for j in nomad/*.hcl; do
            echo "== $j =="
            nomad job validate "$j" || rc=1
          done
          exit $rc
      # Every process runs from the repository root: deploy/cluster/ansible/
      # ansible.cfg turns become on, and a render under it is not readable
      # by the runner.
      - name: Test one deploy class in isolation
        if: matrix.part != 'specs' && matrix.part != 'others'
        run: |
          python3 -m unittest discover -s deploy/cluster/ansible/tests -p test_deploy.py -k "${{ matrix.part }}" -v
      - name: Test the other modules
        if: matrix.part == 'others'
        run: |
          tests=deploy/cluster/ansible/tests
          for module in "$tests"/test_*.py; do
            [ "$(basename "$module")" = test_deploy.py ] && continue
            python3 -m unittest discover -s "$tests" -p "$(basename "$module")" -v || exit 1
          done

  nomad-validate:
    name: nomad job validate
    runs-on: ubuntu-latest
    needs: deploy-tests
    if: always()
    steps:
      - name: Every part passed
        run: |
          [ "${{ needs.deploy-tests.result }}" = success ] || { echo "a deploy test part did not pass: ${{ needs.deploy-tests.result }}" >&2; exit 1; }

  terraform-validate:
    name: tofu fmt + validate + test (${{ matrix.root }} root)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        root: [containers]
    defaults:
      run:
        working-directory: deploy/cluster/terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tofu-providers
        with:
          root: deploy/cluster/terraform/${{ matrix.root }}
      - name: tofu fmt
        run: tofu fmt -check -recursive .
      - name: tofu init (provider schema only, no backend)
        run: tofu init -backend=false -input=false
      - name: tofu validate
        run: tofu validate
      - name: tofu test (mocked provider)
        run: tofu test
