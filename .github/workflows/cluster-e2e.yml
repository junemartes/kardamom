name: cluster-e2e

# Container-based cluster end-to-end (Ansible → Nomad → Consul). Brings up the
# multi-node cluster as privileged systemd+DinD containers on a Docker
# bridge (the VM-less analogue of `just container-up`), provisions it once
# (see prepare-cluster below), deploys the Nomad jobs, and runs the pipeline smoke +
# sustained-load + chaos suite. Each shard is one test of crates/chaos
# (tests/shards.rs); the test owns the lifecycle. See
# deploy/cluster/terraform/containers and the container-* targets of
# deploy/cluster/justfile for the same lifecycle by hand.
#
# The deploy uses the CLUSTERED sealer (Phase 3): a 3-member Aeron Cluster (Raft)
# replaces the single sealer. The cluster transport is unconditional in the Rust
# binaries (no cargo feature to toggle); the Java cluster image is built from the
# gradle shadowJar.
#
# The suite is SHARDED across runners: each shard starts its own copy of
# the prepared cluster and runs one slice.
#
# Every shard runs nightly, not on a pull request or a push: `load` (the
# soak), `semantics`, every `chaos-*` shard and `chaos-integrity`. The
# schedule runs them; workflow_dispatch runs them on any branch; the
# `chaos-nightly` label runs them on a pull request, in a run of its own.
# A failed shard of a scheduled run opens or updates one issue per shard.
# The issue names the failed cases and holds the triage checklist: every
# nightly failure gets an isolated reproduction in the in-process suite.
#
# One `build` job compiles the service binaries, the shard test executable,
# the operator binary and the sealer jar once (`just stage-dist`). The
# `node-image` job builds the prepared node image once.
#
# One `prepare-cluster` job then builds the cluster once for the whole
# run: `just container-prepare` creates the nodes, provisions Docker,
# Consul, Nomad and the registry, and pushes the service images into the
# registry, with no workload. `just container-save` stops the nodes,
# commits each node to an image and keeps the node volumes. The job
# uploads them with the host binaries as the `prepared-cluster` artifact.
#
# The saved node images leave out the layers of the plain node image. A
# shard job downloads that artifact and `cluster-node-image` in one step,
# loads the plain node image and then the saved nodes, and sets
# KARDAMOM_PREPARED_CLUSTER. Each bring-up of the shard test then
# recreates the saved volumes, starts the saved nodes, waits for the
# substrate (ansible/resume.yml) and deploys the workloads in waves, with
# the Mitogen strategy of Ansible. A shard runner carries no Rust toolchain, no JDK and
# no Foundry, and builds no image. The target of a shard job is 15 minutes.

on:
  workflow_dispatch:
    inputs:
      shard:
        description: One shard to run. Empty runs every shard.
        required: false
        default: ""
      cases:
        description: The cases of that shard, separated by spaces (KARDAMOM_CHAOS_CASES). Empty runs every case.
        required: false
        default: ""
  pull_request:
    # Only the `chaos-nightly` label starts a run on a pull request.
    types: [labeled]
  schedule:
    # Every shard, at 03:17 UTC.
    - cron: "17 3 * * *"

concurrency:
  # A newer run of the same event and ref replaces the older one. The
  # schedule, a dispatch and a labeled pull request each have their own
  # group, so a dispatch on main and the schedule never cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Harden the heavy cargo build against transient crates.io download drops
  # ("curl failed [56] ... unexpected eof while reading"): retry more, and
  # disable HTTP/2 multiplexing (the known trigger for those mid-stream EOFs
  # against the crates.io CDN in CI).
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  build:
    # A `labeled` event runs only for the `chaos-nightly` label: any other
    # label starts no run.
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-cluster-e2e')
      && (github.event.action != 'labeled' || github.event.label.name == 'chaos-nightly')
    name: build cluster artifact
    # Pinned (not ubuntu-latest): the binaries + libaeron.so built here run in
    # the ubuntu:24.04 ci-service image, so the runner glibc must match that
    # base (see deploy/cluster/docker/ci-service.Dockerfile).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      # The shard list of every run. The names are the `Shard` names of
      # crates/chaos/src/shard.rs plus the two stages of tests/shards.rs.
      - name: Pick the shards
        id: shards
        env:
          SHARD: ${{ github.event.inputs.shard }}
        run: |
          regular='"load","semantics"'
          nightly='"chaos-executor","chaos-ingress","chaos-sequencer","chaos-cluster","chaos-fleet","chaos-coordinated","chaos-combined-ordering","chaos-combined-exec","chaos-retention","chaos-cache","chaos-l1","chaos-follower","chaos-carry","chaos-integrity"'
          shards="[$regular,$nightly]"
          if [ -n "$SHARD" ]; then
            shards="$(jq -cn --arg shard "$SHARD" --argjson all "$shards" 'if ($all | index($shard)) then [$shard] else error("unknown shard " + $shard) end')"
          fi
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "shards: $shards"

      - uses: ./.github/actions/just

      - name: Install system build deps (Aeron C client)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake uuid-dev libbsd-dev libssl-dev pkg-config build-essential

      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/foundry
      # forge build downloads the pinned solc on a cold host; the cache
      # keeps that download off binaries.soliditylang.org.
      - uses: ./.github/actions/solc-cache
      # The Aeron C library is compiled for x86-64-v3 through the compiler
      # wrappers below, so the cache and the artifact hold no native-ISA
      # objects and travel to any runner. (rusteron's build.rs hardcodes
      # -march=native; the wrapper appends the fixed level after it.)
      # The shared action also caches rustc work for workspace crates. A
      # pull request only restores: its own entry would evict the caches
      # of the base branches.
      - uses: ./.github/actions/rust-build-cache
        with:
          shared-key: cluster-e2e
          save-if: ${{ github.event_name != 'pull_request' }}

      # JDK for the Java Aeron-Cluster sealer node. The clustered sealer image is
      # a pure-JVM shadowJar (no native libs); temurin 17 matches cluster.Dockerfile
      # (eclipse-temurin:17-jre).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build cluster sealer jar (gradle shadowJar)
        working-directory: cluster/sealer-service
        run: ./gradlew :service:shadowJar --no-daemon

      # Every service bin builds in one pass: the Aeron Cluster (Raft)
      # transport is unconditional (no `cluster` cargo feature). The shard
      # test executable and the operator binary build here too, so a shard
      # runner compiles nothing.
      - name: cargo build --release (service binaries + shard tests)
        run: |
          cargo build --release \
            -p kardamom-ingress -p kardamom-sequencer -p kardamom-executor \
            -p kardamom-validator -p kardamom-da-watcher -p kardamom-batcher \
            -p kardamom-reconstruct -p kardamom-state-mirror -p kardamom-l1-indexer \
            -p kardamom-l1-fault-proxy \
            -p kardamom-notifier -p kardamom-canary \
            -p kardamom-egress \
            --bins
          # Settlement-contract deploy for the live batcher (Ansible deployment Phase 2b).
          cargo build --release -p kardamom-deployer --bin kardamom-deploy
          # Target-C runner for the chain-semantics shard. Feature-gated
          # because it links the scenario drivers.
          cargo build --release -p e2e --features full-pipeline-e2e \
            --bin kardamom-semantics
          # Build the integration executable and operator in one Cargo graph.
          # Unit-test executables belong to the ordinary CI test job.
          cargo build --release -p kardamom-chaos --features cluster-e2e --locked \
            --bin kardamom-cluster --test shards

      # One download of the Aeron jar for the whole run. The artifact
      # carries it to every shard, where the images role builds the Aeron
      # image from that context with no request to Maven Central.
      - uses: ./.github/actions/aeron-jar

      - name: Stage the artifact
        run: |
          just stage-dist dist
          install -D -m 0644 crates/log/docker/aeron/aeron-all.jar \
            dist/crates/log/docker/aeron/aeron-all.jar
          tar -C dist -czf cluster-dist.tgz .
          ls -l cluster-dist.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: cluster-dist
          path: cluster-dist.tgz
          retention-days: 3
          if-no-files-found: error

  node-image:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-cluster-e2e')
      && (github.event.action != 'labeled' || github.event.label.name == 'chaos-nightly')
    name: prepare cluster node image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: deploy/cluster
          file: deploy/cluster/docker/node-prepared.Dockerfile
          tags: kardamom-node-prepared:ci
          load: true
          cache-from: type=gha,scope=cluster-node
          cache-to: type=gha,mode=max,scope=cluster-node
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify the prepared image offline
        run: |
          docker run --rm --network none --entrypoint ansible-playbook \
            -v "$GITHUB_WORKSPACE/deploy/cluster/ansible:/ansible:ro" \
            kardamom-node-prepared:ci -i localhost, /ansible/node-image-check.yml
      - name: Export prepared node image
        run: docker save kardamom-node-prepared:ci | zstd -T0 -3 -q > /tmp/cluster-node-image.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-node-image
          path: /tmp/cluster-node-image.tar.zst
          compression-level: 0
          retention-days: 3

  # One job builds the cluster that every shard starts from: the nodes,
  # their substrate (Docker, Consul, Nomad, the registry) and the images in
  # the registry, with no workloads. `just container-save` keeps each node
  # as an image and its volumes as files. A shard resumes this cluster and
  # deploys the workloads on it (see the top of this file).
  prepare-cluster:
    needs: [build, node-image]
    name: prepare the chaos cluster
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # GitHub's artifact service answers 403 or 5xx now and then, and
      # download-artifact does not retry. Two more attempts follow a
      # failure, each after a pause.
      - uses: actions/download-artifact@v4
        id: artifact-1
        continue-on-error: true
        with:
          name: cluster-dist
      - name: Wait before the second artifact download
        if: steps.artifact-1.outcome == 'failure'
        run: sleep 30
      - uses: actions/download-artifact@v4
        id: artifact-2
        if: steps.artifact-1.outcome == 'failure'
        continue-on-error: true
        with:
          name: cluster-dist
      - name: Wait before the third artifact download
        if: steps.artifact-1.outcome == 'failure' && steps.artifact-2.outcome == 'failure'
        run: sleep 90
      - uses: actions/download-artifact@v4
        if: steps.artifact-1.outcome == 'failure' && steps.artifact-2.outcome == 'failure'
        with:
          name: cluster-dist

      # The artifact's layout is the checkout's: target/release for the
      # binaries and the Aeron libraries, the Gradle output path for the jar.
      - name: Unpack the artifact over the checkout
        run: |
          tar -xzf cluster-dist.tgz
          rm cluster-dist.tgz

      # The release profile keeps debug info, about nine tenths of each
      # binary. Without it, the service images in the registry and the
      # host binaries of the shards are much smaller. The symbol table
      # stays, so a backtrace still names each function.
      - name: Strip the debug info of the binaries
        run: |
          strip --strip-debug target/release/kardamom-*
          du -sh target/release/kardamom-* | sort -h | tail -n 3

      - uses: actions/download-artifact@v4
        with:
          name: cluster-node-image
          path: /tmp/cluster-node-artifact
      - name: Load the prepared node image
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          zstd -dc /tmp/cluster-node-artifact/cluster-node-image.tar.zst | docker load
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' kardamom-node-prepared:ci)" = "$EXPECTED_REVISION"
          echo "TF_VAR_prebuilt_node_image=kardamom-node-prepared:ci" >> "$GITHUB_ENV"
          rm /tmp/cluster-node-artifact/cluster-node-image.tar.zst

      - uses: ./.github/actions/ansible-runner

      # Images are pushed from inside the control node (REGISTRY_PUSH_NODE
      # in the justfile), so the runner daemon trusts no registry address.
      - name: Kernel modules for systemd-in-container
        run: sudo modprobe ip_tables || true

      - uses: ./.github/actions/tofu-providers
        with:
          root: deploy/cluster/terraform/containers
      - uses: ./.github/actions/just

      - name: Provision the nodes and publish the images
        run: just --justfile deploy/cluster/justfile container-prepare
        env:
          KARDAMOM_STAGED: "1"

      # The runner engine keeps a copy of every image that the registry
      # holds. The save needs the disk space.
      - name: Remove the runner copies of the pushed images
        run: |
          docker image ls --format '{{ .Repository }}:{{ .Tag }}' | grep '^registry.service.consul:5000/' | xargs -r docker image rm >/dev/null
          docker builder prune --all --force >/dev/null
          df -h /

      # The shard runner needs only the host binaries of the build: the
      # shard test, the operator, and the tools that the cases run.
      - name: Save the prepared cluster
        run: |
          just --justfile deploy/cluster/justfile container-save /tmp/prepared-cluster
          mkdir -p /tmp/prepared-dist/target/release
          for bin in chaos-shards cluster deploy semantics reconstruct archive-rereplicate; do
            cp "target/release/kardamom-$bin" /tmp/prepared-dist/target/release/
          done
          tar -C /tmp/prepared-dist -cf - . | zstd -T0 -3 -q > /tmp/prepared-cluster/dist.tar.zst
          du -sh /tmp/prepared-cluster

      - uses: actions/upload-artifact@v4
        with:
          name: prepared-cluster
          path: /tmp/prepared-cluster
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  cluster-e2e:
    needs: [build, prepare-cluster]
    name: container cluster e2e (${{ matrix.shard }})
    # Same base as the build job: the staged binaries and libaeron.so link
    # this glibc.
    runs-on: ubuntu-24.04
    # Recovery includes the persisted-state proof and teardown. The
    # workflow runs nightly. The timing audit (scripts/ci/green_streak.py)
    # holds a shard to 15 minutes and the carry shard to 20. The timeouts
    # are far above that, so that a slow shard still reports its result.
    timeout-minutes: ${{ matrix.shard == 'chaos-carry' && 300 || matrix.shard == 'chaos-executor' && 180 || 120 }}
    strategy:
      # Don't cancel the other shards if one fails — we want every shard's
      # result on a single run.
      fail-fast: false
      matrix:
        # Most recovery shards start with carry enabled. The carry shard
        # tests live activation from reference mode and mixed executors.
        # Load tests both configurations; integrity keeps reference recovery.
        # chaos-fleet takes every replica of one role down at once: the sealer
        # quorum, the whole sealer set, the whole executor set, with and
        # without their state databases, and the whole redis job.
        # chaos-coordinated crosses the redundancy of a role: both ingresses,
        # and both replicas of a sequencer lane.
        # chaos-combined-ordering takes two or three classes down at once
        # (ingresses, sequencers, sealers) and brings them back in
        # dependency order and against it.
        # chaos-combined-exec takes the executors down with another class
        # (the sealers, the sealers and the validator, the ingresses, Redis
        # and the state mirrors) and brings them back in both orders.
        # chaos-l1 puts a lying L1 endpoint in front of the followers: the
        # staging incident's faults, the batcher's resume through them, and
        # an outage past the sealer's retention.
        # chaos-follower runs behind the same lying L1: the loss of one and
        # of both L1 follower instances, and the disagreement of the two.
        # chaos-carry tests deposits across provider loss and egress restart.
        # chaos-integrity (nightly, reference-born) stops and restores the
        # executor job ten times under load; every executor must advance
        # after each round. Then it wipes the whole sealer set and restarts
        # the chain from a seed rebuilt from L1.
        # The build job picks the list (see "Pick the shards").
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      # GitHub's artifact service answers 403 or 5xx now and then, and
      # download-artifact does not retry, so one bad answer failed a whole
      # shard before it started. Two more attempts follow a failure, each
      # after a pause. One step downloads both artifacts in parallel, each
      # to /tmp/artifacts/<name>.
      - uses: actions/download-artifact@v4
        id: artifact-1
        continue-on-error: true
        with:
          pattern: "{prepared-cluster,cluster-node-image}"
          path: /tmp/artifacts
      - name: Wait before the second artifact download
        if: steps.artifact-1.outcome == 'failure'
        run: sleep 30
      - uses: actions/download-artifact@v4
        id: artifact-2
        if: steps.artifact-1.outcome == 'failure'
        continue-on-error: true
        with:
          pattern: "{prepared-cluster,cluster-node-image}"
          path: /tmp/artifacts
      - name: Wait before the third artifact download
        if: steps.artifact-1.outcome == 'failure' && steps.artifact-2.outcome == 'failure'
        run: sleep 90
      - uses: actions/download-artifact@v4
        if: steps.artifact-1.outcome == 'failure' && steps.artifact-2.outcome == 'failure'
        with:
          pattern: "{prepared-cluster,cluster-node-image}"
          path: /tmp/artifacts

      # The plain node image loads first: the archive of the saved nodes
      # leaves out its layers. The host binaries go to the checkout's
      # target/release while the images load. The node images carry the
      # revision label of the node-image job. The shard test reads
      # KARDAMOM_PREPARED_CLUSTER and resumes the saved cluster at each
      # bring-up.
      - uses: ./.github/actions/just
      - name: Load the prepared cluster
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          zstd -dc /tmp/artifacts/prepared-cluster/dist.tar.zst | tar -xf - &
          dist=$!
          zstd -dc /tmp/artifacts/cluster-node-image/cluster-node-image.tar.zst | docker load
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' kardamom-node-prepared:ci)" = "$EXPECTED_REVISION"
          just --justfile deploy/cluster/justfile container-load /tmp/artifacts/prepared-cluster kardamom-node-prepared:ci
          wait "$dist"
          rm -rf /tmp/artifacts/cluster-node-image /tmp/artifacts/prepared-cluster/nodes.tar.zst /tmp/artifacts/prepared-cluster/dist.tar.zst
          echo "TF_VAR_prebuilt_node_image=kardamom-node-prepared:ci" >> "$GITHUB_ENV"
          echo "KARDAMOM_PREPARED_CLUSTER=/tmp/artifacts/prepared-cluster" >> "$GITHUB_ENV"

      - uses: ./.github/actions/ansible-runner

      - name: Kernel modules for systemd-in-container
        run: |
          # cgroup v2 + systemd-in-container needs this on some runners.
          sudo modprobe ip_tables || true

      - name: Verify scoped Raft packet delay in an isolated network namespace
        if: matrix.shard == 'chaos-cluster'
        run: |
          sudo modprobe sch_prio
          sudo modprobe sch_netem
          sudo modprobe cls_flower
          sudo timeout --kill-after=5s 60s unshare --net python3 \
            crates/chaos/src/cases/raft_partition/delay/kernel_probe.py \
            > /tmp/chaos-raft-delay-kernel.json

      - uses: ./.github/actions/tofu-providers
        with:
          root: deploy/cluster/terraform/containers

      - name: Install Nomad CLI
        run: |
          ver="$(sed -n 's/^nomad_version: "\([^"]*\)".*/\1/p' deploy/cluster/ansible/group_vars/all.yml)"
          curl -fsSL --retry 5 --retry-all-errors "https://releases.hashicorp.com/nomad/${ver}/nomad_${ver}_linux_amd64.zip" -o /tmp/nomad.zip
          sudo unzip -o /tmp/nomad.zip -d /usr/local/bin

      # Runner identity for the correlation stamps in the load logs.
      - name: Runner identity
        run: echo "RUNNER_NAME=${{ runner.name }}" >> "$GITHUB_ENV"

      # The shard test owns the lifecycle: OpenTofu applies
      # terraform/containers with the saved node images, Ansible resumes
      # the nodes and deploys the workloads through ansible/resume.yml, the
      # shard's gates run, and the cluster is destroyed on success. The
      # shard's values live in crates/chaos (Shard::env, the stage table
      # in tests/shards.rs), not here. A failed shard leaves the cluster up
      # for the diagnostics step; the runner is ephemeral, so nothing
      # destroys it after. The shard runner carries no toolchain; just is
      # the one tool the recipes need.
      # The runner stalls for more than 10 s at times (archive copies,
      # cluster restarts). At Aeron's 10 s default, a stall kills a
      # healthy client or media driver. 30 s is the value of the local
      # e2e harness. The deploy and the chaos knobs read the same value.
      - name: Run shard (${{ matrix.shard }})
        run: |
          {
            date --utc --iso-8601=seconds
            printf 'available_cpus=%s\n' "$(nproc)"
            free --bytes
          } > /tmp/chaos-runner-resources.log
          # Sample host contention through the fault and recovery. Skip the
          # first vmstat row, whose counters average the time since boot.
          TZ=UTC vmstat --wide --timestamp --no-first --one-header -S K 1 >> /tmp/chaos-runner-resources.log 2>&1 &
          resource_sampler=$!
          # CPU time and thread counts identify the processes behind contention.
          # Process names omit command arguments, which can contain credentials.
          (
            while true; do
              date --utc --iso-8601=seconds
              ps -eo pid,ppid,nlwp,stat,pcpu,time,comm --sort=-pcpu | awk 'NR <= 81'
              # Thread names and CPU time identify the poll loop behind a busy process.
              date --utc --iso-8601=seconds >> /tmp/chaos-runner-threads.log
              # Sorting inside ps suppresses worker rows on procps; sort the complete thread list.
              ps -eLo pid,lwp,psr,stat,pcpu,time,comm --no-headers | LC_ALL=C sort -k5,5nr | awk 'NR <= 160' >> /tmp/chaos-runner-threads.log
              sleep 5
            done
          ) > /tmp/chaos-runner-processes.log 2>&1 &
          process_sampler=$!
          trap 'kill "$resource_sampler" "$process_sampler" 2>/dev/null || true; wait "$resource_sampler" "$process_sampler" 2>/dev/null || true' EXIT
          # A dispatch can narrow the cases of the shard.
          if [ -n "$CASES" ]; then
            export KARDAMOM_CHAOS_CASES="$CASES"
          fi
          just --justfile deploy/cluster/justfile shard "${{ matrix.shard }}"
        env:
          CASES: ${{ github.event.inputs.cases }}
          KARDAMOM_STAGED: "1"
          AERON_STALL_TOLERANCE_MS: "30000"
          # The same playbooks and tasks, in kept Python processes (see
          # .github/actions/ansible-runner).
          ANSIBLE_STRATEGY: mitogen_linear
          # Mitogen starts its sudo and docker transports within this
          # timeout. Under the load of a case, the 10 s default runs out.
          ANSIBLE_TIMEOUT: "60"

      - name: Collect diagnostics
        if: failure()
        run: just --justfile deploy/cluster/justfile container-diagnostics
        env:
          KARDAMOM_STAGED: "1"

      - name: Preserve load, latency and runner resource reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-load-${{ matrix.shard }}
          path: |
            /tmp/chaos-*.json
            /tmp/kardamom-load*.json
            /tmp/chaos-runner-resources.log
            /tmp/chaos-runner-processes.log
            /tmp/chaos-runner-threads.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve failed state evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-evidence-${{ matrix.shard }}
          path: |
            /tmp/chaos-state-*/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Preserve failed allocation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-diagnostics-${{ matrix.shard }}
          path: /tmp/chaos-diagnostics/**
          if-no-files-found: ignore
          retention-days: 14

  # One issue per failed shard of a nightly run. The issue carries the
  # `chaos-nightly` label and the shard name in its title. A later failure
  # of the same shard adds a comment with the run, so one open issue
  # tracks one shard.
  nightly-report:
    needs: cluster-e2e
    if: always() && github.event_name == 'schedule' && needs.cluster-e2e.result != 'skipped'
    name: open an issue per failed nightly shard
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or update the issue of each failed shard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" and (.name | startswith("container cluster e2e ("))) | "\(.id) \(.html_url) \(.name | capture("\\((?<shard>[^)]+)\\)") | .shard)"' > failed-shards
          if [ ! -s failed-shards ]; then
            echo "every nightly shard passed"
            exit 0
          fi
          while read -r job url shard; do
            # The failed cases: the cases that the log starts and does not
            # pass.
            gh api "repos/$GH_REPO/actions/jobs/$job/logs" > shard.log || true
            sed -n 's/.*= CHAOS CASE: \([a-z0-9-]*\).*/\1/p' shard.log | sort -u > started
            sed -n 's/.*CHAOS CASE \([a-z0-9-]*\): PASS.*/\1/p' shard.log | sort -u > passed
            cases=$(comm -23 started passed | paste -sd, -)
            title="nightly: the $shard shard failed"
            {
              echo "The nightly run $RUN_URL failed the \`$shard\` shard."
              echo
              echo "- Failed cases: ${cases:-none found in the log}"
              echo "- Shard log: $url"
              echo "- The chaos evidence artifacts of the run hold the state files."
              echo
              echo "Triage checklist:"
              echo
              echo "- [ ] Find the cause in the shard log."
              echo "- [ ] Add or extend an isolated test in scripts/ci/component-recovery.json (the in-process suite) that reproduces the failure. Name the case and the test here."
              echo "- [ ] Fix the product or the test."
              echo "- [ ] Link the pull request here."
            } > issue-body.md
            number=$(gh issue list --repo "$GH_REPO" --label chaos-nightly --state open --search "\"$title\" in:title" --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GH_REPO" --body-file issue-body.md
              echo "updated #$number for $shard"
            else
              gh issue create --repo "$GH_REPO" --title "$title" --label chaos-nightly --body-file issue-body.md
              echo "opened an issue for $shard"
            fi
          done < failed-shards
