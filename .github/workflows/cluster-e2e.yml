name: cluster-e2e

# Container-based cluster end-to-end (Ansible → Nomad → Consul). Brings up the
# multi-node cluster as privileged systemd+DinD containers on a Docker
# bridge (the VM-less analogue of `make up`), provisions it through
# ansible/cluster.yml, deploys the Nomad jobs, and runs the pipeline smoke +
# sustained-load + chaos suite. Each shard is one test of crates/chaos
# (tests/shards.rs); the test owns the lifecycle. See
# deploy/cluster/terraform/containers and the container-* targets of
# deploy/cluster/Makefile for the same lifecycle by hand.
#
# The deploy uses the CLUSTERED sealer (Phase 3): a 3-member Aeron Cluster (Raft)
# replaces the single sealer. The cluster transport is unconditional in the Rust
# binaries (no cargo feature to toggle); the Java cluster image is built from the
# gradle shadowJar.
#
# The FULL suite runs on every trigger, SHARDED across runners (each shard brings
# up its own cluster and runs one slice): one `load` shard (5-min soak), three
# `chaos-*` component shards (executor/ingress/sequencer), and one `chaos-cluster`
# shard for the Raft resilience cases. Splitting across runners keeps wall-clock
# to ~one shard instead of running everything serially. Opt out with the
# `skip-cluster-e2e` label for changes that can't affect the cluster.
#
# One `build` job compiles the service binaries, the shard test executable,
# the operator binary and the sealer jar once, and hands them to the shards
# as one artifact (scripts/ci/stage-cluster-dist.sh). A shard runner carries
# no Rust toolchain, no JDK and no Foundry: it unpacks the artifact over
# its checkout and runs make with KARDAMOM_STAGED=1. Before this, every
# shard spent about 20 minutes on the same build (issue #300).

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Harden the heavy cargo build against transient crates.io download drops
  # ("curl failed [56] ... unexpected eof while reading"): retry more, and
  # disable HTTP/2 multiplexing (the known trigger for those mid-stream EOFs
  # against the crates.io CDN in CI).
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  build:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-cluster-e2e')
    name: build cluster artifact
    # Pinned (not ubuntu-latest): the binaries + libaeron.so built here run in
    # the ubuntu:24.04 ci-service image, so the runner glibc must match that
    # base (see deploy/cluster/docker/ci-service.Dockerfile).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system build deps (Aeron C client)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake uuid-dev libbsd-dev libssl-dev pkg-config build-essential

      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/foundry
      # forge build downloads the pinned solc on a cold host; the cache
      # keeps that download off binaries.soliditylang.org.
      - uses: ./.github/actions/solc-cache
      # The Aeron C library is compiled for x86-64-v3 through the compiler
      # wrappers below, so the cache and the artifact hold no native-ISA
      # objects and travel to any runner. (rusteron's build.rs hardcodes
      # -march=native; the wrapper appends the fixed level after it.)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cluster-e2e
          prefix-key: v1-rust-x86-64-v3
      # rusteron builds the Aeron C library with Gradle on a rust-cache
      # miss; the Gradle cache keeps that build off Maven Central.
      - uses: ./.github/actions/gradle-cache

      # JDK for the Java Aeron-Cluster sealer node. The clustered sealer image is
      # a pure-JVM shadowJar (no native libs); temurin 17 matches cluster.Dockerfile
      # (eclipse-temurin:17-jre).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build cluster sealer jar (gradle shadowJar)
        working-directory: cluster/sealer-service
        run: ./gradlew :service:shadowJar --no-daemon

      # Every service bin builds in one pass: the Aeron Cluster (Raft)
      # transport is unconditional (no `cluster` cargo feature). The shard
      # test executable and the operator binary build here too, so a shard
      # runner compiles nothing.
      - name: cargo build --release (service binaries + shard tests)
        env:
          CC: ${{ github.workspace }}/scripts/ci/cc-x86-64-v3.sh
          CXX: ${{ github.workspace }}/scripts/ci/cxx-x86-64-v3.sh
        run: |
          cargo build --release \
            -p kardamom-ingress -p kardamom-sequencer -p kardamom-executor \
            -p kardamom-validator -p kardamom-da-watcher -p kardamom-batcher \
            -p kardamom-reconstruct -p kardamom-state-mirror \
            --bins
          # Settlement-contract deploy for the live batcher (Ansible deployment Phase 2b).
          cargo build --release -p kardamom-deployer --bin kardamom-deploy
          # Target-C runner for the chain-semantics shard. Feature-gated
          # because it links the scenario drivers.
          cargo build --release -p e2e --features full-pipeline-e2e \
            --bin kardamom-semantics
          # The shard tests and the operator binary (diagnostics on failure).
          cargo test -p kardamom-chaos --release --features cluster-e2e --locked --no-run
          cargo build --release -p kardamom-chaos --locked --bin kardamom-cluster

      - name: Stage the artifact
        run: |
          scripts/ci/stage-cluster-dist.sh dist
          tar -C dist -czf cluster-dist.tgz .
          ls -l cluster-dist.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: cluster-dist
          path: cluster-dist.tgz
          retention-days: 3
          if-no-files-found: error

  cluster-e2e:
    needs: build
    name: container cluster e2e (${{ matrix.shard }})
    # Same base as the build job: the staged binaries and libaeron.so link
    # this glibc.
    runs-on: ubuntu-24.04
    # Each shard brings up its own cluster (~10 min) + runs its slice.
    timeout-minutes: 60
    strategy:
      # Don't cancel the other shards if one fails — we want every shard's
      # result on a single run.
      fail-fast: false
      matrix:
        # `load` = the 5-min sustained-load soak. The `chaos-*` shards split the
        # chaos cases (each brings up its own cluster). chaos-cluster covers the
        # 3-member Raft sealer (leader-kill / follower-kill / quorum-loss-recover);
        # it SUPERSEDES the old chaos-sealer shard (the single-sealer SPOF is gone
        # now the deploy uses the clustered sealer — see "Configure shard").
        shard:
          [load, chaos-executor, chaos-ingress, chaos-sequencer, chaos-cluster, chaos-retention, chaos-cache, semantics]
    steps:
      - uses: actions/checkout@v4

      # GitHub's artifact service answers 403 or 5xx now and then, and
      # download-artifact does not retry, so one bad answer failed a whole
      # shard before it started. Two more attempts follow a failure, each
      # after a pause.
      - uses: actions/download-artifact@v4
        id: artifact-1
        continue-on-error: true
        with:
          name: cluster-dist
      - name: Wait before the second artifact download
        if: steps.artifact-1.outcome == 'failure'
        run: sleep 30
      - uses: actions/download-artifact@v4
        id: artifact-2
        if: steps.artifact-1.outcome == 'failure'
        continue-on-error: true
        with:
          name: cluster-dist
      - name: Wait before the third artifact download
        if: steps.artifact-1.outcome == 'failure' && steps.artifact-2.outcome == 'failure'
        run: sleep 90
      - uses: actions/download-artifact@v4
        if: steps.artifact-1.outcome == 'failure' && steps.artifact-2.outcome == 'failure'
        with:
          name: cluster-dist

      # The artifact's layout is the checkout's: target/release for the
      # binaries and the Aeron libraries, the Gradle output path for the jar.
      - name: Unpack the artifact over the checkout
        run: |
          tar -xzf cluster-dist.tgz
          rm cluster-dist.tgz
          ls -l target/release | head -n 20

      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ansible

      - name: Ansible docker connection plugin
        run: ansible-galaxy collection install ansible.posix community.docker

      # The runner image puts pipx's ansible-core first on PATH, and its venv
      # has no requests. community.docker's container and network modules run
      # on the controller with that interpreter and need it.
      - name: Docker API client dependency for the Ansible interpreter
        run: pipx inject ansible-core requests

      # Images are pushed from inside the control node (REGISTRY_PUSH_NODE
      # in the Makefile), so the runner daemon trusts no registry address.
      - name: Kernel modules for systemd-in-container
        run: |
          # cgroup v2 + systemd-in-container needs this on some runners.
          sudo modprobe ip_tables || true

      - uses: ./.github/actions/tofu-providers
        with:
          root: deploy/cluster/terraform/containers

      - name: Install Nomad CLI
        run: |
          ver="$(sed -n 's/^nomad_version: "\([^"]*\)".*/\1/p' deploy/cluster/ansible/group_vars/all.yml)"
          curl -fsSL "https://releases.hashicorp.com/nomad/${ver}/nomad_${ver}_linux_amd64.zip" -o /tmp/nomad.zip
          sudo unzip -o /tmp/nomad.zip -d /usr/local/bin

      # Runner identity for the correlation stamps in the load logs.
      - name: Runner identity
        run: echo "RUNNER_NAME=${{ runner.name }}" >> "$GITHUB_ENV"

      # The shard test owns the lifecycle: OpenTofu applies
      # terraform/containers, Ansible converges the nodes through
      # ansible/cluster.yml, the shard's gates run, and the cluster is
      # destroyed on success. The shard's values live in crates/chaos
      # (Shard::env, the stage table in tests/shards.rs), not here. A
      # failed shard leaves the cluster up for the diagnostics step; the
      # runner is ephemeral, so nothing destroys it after.
      - name: Run shard (${{ matrix.shard }})
        run: make -C deploy/cluster shard SHARD=${{ matrix.shard }} KARDAMOM_STAGED=1

      - name: Collect diagnostics
        if: failure()
        run: make -C deploy/cluster container-diagnostics KARDAMOM_STAGED=1

      - name: Preserve state and load evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-evidence-${{ matrix.shard }}
          path: |
            /tmp/chaos-state-*/**
            /tmp/chaos-*.json
          if-no-files-found: ignore
          retention-days: 3
