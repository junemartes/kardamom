---
name: foundry
description: >-
  Install Foundry v1.7.1 (forge, cast, anvil, chisel) from its release
  tarball, pinned by SHA-256 and kept in the Actions cache. foundryup
  downloaded the release from GitHub in every job, and one 504 from
  GitHub failed every job that needs forge.
runs:
  using: composite
  steps:
    # The SHA-256 is the digest GitHub lists for the release asset
    # foundry_v1.7.1_linux_amd64.tar.gz.
    - uses: ./.github/actions/release-tarball
      with:
        name: foundry
        url: https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz
        sha256: cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b
    - name: Show the Foundry version
      shell: bash
      run: forge --version
