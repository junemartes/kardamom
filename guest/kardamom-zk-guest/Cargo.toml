# The zkVM guest program (spec: no-std-exec-core, phase 3c).
#
# DELIBERATELY OUTSIDE the workspace (`[workspace]` below detaches it): the
# guest builds under the vendor toolchain (`cargo prove build`, rustup
# toolchain `succinct`) with its own lockfile, so zkVM patch pins can never
# perturb the workspace's feature unification or Cargo.lock. The execution
# crates are consumed by PATH, UNMODIFIED — the one-code-path invariant:
# this program links the exact code the live validator runs.
[package]
name = "kardamom-zk-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
kardamom-exec-core = { path = "../../crates/exec-core", default-features = false }
kardamom-types = { path = "../../crates/types", default-features = false }
sp1-zkvm = "6.4"
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck", "bytes-1"] }
alloy-rlp = { version = "0.3", default-features = false }
alloy-eip7928 = { version = "0.3", default-features = false, features = ["rlp"] }

# SP1 v6 precompile accelerator patches (the rsp reth-block-prover set,
# matched to this tree's crate versions). Keccak dominates our cycle count
# — every witness trie node is hashed — so patching sha3 is the big win;
# k256 accelerates per-tx ecrecover, sha2 the misc hashing. Correctness is
# identical to unpatched (the precompiles are drop-in); the win is ~10x
# fewer cycles, which is what makes CPU groth16 tractable.
[patch.crates-io]
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha3-0.11.0-sp1-6.0.0" }
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-6.0.0", package = "sha2" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }

[profile.release]
opt-level = 3
lto = true
