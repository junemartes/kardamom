# Dev chain WITH the L2 withdrawal predeploy.
# Same as dev.toml plus the L2ToL1MessagePasser predeploy at the canonical
# address 0x4200000000000000000000000000000000000016.
#
# The 'code' field below is the RUNTIME bytecode of
# contracts/src/L2/L2ToL1MessagePasser.sol. Regenerate after changing that
# contract with:
#   forge inspect --root contracts L2ToL1MessagePasser deployedBytecode
# (the e2e harness re-derives it from the forge artifact, so a drift here only
# affects manual runs.)

chain_id = 412346

[[alloc]]
address = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
balance = "1000000000000000000000"   # 1000 ETH

# ERC-7955 permissionless CREATE2 factory (see chains/dev.toml).
[[alloc]]
address = "0xC0DEb853af168215879d284cc8B4d0A645fA9b0E"
code    = "0x60203d3d3582360380843d373d34f5806019573d813d933efd5b3d52f33d52"
nonce   = 1

# L2ToL1MessagePasser predeploy — the L2 withdrawal entry point.
[[alloc]]
address = "0x4200000000000000000000000000000000000016"
code    = ""
nonce   = 1
