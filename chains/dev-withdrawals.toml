# Dev chain WITH the L2 predeploys.
# Same as dev.toml plus the L2ToL1MessagePasser predeploy at the canonical
# address 0x4200000000000000000000000000000000000016, and the KardamomChainState
# feature-flag predeploy at 0x4200000000000000000000000000000000000017.
#
# The 'code' fields below are RUNTIME bytecode, pasted from the forge artifacts.
# Nothing re-derives them at runtime, so they must be regenerated by hand after
# changing the corresponding contract:
#   forge inspect --root contracts L2ToL1MessagePasser deployedBytecode
#   forge inspect --root contracts KardamomChainState   deployedBytecode
# The deployer's *_genesis_predeploy tests fail on drift (but SKIP if
# contracts/out/ is unbuilt, so run `forge build` first).

chain_id = 412346

[[alloc]]
address = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
balance = "1000000000000000000000"   # 1000 ETH

# ERC-7955 permissionless CREATE2 factory (see chains/dev.toml).
[[alloc]]
address = "0xC0DEb853af168215879d284cc8B4d0A645fA9b0E"
code    = "0x60203d3d3582360380843d373d34f5806019573d813d933efd5b3d52f33d52"
nonce   = 1

# L2ToL1MessagePasser predeploy — the L2 withdrawal entry point.
[[alloc]]
address = "0x4200000000000000000000000000000000000016"
code    = ""
nonce   = 1

# KardamomChainState predeploy — the L2 feature-flag store. Written only by
# system deposits derived from L1 upgrade transactions; read by the engine at
# every block boundary.
[[alloc]]
address = "0x4200000000000000000000000000000000000017"
code    = ""
nonce   = 1
