# Dev chain WITH the cross-chain messaging predeploys (interop).
# Same as dev.toml plus the Outbox/Inbox/CheckpointMarker predeploys at their
# canonical addresses (kardamom_types::xchain::{OUTBOX, INBOX,
# CHECKPOINT_MARKER}).
#
# The 'code' fields below are the RUNTIME bytecode of
# contracts/src/L2/Outbox.sol, contracts/src/L2/Inbox.sol, and
# contracts/src/L2/CheckpointMarker.sol. Regenerate after changing any of
# them with:
#   forge inspect --root contracts Outbox           deployedBytecode
#   forge inspect --root contracts Inbox            deployedBytecode
#   forge inspect --root contracts CheckpointMarker deployedBytecode
# Drift is caught by crates/deployer/tests/interop_genesis_predeploy.rs (the
# dev-withdrawals pattern).

chain_id = 412346

[[alloc]]
address = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
balance = "1000000000000000000000"   # 1000 ETH

# ERC-7955 permissionless CREATE2 factory (see chains/dev.toml).
[[alloc]]
address = "0xC0DEb853af168215879d284cc8B4d0A645fA9b0E"
code    = "0x60203d3d3582360380843d373d34f5806019573d813d933efd5b3d52f33d52"
nonce   = 1

# Outbox predeploy — the cross-chain send entry point (XChain.OUTBOX).
[[alloc]]
address = "0x42000000000000000000000000000000000000E0"
code    = ""
nonce   = 1

# Inbox predeploy — the cross-chain delivery entry point (XChain.INBOX).
[[alloc]]
address = "0x42000000000000000000000000000000000000E1"
code    = ""
nonce   = 1

# CheckpointMarker predeploy — the recovery-line marker emitter
# (XChain.CHECKPOINT_MARKER).
[[alloc]]
address = "0x42000000000000000000000000000000000000E2"
code    = ""
nonce   = 1
