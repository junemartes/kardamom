[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
revm = "38"
alloy-primitives = "1.6"
alloy-consensus = { version = "2.0", features = ["secp256k1"] }
alloy-rpc-types-eth = "2.0"
alloy-rlp = "0.3"
alloy-network = "2.0"
alloy-eips = "2.0"
alloy-signer-local = "2.0"
jsonrpsee = { version = "0.26", features = ["server", "macros", "client"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-flame = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
humantime-serde = "1"
toml = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
hdrhistogram = "7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

[profile.release]
debug = true
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
