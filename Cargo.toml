[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
revm = "38"
alloy-primitives = "1.6"
alloy-consensus = { version = "2.0", features = ["k256"] }
alloy-rpc-types-eth = "2.0"
alloy-rlp = "0.3"
alloy-network = "2.0"
alloy-eips = "2.0"
alloy-signer-local = "2.0"
jsonrpsee = { version = "0.26", features = ["server", "macros", "client"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
