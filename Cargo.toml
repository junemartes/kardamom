[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
revm = "38"
smallvec = "1"
alloy-eip7928 = { version = "0.3", features = ["rlp"] }
alloy-primitives = "1.6"
alloy-consensus = { version = "2.0", features = ["secp256k1"] }
alloy-rpc-types-eth = "2.0"
alloy-rlp = "0.3"
alloy-network = "2.0"
alloy-eips = "2.0"
alloy-signer-local = "2.0"
jsonrpsee = { version = "0.26", features = ["server", "macros", "client"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-flame = "0.2"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
toml = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
hdrhistogram = "7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
alloy-provider = "2.0"
alloy-contract = "2.0"
alloy-sol-types = { version = "1.6", features = ["json"] }
alloy-node-bindings = "2.0"

kardamom-types = { path = "crates/types" }
kardamom-exec-core = { path = "crates/exec-core" }
kardamom-log = { path = "crates/log" }
kardamom-engine = { path = "crates/engine" }
kardamom-validator = { path = "crates/validator" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "bytes-1"] }
# NOTE: rusteron's `static` feature links Aeron statically but is broken on
# Linux release builds (rust-lld "undefined symbol: aeron_*"; the crate's own
# build.rs flags static on Linux as unreliable). So we link Aeron DYNAMICALLY
# and bundle libaeron.so / libaeron_archive_c_client.so into the runtime images
# (see deploy/cluster/docker/ci-service.Dockerfile + scripts/ci-cluster.sh).
rusteron-client = "0.1"
rusteron-archive = "0.1"
testcontainers = "0.20"
criterion = "0.5"
tempfile = "3"
bytes = "1"
libc = "0.2"
futures = "0.3"
# Lock-free concurrent map for the executor's tx_data → tx_ordering join buffer
#: M tx_data reader threads insert
# `(sequencer_id, BPosition) → TxEnvelope` entries; the tx_ordering reader thread
# pops them as each `TxRef` arrives. Many writers + one reader → DashMap.
dashmap = "6"
crossbeam-channel = "0.5"

[profile.release]
debug = true
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
