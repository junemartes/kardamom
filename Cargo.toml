[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
revm = "38"
alloy-primitives = "1.6"
alloy-consensus = { version = "2.0", features = ["secp256k1"] }
alloy-rpc-types-eth = "2.0"
alloy-rlp = "0.3"
alloy-network = "2.0"
alloy-eips = "2.0"
alloy-signer-local = "2.0"
jsonrpsee = { version = "0.26", features = ["server", "macros", "client"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-flame = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
humantime-serde = "1"
toml = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
hdrhistogram = "7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# Deposit bridge: OP wire types plus dev-only e2e helpers.
op-alloy-consensus = "2"
alloy-provider = "2.0"
alloy-contract = "2.0"
alloy-sol-types = { version = "1.6", features = ["json"] }
alloy-node-bindings = "2.0"

# S3 foundation crates
kardamom-types = { path = "crates/kardamom-types" }
kardamom-log = { path = "crates/kardamom-log" }
kardamom-nonce-registry = { path = "crates/kardamom-nonce-registry" }

# S3 external deps
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "bytes-1"] }
io-uring = "0.7"
rusteron-client = "0.1"
rusteron-archive = "0.1"
testcontainers = "0.20"
criterion = "0.5"
tempfile = "3"
bytes = "1"
libc = "0.2"
futures = "0.3"
redis = { version = "0.27", default-features = false }
# Lock-free concurrent map for the executor's channel-A → channel-B join buffer
# (D-Sh12 / spec §2.4): M channel-A reader threads insert
# `(sequencer_id, BPosition) → TxEnvelope` entries; the channel-B reader thread
# pops them as each `TxRef` arrives. Many writers + one reader → DashMap.
dashmap = "6"

[profile.release]
debug = true
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
