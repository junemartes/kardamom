# The heap bytes per record that CarriedPathAllocationTest allows for each
# case of the service record path of decision version 5, in steady state.
# The allocationGate task measures them with escape analysis off, so they
# are exact. The target of every case is 0. The case heap_feed_walk counts
# bytes per walked frame, and heap_feed_walk_cycle bytes per duty cycle of the walk.
