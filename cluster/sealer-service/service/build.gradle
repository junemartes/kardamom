// :service — the Aeron Cluster ClusteredService adapter + the ClusterNode launcher.
//
// The Java toolchain (17) and `mavenCentral()` are inherited from the root
// build.gradle `subprojects {}` block; only the Aeron deps, the application
// main class, and the shadow (fat-jar) packaging are declared here. The
// `application` plugin re-applies `java` idempotently, so the root's
// `apply plugin: 'java'` is harmless.
plugins {
    id 'application'
    id 'com.gradleup.shadow' version '8.3.5'
}

dependencies {
    implementation project(':core')
    implementation 'io.aeron:aeron-cluster:1.44.0'
    implementation 'io.aeron:aeron-archive:1.44.0'
    implementation 'io.aeron:aeron-driver:1.44.0'
    testImplementation 'io.aeron:aeron-test-support:1.44.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

application {
    mainClass = 'io.kardamom.sealer.cluster.ClusterNode'
}

// The capped backoff idle strategy of the Aeron image. The sealer compiles
// the same file, so the image and the sealer parse KARDAMOM_IDLE_CAP_US with
// one parser.
sourceSets {
    main {
        java {
            srcDir rootProject.file('../../crates/log/docker/aeron')
        }
    }
}

// The in-JVM Aeron TestCluster failover test (SealerClusterFailoverTest) runs real
// media drivers + consensus modules in-process. Agrona's TransportPoller and Aeron's
// unsafe buffers require these JDK module opens on Java 17, and the 3-member cluster
// plus client needs more heap than the default forked test JVM.
tasks.named('test') {
    jvmArgs(
        '-XX:+EnableDynamicAgentLoading',
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util.zip=ALL-UNNAMED',
        '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED'
    )
    maxHeapSize = '1g'
    // FormatRegistryTest reads the format registry at the repository root.
    // As a test input, a change to the file runs the test again.
    def formats = rootProject.file('../../formats.toml')
    inputs.file(formats)
    systemProperty 'kardamom.formats', formats.canonicalPath
    // WireGoldenTest reads the golden frames that the Rust wire tests also read.
    def wireGolden = rootProject.file('../../crates/cluster-adapter/testdata/wire_golden.txt')
    inputs.file(wireGolden)
    systemProperty 'kardamom.wireGolden', wireGolden.canonicalPath
    // ClusterNodeTest reads the decision version that the sealer job passes.
    def sealerJob = rootProject.file('../../deploy/cluster/nomad/cluster.nomad.hcl')
    inputs.file(sealerJob)
    systemProperty 'kardamom.sealerJob', sealerJob.canonicalPath
    // CappedBackoffIdleStrategyTest reads the shared idle-cap cases and the
    // idle strategy properties of the Aeron image entrypoint.
    def idleCases = rootProject.file('../../crates/log/docker/aeron/idle-cap-cases.txt')
    def aeronEntrypoint = rootProject.file('../../crates/log/docker/aeron/entrypoint.sh')
    inputs.files(idleCases, aeronEntrypoint)
    systemProperty 'kardamom.idleCapCases', idleCases.canonicalPath
    systemProperty 'kardamom.aeronEntrypoint', aeronEntrypoint.canonicalPath
    // TestCluster spins up many threads; give the forked worker a single test fork.
    maxParallelForks = 1
    useJUnitPlatform {
        excludeTags 'allocation'
    }
}

// The allocation gate of the service record path (CarriedPathAllocationTest,
// tag "allocation") runs in its own JVM with escape analysis off, as the gate
// of :core does. The normal test task leaves it out.
def allocationGate = tasks.register('allocationGate', Test) {
    description = 'Checks the heap bytes per record of the service record path against its baselines.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'allocation'
    }
    forkEvery = 1
    // The feed cases run a media driver in the test JVM, as the test task does.
    jvmArgs(
        '-XX:-DoEscapeAnalysis',
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED'
    )
}

tasks.named('check') {
    dependsOn allocationGate
}

// The component recovery runner (scripts/ci/component_tests.py) runs one
// JUnit method per JVM without Gradle. This task copies the compiled test
// runtime, the JUnit console launcher and the JVM arguments of the test task
// into one directory. A CI shard runs the tests from that directory and
// compiles nothing.
configurations {
    componentLauncher
}

dependencies {
    componentLauncher 'org.junit.platform:junit-platform-console:1.10.2'
}

tasks.register('componentTestRuntime', Sync) {
    description = 'Copies the test runtime for the component recovery runner.'
    group = 'verification'
    def testTask = tasks.named('test', Test)
    def jvmArgsFile = layout.buildDirectory.file('component-runtime/jvm-args.txt')
    into layout.buildDirectory.dir('component-runtime')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    preserve { include 'jvm-args.txt' }
    from(sourceSets.main.output) { into 'main' }
    from(sourceSets.test.output) { into 'test' }
    from(configurations.testRuntimeClasspath) { into 'lib' }
    from(configurations.componentLauncher) { into 'lib' }
    doLast {
        jvmArgsFile.get().asFile.text = testTask.get().allJvmArgs.join('\n') + '\n'
    }
}

// The load bench (`just sealer-bench`): real sealer members from the jar,
// racing twin publishers and a consumer in this JVM. It never runs in CI.
sourceSets {
    bench {
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

tasks.register('sealerBench', JavaExec) {
    dependsOn 'shadowJar'
    classpath = sourceSets.bench.runtimeClasspath
    mainClass = 'io.kardamom.sealer.bench.SealerLoadBench'
    jvmArgs(
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED',
        '-Xmx1g'
    )
    systemProperty 'bench.jar', layout.buildDirectory.file('libs/kardamom-cluster-node.jar').get().asFile.path
    systemProperty 'bench.dir', layout.buildDirectory.dir('sealer-bench').get().asFile.path
    project.properties.findAll { k, v -> k.startsWith('bench.') }.each { k, v -> systemProperty k, v }
}

tasks.named('shadowJar') {
    archiveBaseName = 'kardamom-cluster-node'
    archiveClassifier = ''
    archiveVersion = ''
    mergeServiceFiles()
}
