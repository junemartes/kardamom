# Prometheus alert rules for the kardamom stack. Loaded through
# `rule_files` in prometheus.yml. Check with:
#   promtool check rules deploy/alerts.yml
#
# These rules make silent coverage gaps visible. The validator verifies
# each epoch against L1. When L1 does not answer, the epoch commits
# unverified and only a counter moves. Nothing else in the system
# notices, and that is exactly where a targeted forgery would sit
# An alert turns that counter into a signal.
#
# The batcher and follower rules watch the one signal an L1 outage
# cannot hide: the age of the last post as L1 serves it. A lying
# endpoint that swallows the settlement's logs, a batcher that cannot
# post, and a batcher that cannot start all make it grow. The chain
# keeps sealing through every one of them, so no L2 signal pages.
groups:
  - name: kardamom-batcher
    rules:
      - alert: KardamomBatcherLastPostStale
        # The last BatchPosted block on L1 is older than two idle flush
        # waits: the batcher stopped posting, or the endpoint it reads
        # stopped serving its posts. Both are an outage of the DA record.
        expr: kardamom_batcher_last_post_age_seconds > 2 * kardamom_batcher_idle_flush_seconds
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "no batch posted to L1 for {{ $value }}s ({{ $labels.host_id }})"
          description: "The last BatchPosted log L1 serves is {{ $value }}s old, past twice the batcher's idle flush wait. The batcher is not posting, or its L1 endpoint hides its posts. Check the batcher log and compare a second L1 endpoint."

      - alert: KardamomBatcherResumeFailures
        # A start could not read L1: the batcher retries in-process and
        # counts every failure. The chain keeps sealing meanwhile, so
        # this is the only signal.
        expr: increase(kardamom_batcher_resume_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "batcher cannot resume from L1 ({{ $labels.host_id }})"
          description: "{{ $value }} resume attempts failed in the last 10m. The batcher cannot read the settlement contract through its L1 endpoint. No batch is posted until it can."

  - name: kardamom-l1-followers
    rules:
      - alert: KardamomL1IndexerTickErrors
        # Over half the indexer's ticks fail: its L1 view broke (a chain
        # break under a finalized block) or its endpoint does not answer.
        # The indexer reports the fault every tick until an operator
        # looks, so the rate stays high for as long as it lasts.
        expr: >-
          sum by (host_id) (rate(kardamom_l1_indexer_tick_total{outcome="error"}[5m]))
          / sum by (host_id) (rate(kardamom_l1_indexer_tick_total[5m])) > 0.5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "inbox indexer ticks failing ({{ $labels.host_id }})"
          description: "Over half the indexer's ticks failed for 15m. The archive stops at its cursor. Inspect the indexer log for the first failed tick."

      - alert: KardamomDaWatcherTickErrors
        # The same for the da-watcher. Its error outcomes are named by
        # kind (chain_break, parse_error, rpc_error); every outcome but
        # ok counts.
        expr: >-
          sum by (host_id) (rate(kardamom_da_watcher_tick_total{outcome!="ok"}[5m]))
          / sum by (host_id) (rate(kardamom_da_watcher_tick_total[5m])) > 0.5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "da-watcher ticks failing ({{ $labels.host_id }})"
          description: "Over half the da-watcher's ticks failed for 15m. No new epoch reaches the chain. Inspect the da-watcher log for the first failed tick."

      # The newest record on l1_blocks is more than two finality steps
      # (64 blocks, about 13 minutes) behind the finalized tip. It fires
      # before any downstream symptom of a stalled follower, such as the
      # batcher's post age, so the page points at the cause.
      - alert: KardamomL1FollowerLag
        expr: >-
          max(kardamom_l1_indexer_l1_finalized_block_number)
          - max(kardamom_l1_follower_published_block_number) > 64
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "the L1 follower is {{ $value }} blocks behind the finalized tip"
          description: "No follower instance published the finalized L1 blocks for two finality steps. The da-watcher and the batcher wait on the l1_blocks stream, so deposits and the batcher's post age stall next. Runbook: docs/runbooks/l1_follower_lag.md."
          runbook: "docs/runbooks/l1_follower_lag.md"

      # A follower sleeps until its planned wake time between finality
      # steps. A wake more than two minutes overdue means the process
      # froze or its loop stopped.
      - alert: KardamomL1FollowerWakeOverdue
        expr: time() - kardamom_l1_follower_next_wake_seconds > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "L1 follower wake overdue by {{ $value }}s ({{ $labels.host_id }})"
          description: "The follower planned to read L1 at kardamom_l1_follower_next_wake_seconds and did not. Its /ready answers 503. The other instance carries the stream alone. Runbook: docs/runbooks/l1_follower_wake_overdue.md."
          runbook: "docs/runbooks/l1_follower_wake_overdue.md"

      - alert: KardamomL1SourceDisagreement
        # Two L1 sources answered differently for the same block or log.
        # A follower halts on this; it is never resolved by majority.
        expr: increase(kardamom_l1_source_disagreement_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "L1 sources disagree ({{ $labels.host_id }})"
          description: "A follower saw two L1 endpoints disagree in the last 10m and halted. Both answers are in its log. Decide which endpoint lies before the follower resumes."

  - name: kardamom-validator
    rules:
      - alert: KardamomValidatorEpochsUnverified
        # A coverage gap: L1 did not answer inside the retry window, so
        # the validator committed an epoch without checking it. This is
        # not a chain fault. It means the L1 data path is not delivering.
        expr: increase(validator_epochs_unverified_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "validator committed unverified epochs ({{ $labels.host_id }})"
          description: "{{ $value }} epochs committed without an L1 check in the last 10m. The L1 endpoint (or the light client in front of it) is not answering. Verification coverage is dropping silently."

      - alert: KardamomValidatorEpochFault
        # A chain fault: the epoch on the canonical stream disagrees
        # with L1. The validator records a divergence and holds the
        # validator_divergence halt. The process stays up and the
        # counter moves once. Page on it.
        expr: increase(validator_epoch_faults_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "validator epoch fault ({{ $labels.host_id }})"
          description: "An epoch on the canonical stream does not match L1. The validator halts on this. Inspect the validator log for the fault reason."

      - alert: KardamomValidatorDivergence
        # The validator's re-execution disagrees with the executor's
        # published result. Same severity as an epoch fault.
        expr: increase(validator_divergence_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "validator divergence ({{ $labels.host_id }})"
          description: "Re-execution diverged from the published block. The validator halts on this. Inspect the divergence dump."

      - alert: KardamomValidatorDown
        expr: up{job="kardamom-validator"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "validator scrape target down"
          description: "Prometheus cannot scrape the validator. A halted validator (epoch fault or divergence) looks like this too."

  # One rule per halt cause. A halted service exports kardamom_halt = 1
  # with the cause and the runbook id as labels, and serves the whole
  # record (the detail: the block, the hashes, the cursor and the floor)
  # as JSON on /halt beside /metrics. The alert text is the recovery
  # procedure, not a metric name: it names the cause, where the detail
  # is, and the runbook that holds the steps in order.
  - name: kardamom-halts
    rules:
      - alert: KardamomHaltL1SourceDisagreement
        expr: kardamom_halt{cause="l1_source_disagreement"} == 1
        for: 0m
        labels:
          severity: critical
          cause: l1_source_disagreement
        annotations:
          summary: "{{ $labels.service }} halted: l1_source_disagreement ({{ $labels.host_id }})"
          description: "Two L1 sources answered differently for one block or one log query, and no light client settled it. One source lies; the follower retries every tick and resumes when two sources agree. Detail: http://{{ $labels.instance }}/halt. Runbook: docs/runbooks/l1_source_disagreement.md (recovery id {{ $labels.recovery }})."
          runbook: "docs/runbooks/l1_source_disagreement.md"

      - alert: KardamomHaltL1ChainBreak
        expr: kardamom_halt{cause="l1_chain_break"} == 1
        for: 0m
        labels:
          severity: critical
          cause: l1_chain_break
        annotations:
          summary: "{{ $labels.service }} halted: l1_chain_break ({{ $labels.host_id }})"
          description: "A finalized L1 block does not descend from the block the follower holds. Finality forbids that, so a source lies or the follower's cursor holds a lie. The follower retries every tick. Detail: http://{{ $labels.instance }}/halt. Runbook: docs/runbooks/l1_chain_break.md (recovery id {{ $labels.recovery }})."
          runbook: "docs/runbooks/l1_chain_break.md"

      - alert: KardamomHaltL1Unreachable
        expr: kardamom_halt{cause="l1_unreachable"} == 1
        for: 0m
        labels:
          severity: critical
          cause: l1_unreachable
        annotations:
          summary: "{{ $labels.service }} halted: l1_unreachable ({{ $labels.host_id }})"
          description: "No L1 source answers. The service retries on a backoff and resumes when a source answers. While the batcher cannot post, the DA-lag guard halts new transactions before the chain loses its recoverable range. Detail: http://{{ $labels.instance }}/halt. Runbook: docs/runbooks/l1_unreachable.md (recovery id {{ $labels.recovery }})."
          runbook: "docs/runbooks/l1_unreachable.md"

      - alert: KardamomHaltReplayUnavailable
        expr: kardamom_halt{cause="replay_unavailable"} == 1
        for: 0m
        labels:
          severity: critical
          cause: replay_unavailable
        annotations:
          summary: "{{ $labels.service }} halted: replay_unavailable ({{ $labels.host_id }})"
          description: "The sealer refused the batcher's replay: the cursor is below the retention floor and no copy of the range is at hand. The batcher waits for an operator. Do not restart it. Detail: http://{{ $labels.instance }}/halt. Runbook: docs/runbooks/replay_unavailable.md (recovery id {{ $labels.recovery }})."
          runbook: "docs/runbooks/replay_unavailable.md"

      - alert: KardamomHaltDaLag
        expr: kardamom_halt{cause="da_lag"} == 1
        for: 0m
        labels:
          severity: critical
          cause: da_lag
        annotations:
          summary: "{{ $labels.service }} halted: da_lag ({{ $labels.host_id }})"
          description: "The sealed head is more than the DA-lag budget past the last block posted to L1. The sealer refuses new transactions until the batcher posts again; the ingresses pause submits on it. The ingress observes the sealer and exports this halt. Find why the batcher does not post. Detail: kardamom_chainStatus on the ingress, and http://{{ $labels.instance }}/halt. Runbook: docs/runbooks/da_lag.md (recovery id {{ $labels.recovery }})."
          runbook: "docs/runbooks/da_lag.md"

      - alert: KardamomHaltRecordLag
        expr: kardamom_halt{cause="record_lag"} == 1
        for: 0m
        labels:
          severity: critical
          cause: record_lag
        annotations:
          summary: "{{ $labels.service }} halted: record_lag ({{ $labels.host_id }})"
          description: "The last ordered canonical index is more than the record-lag budget past the highest index that an executor recorded. The sealer refuses new transactions until an executor records again; the ingresses pause submits on it. The ingress observes the sealer and exports this halt. Find why no executor records. Detail: kardamom_chainStatus on the ingress, and http://{{ $labels.instance }}/halt. Runbook: docs/runbooks/record_lag.md (recovery id {{ $labels.recovery }})."
          runbook: "docs/runbooks/record_lag.md"

      - alert: KardamomHaltSealerNoQuorum
        expr: kardamom_halt{cause="sealer_no_quorum"} == 1
        for: 0m
        labels:
          severity: critical
          cause: sealer_no_quorum
        annotations:
          summary: "{{ $labels.service }} halted: sealer_no_quorum (seen by {{ $labels.host_id }})"
          description: "The sealer emits no block boundary: the cluster has no leader or no quorum. Nothing is ordered; the ingresses and the sequencers pause on it. The ingress observes the sealer and exports this halt. Detail: kardamom_chainStatus on the ingress, and http://{{ $labels.instance }}/halt. Runbook: docs/runbooks/sealer_no_quorum.md (recovery id {{ $labels.recovery }})."
          runbook: "docs/runbooks/sealer_no_quorum.md"

      - alert: KardamomHaltL1CursorUnreadable
        expr: kardamom_halt{cause="l1_cursor_unreadable"} == 1
        for: 0m
        labels:
          severity: critical
          cause: l1_cursor_unreadable
        annotations:
          summary: "{{ $labels.service }} halted: l1_cursor_unreadable ({{ $labels.host_id }})"
          description: "The da-watcher's L1 cursor file exists, but it does not read or parse. The da-watcher publishes no epoch, so deposits wait. It never guesses a resume block. Find the last published L1 block, write the file again, then clear the halt. Detail: http://{{ $labels.instance }}/halt. Runbook: docs/runbooks/l1_cursor_unreadable.md (recovery id {{ $labels.recovery }})."
          runbook: "docs/runbooks/l1_cursor_unreadable.md"

      - alert: KardamomHaltValidatorDivergence
        expr: kardamom_halt{cause="validator_divergence"} == 1
        for: 0m
        labels:
          severity: critical
          cause: validator_divergence
        annotations:
          summary: "{{ $labels.service }} halted: validator_divergence ({{ $labels.host_id }})"
          description: "The validator's re-execution disagreed with the executor's published result. The validator holds, serves its metrics, and waits for an operator after the investigation. Detail: http://{{ $labels.instance }}/halt. Runbook: docs/runbooks/validator_divergence.md (recovery id {{ $labels.recovery }})."
          runbook: "docs/runbooks/validator_divergence.md"

      - alert: KardamomHaltL1LightClientMismatch
        expr: kardamom_halt{cause="l1_light_client_mismatch"} == 1
        for: 0m
        labels:
          severity: critical
          cause: l1_light_client_mismatch
        annotations:
          summary: "{{ $labels.service }} halted: l1_light_client_mismatch ({{ $labels.host_id }})"
          description: "The last header of the L1 follower's finality step is not the light client's finalized header for that number, though two sources agreed on it. Either both sources lie the same way or the light client is wrong. The follower publishes nothing until an operator clears the halt. Detail: http://{{ $labels.instance }}/halt. Runbook: docs/runbooks/l1_light_client_mismatch.md (recovery id {{ $labels.recovery }})."
          runbook: "docs/runbooks/l1_light_client_mismatch.md"

      - alert: KardamomHaltL1FollowerDisagreement
        expr: kardamom_halt{cause="l1_follower_disagreement"} == 1
        for: 0m
        labels:
          severity: critical
          cause: l1_follower_disagreement
        annotations:
          summary: "{{ $labels.service }} halted: l1_follower_disagreement ({{ $labels.host_id }})"
          description: "Two records of one L1 block number with different hashes arrived on l1_blocks: one follower instance read a lie its two-source check did not catch. The consumer takes nothing more from the stream until an operator clears the halt. Detail: http://{{ $labels.instance }}/halt. Runbook: docs/runbooks/l1_follower_disagreement.md (recovery id {{ $labels.recovery }})."
          runbook: "docs/runbooks/l1_follower_disagreement.md"

      # A restarted sequencer can miss the epoch the sealer expects while
      # its twin offers it again within milliseconds. The rule waits one
      # minute, so only a gap that no replica fills pages.
      - alert: KardamomHaltOriginGap
        expr: kardamom_halt{cause="origin_gap"} == 1
        for: 1m
        labels:
          severity: critical
          cause: origin_gap
        annotations:
          summary: "{{ $labels.service }} halted: origin_gap ({{ $labels.host_id }})"
          description: "The sealer refuses the next L1 epoch because an earlier one is missing, and this sequencer did not get the missing epoch for 90 s, so the da-watcher does not publish it again; or the sequencer holds the most relayed epochs that no boundary confirms. Deposits stop; transactions continue. The detail names the L1 block. Detail: http://{{ $labels.instance }}/halt. Runbook: docs/runbooks/origin_gap.md (recovery id {{ $labels.recovery }})."
          runbook: "docs/runbooks/origin_gap.md"

  # A pause is not a fault of the paused service: it waits on a root halt
  # upstream, or on an operator. It never pages. The root's halt rule
  # above pages once, with the root's runbook; the inhibit rule in
  # deploy/alertmanager-inhibit.yml mutes this alert while the root's
  # alert fires, keyed on the cause label both carry.
  - name: kardamom-pauses
    rules:
      - alert: KardamomServicePaused
        expr: kardamom_paused == 1
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.service }} paused: {{ $labels.reason }} on {{ $labels.root_service }} ({{ $labels.cause }}, {{ $labels.host_id }})"
          description: "The service makes no progress and waits. reason=upstream: it waits on the halt of {{ $labels.root_service }} (cause {{ $labels.cause }}) and resumes by itself when that clears; follow the root's runbook, docs/runbooks/{{ $labels.cause }}.md. reason=operator: an operator paused it; POST /resume on its node ends the pause. Detail: http://{{ $labels.instance }}/halt."

  # A must-deliver publication with no connected subscriber holds its
  # publisher: the executor retries the receipt until the ingress takes
  # it. While discovery lists a subscriber, the executor reopens the
  # publication after one Aeron stall budget and exits with code 3 after
  # five, so Nomad restarts it. The alert pages the minute in between: a
  # subscriber is down, or a publication is dead on the publisher side.
  - name: kardamom-publications
    rules:
      - alert: KardamomPublicationNotConnected
        expr: kardamom_publication_connected == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} {{ $labels.topic }} publication has no subscriber ({{ $labels.host_id }})"
          description: "The must-deliver {{ $labels.topic }} publication of {{ $labels.service }} has had no connected subscriber for {{ $value }} s (kardamom_publication_not_connected_seconds). The publisher holds its receipts and retries. While discovery lists a subscriber of the topic, it reopens the publication after one stall budget and exits with code 3 after five. Check the subscribers of the topic (the ingress and the state mirror for tx_receipts) and the image lines of their logs (`aeron: image available`)."
