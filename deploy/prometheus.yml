global:
  scrape_interval: 1s
  evaluation_interval: 5s

# One scrape job per kardamom service. Each `static_configs.targets` is the
# list of host:port pairs running that service. To add a host, append
# `host-N:<port>` to the matching job's `targets` — every metric is already
# labelled with `host_id` (set via `--host-id` on the binary), so Prometheus
# can group by host without relabel rules.
#
# `host.docker.internal` reaches loopback-bound services on Docker Desktop
# (macOS/Windows) only. On Linux it resolves to the bridge gateway, so start
# each service with `--metrics-addr 0.0.0.0:<port>` to make these targets
# reachable.
scrape_configs:
  # P=2 racing replicas per shard: replica group "a" exports on :9001, group
  # "b" (the colocated twin, rotated shard) on :9011. Both replicas of a
  # shard process the same tx stream, so stream-derived counters must be
  # aggregated `max by (partition)` — summing double-counts. The `replica`
  # target label separates the groups; single-replica dev stacks simply show
  # the :9011 target as down.
  - job_name: kardamom-sequencer
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9001"]
        labels: {replica: "a"}
      - targets: ["host.docker.internal:9011"]
        labels: {replica: "b"}

  - job_name: kardamom-batcher
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9002"]

  - job_name: kardamom-executor
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9004"]

  - job_name: kardamom-da-watcher
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9005"]

  - job_name: kardamom-ingress
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9006"]
