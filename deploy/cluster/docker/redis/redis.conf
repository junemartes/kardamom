# The account-state projection cache. See
# docs/specs/2026-09-13-redis-account-cache-design.md, section 6.
#
# This is a cache. mdbx on the executors is the source of truth, and the
# state mirror rebuilds the projection from a checkpoint. So there is no
# persistence: no RDB, no AOF. A restart comes back empty and the mirror
# rebuilds. A memory bound with LRU eviction degrades to more misses,
# never to a stall.

bind 0.0.0.0
port 6379
# The cluster network is isolated. Authentication and ACLs are the
# flag-day item of the spec's trust rule.
protected-mode no

save ""
appendonly no

maxmemory 1gb
maxmemory-policy allkeys-lru

# A replica never takes writes; the sentinels promote it first.
replica-read-only yes
# The replica answers reads while it syncs, so a reader sees the last
# known state rather than an error during a failover.
replica-serve-stale-data yes
