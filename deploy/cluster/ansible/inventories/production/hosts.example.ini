# Example inventory of the production profile (the dedicated core).
# Copy this inventory directory outside the repo, fill in the dedicated
# inventory and vSwitch inputs, and keep encrypted secrets in
# group_vars/production/vault.yml. Run:
#   ansible-playbook -i <copy> -u root bootstrap.yml
#
# The elastic Cloud nodes (ingress and sequencer pools) are not listed
# here. They configure themselves at first boot from the elastic image;
# the Nomad Autoscaler creates and deletes them.
#
# Each host carries kardamom_node, role, tier, node_index and the vSwitch
# inputs of roles/vswitch. node_ip is not listed: roles/netinfo derives it
# from vswitch_address. control_plane=true enables the Consul and Nomad
# servers; one or three hosts carry it (the profile checks the count of
# expected servers).

[control]
core-0 ansible_host=203.0.113.10 kardamom_node=core-0 role=control tier=control node_index=0 control_plane=true vswitch_address=10.10.1.10
core-1 ansible_host=203.0.113.11 kardamom_node=core-1 role=control tier=control node_index=1 control_plane=true vswitch_address=10.10.1.11
core-2 ansible_host=203.0.113.12 kardamom_node=core-2 role=control tier=control node_index=2 control_plane=true vswitch_address=10.10.1.12

[sealer]
sealer-0 ansible_host=203.0.113.20 kardamom_node=sealer-0 role=sealer tier=worker node_index=0 vswitch_address=10.10.1.20
sealer-1 ansible_host=203.0.113.21 kardamom_node=sealer-1 role=sealer tier=worker node_index=1 vswitch_address=10.10.1.21
sealer-2 ansible_host=203.0.113.22 kardamom_node=sealer-2 role=sealer tier=worker node_index=2 vswitch_address=10.10.1.22

[executor]
executor-0 ansible_host=203.0.113.30 kardamom_node=executor-0 role=executor tier=worker node_index=0 vswitch_address=10.10.1.30
executor-1 ansible_host=203.0.113.31 kardamom_node=executor-1 role=executor tier=worker node_index=1 vswitch_address=10.10.1.31
executor-2 ansible_host=203.0.113.32 kardamom_node=executor-2 role=executor tier=worker node_index=2 vswitch_address=10.10.1.32

# The service classes, one node each (node_roles; roles/nomad stamps the set
# the service jobs constrain on). redis: the primary, the replica and the
# third sentinel. batcher, monitoring, validator and indexer keep state on
# their node; the indexer (the L1 follower) runs on two nodes, whose
# archives record l1_blocks. da-watcher: its own node (its archive records
# tx_deposits). The
# edge is the load balancer of the provider, with the ingress servers as
# its targets.
[redis]
redis-0 ansible_host=203.0.113.40 kardamom_node=redis-0 role=redis node_roles=redis,redis-primary tier=worker node_index=0 vswitch_address=10.10.1.40
redis-1 ansible_host=203.0.113.41 kardamom_node=redis-1 role=redis node_roles=redis,redis-replica tier=worker node_index=1 vswitch_address=10.10.1.41
redis-2 ansible_host=203.0.113.42 kardamom_node=redis-2 role=redis node_roles=redis tier=worker node_index=2 vswitch_address=10.10.1.42
[batcher]
batcher-0 ansible_host=203.0.113.50 kardamom_node=batcher-0 role=batcher tier=worker node_index=0 vswitch_address=10.10.1.50
[monitoring]
monitoring-0 ansible_host=203.0.113.51 kardamom_node=monitoring-0 role=monitoring tier=worker node_index=0 vswitch_address=10.10.1.51
[validator]
validator-0 ansible_host=203.0.113.52 kardamom_node=validator-0 role=validator tier=worker node_index=0 vswitch_address=10.10.1.52
[indexer]
indexer-0 ansible_host=203.0.113.61 kardamom_node=indexer-0 role=indexer tier=worker node_index=0 vswitch_address=10.10.1.61
indexer-1 ansible_host=203.0.113.62 kardamom_node=indexer-1 role=indexer tier=worker node_index=1 vswitch_address=10.10.1.62
[da_watcher]
da-watcher-0 ansible_host=203.0.113.60 kardamom_node=da-watcher-0 role=da-watcher tier=worker node_index=0 vswitch_address=10.10.1.60

[dedicated:children]
control
sealer
executor
redis
batcher
monitoring
validator
indexer
da_watcher

# The vSwitch inputs shared by every dedicated host. The gateway is the
# first address of the vswitch subnet; the Cloud Network range is routed
# through it. See roles/vswitch.
[dedicated:vars]
vswitch_parent=enp0s31f6
vswitch_vlan_id=4000
vswitch_prefix_len=24
vswitch_gateway=10.10.1.1
cloud_network_cidr=10.10.0.0/16

[production:children]
dedicated
