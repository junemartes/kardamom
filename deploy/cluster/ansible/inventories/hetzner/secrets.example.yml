---
# The secret inputs of the production profile. Copy this file to
# group_vars/vault.yml in the inventory copy and encrypt it with
# ansible-vault. roles/profile refuses an empty value.
#
# consul keygen
consul_gossip_key: ""
# The Consul agent token of the dedicated hosts (policy: node-identity).
consul_agent_token: ""
# The Consul token the Nomad agents use for service registration.
nomad_consul_token: ""
