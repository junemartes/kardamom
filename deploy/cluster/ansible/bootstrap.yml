---
# Configure a host and join it to the substrate. The order is: the
# credential enrollment of an elastic node, the deployment profile check,
# the base packages, the vSwitch VLAN on a dedicated host, the private
# address, Docker, the host firewall, then the Consul and Nomad agents. The same roles serve the local profile
# (the node containers) and the production profile
# (dedicated core and cloud pools). The local Docker registry
# runs on the control node of the local profile only. All values derive
# from group_vars/all.yml and the inventory of the profile.

- name: Configure every host and join it to the substrate
  hosts: "{{ provision_hosts | default('all') }}"
  become: true
  pre_tasks:
    # A check of the whole inventory. An elastic node and an image build
    # use an inventory of one host alone, so they skip the check.
    - name: Check the redis-primary placement
      when: >-
        not (image_build | default(false) | bool)
        and enrollment_argv is not defined and bootstrap_revision is not defined
      ansible.builtin.include_role:
        name: profile
        tasks_from: redis_primary
  roles:
    - role: enroll
      when: enrollment_argv is defined
    - profile
    - common
    - role: vswitch
      when: vswitch_vlan_id is defined
    - netinfo
    - docker
    - role: firewall
      when: deployment_profile == 'production'
    - consul
    - nomad

- name: Run the local Docker registry on the control node
  hosts: control
  become: true
  roles:
    - role: registry
      when: deployment_profile == 'local'
