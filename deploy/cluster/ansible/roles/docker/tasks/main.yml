---
- name: Install docker software on an unprepared node
  ansible.builtin.import_tasks: install.yml
  when: not (common_node_software_preinstalled | default(false) | bool)

- name: Configure the Docker daemon (trusted plain-HTTP registries)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
