---
# A service that this play started read the new files at its start, so it
# needs no restart. The start task reports the state of the unit before
# the start: only a unit that was active then runs the old files.
- name: Restart docker
  when: (docker_start.status | default({})).ActiveState | default('active') == 'active'
  ansible.builtin.systemd:
    name: docker
    state: restarted
