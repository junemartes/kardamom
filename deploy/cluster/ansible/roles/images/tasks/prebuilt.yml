---
- name: Create a private service image context
  ansible.builtin.file:
    path: "{{ images_staging.path }}/services/_aeronlibs"
    state: directory
    mode: "0755"

- name: Stage prebuilt Linux service binaries
  ansible.builtin.copy:
    src: "{{ images_release_dir }}/kardamom-{{ item }}"
    dest: "{{ images_staging.path }}/services/kardamom-{{ item }}"
    remote_src: true
    mode: "0755"
  loop: "{{ images_services }}"

- name: Find Aeron shared libraries from the release build
  ansible.builtin.find:
    paths: "{{ images_release_dir }}/build"
    recurse: true
    file_type: any
    patterns: 'libaeron*.so'
  register: images_library_search

# rusteron-client and rusteron-archive each build their own Aeron C tree,
# and the two libaeron.so differ. The service binaries link the archive
# crate's build, so prefer its directories when they exist. One cargo
# target holds one archive build per feature set (the services, the load
# harness and the semantics runner build it separately), so take the most
# recent build of each library: the binaries carry no runpath, and every
# build compiles the same pinned Aeron version.
- name: Collect Aeron build outputs
  ansible.builtin.set_fact:
    images_library_candidates: >-
      {{ (images_library_found | selectattr('path', 'search', '/rusteron-archive-') | list)
         or images_library_found }}
  vars:
    images_library_found: >-
      {{ images_library_search.files
         | selectattr('path', 'search', '/out/build/lib/libaeron[^/]*\.so$') | list }}

- name: Select the most recent build of each Aeron library
  ansible.builtin.set_fact:
    images_library_paths: >-
      {{ images_library_paths | default([])
         + [(images_library_candidates | selectattr('path', 'search', '/' ~ (item | regex_escape) ~ '$')
             | sort(attribute='mtime') | last).path] }}
  loop: "{{ images_library_candidates | map(attribute='path') | map('basename') | unique | sort }}"

- name: Require the Aeron runtime libraries
  ansible.builtin.assert:
    that:
      - "'libaeron.so' in images_library_paths | default([]) | map('basename') | list"
      - "'libaeron_archive_c_client.so' in images_library_paths | default([]) | map('basename') | list"
    fail_msg: Build the Linux service binaries and Aeron shared libraries first.

- name: Stage Aeron runtime libraries
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ images_staging.path }}/services/_aeronlibs/{{ item | basename }}"
    remote_src: true
    mode: "0755"
  loop: "{{ images_library_paths }}"
