---
- name: Validate optional L1 light client configuration
  ansible.builtin.assert:
    that:
      - >-
        (workloads_light_execution_rpc | length == 0 and workloads_light_consensus_rpc | length == 0)
        or (workloads_light_execution_rpc | length > 0 and workloads_light_consensus_rpc | length > 0
        and workloads_light_checkpoint | length > 0 and workloads_lockbox_address | length > 0)
    fail_msg: The L1 light client requires execution RPC, consensus RPC, checkpoint and lockbox address.

# The deploy adds the public inhibit rules; a second inhibit_rules key
# would make the configuration invalid.
- name: Validate the Alertmanager configuration of the environment
  ansible.builtin.assert:
    that:
      - (lookup('file', workloads_alertmanager_config_file) | from_yaml).route is defined
      - (lookup('file', workloads_alertmanager_config_file) | from_yaml).inhibit_rules is not defined
    fail_msg: The Alertmanager configuration needs a route and must not hold inhibit_rules.
  when: workloads_alertmanager_config_file | length > 0
  no_log: true

# The sealer refuses user transactions once the sealed head is the
# DA-lag budget past the posted head. An idle chain seals a block about
# every second, so the idle posting interval, in seconds, must stay
# below the budget, or the guard halts the chain between two posts.
- name: Validate the batcher's idle interval against the DA-lag budget
  vars:
    workloads_budget: "{{ (workloads_da_lag_budget_blocks | default('10000', true)) | int }}"
    workloads_idle_ms: >-
      {{ (workloads_batcher_idle_flush_ms | default(workloads_batcher_flush_ms, true) | default('3000', true)) | int }}
  ansible.builtin.assert:
    that:
      - workloads_budget | int == 0 or (workloads_idle_ms | int) // 1000 < workloads_budget | int
    fail_msg: >-
      BATCHER_IDLE_FLUSH_MS ({{ workloads_idle_ms }}) must be below the DA-lag budget
      ({{ workloads_budget }} blocks) at one block a second, or the guard halts an idle chain
      between posts. Lower the idle flush or raise KARDAMOM_DA_LAG_BUDGET_BLOCKS.

# A reader of the egress stops when no egress serves it, and an egress
# without the executors' frames has nothing to serve.
- name: Validate the egress switches
  vars:
    workloads_reader_switches:
      KARDAMOM_VALIDATOR_EGRESS: "{{ workloads_validator_egress }}"
      KARDAMOM_BATCHER_EGRESS: "{{ workloads_batcher_egress }}"
      KARDAMOM_SEQUENCER_RECEIPTS_FROM_EGRESS: "{{ workloads_sequencer_receipts_from_egress }}"
      KARDAMOM_INGRESS_RECEIPTS_FROM_EGRESS: "{{ workloads_ingress_receipts_from_egress }}"
      KARDAMOM_NOTIFIER_RECEIPTS_FROM_EGRESS: "{{ workloads_notifier_receipts_from_egress }}"
    workloads_switches: "{{ workloads_reader_switches | combine({'KARDAMOM_EXEC_FRAMES': workloads_exec_frames}) }}"
    workloads_readers_on: "{{ workloads_reader_switches | dict2items | selectattr('value', 'equalto', 'on') | map(attribute='key') | list }}"
  ansible.builtin.assert:
    that:
      - workloads_switches.values() | reject('in', ['', 'on', 'off']) | list | length == 0
      - workloads_readers_on | length == 0 or workloads_egress | bool
      - not (workloads_egress | bool) or workloads_exec_frames == 'on'
    fail_msg: >-
      Each egress switch is on, off or empty: {{ workloads_switches }}.
      A reader switch ({{ workloads_readers_on }}) needs KARDAMOM_EGRESS=1, and the egress needs KARDAMOM_EXEC_FRAMES=on.

# With its switch on, the notifier and the egress each place one instance
# on each node of their role (distinct_hosts). An instance without a node
# is never placed, and the deployment never turns healthy. So the
# preflight counts the ready, eligible nodes of each role before any job
# changes. The filter matches the exact role in the comma-separated role
# set, as set_contains does. An empty notifier count is the job's
# default, 1.
- name: Read the ready nodes of each moved role
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/nodes?filter={{ workloads_role_node_filter | urlencode }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
  vars:
    workloads_role_node_filter: >-
      Meta.roles matches "(^|,) *{{ item.role }} *(,|$)" and Status == "ready" and SchedulingEligibility == "eligible"
  loop: "{{ workloads_moved_roles }}"
  loop_control:
    label: "{{ item.role }}"
  register: workloads_role_node_lists
  check_mode: false

- name: Require a node for each instance of a moved role
  vars:
    workloads_role_ready: "{{ item.json | map(attribute='Name') | sort }}"
  ansible.builtin.assert:
    that:
      - item.item.instances | int <= workloads_role_ready | length
    fail_msg: >-
      {{ item.item.count_name }} ({{ item.item.instances }}) is above the count of the ready, eligible
      Nomad nodes with {{ item.item.role }} in meta.roles ({{ workloads_role_ready }}). Add the {{ item.item.role }}
      nodes or lower the count.
  loop: "{{ workloads_role_node_lists.results }}"
  loop_control:
    label: "{{ item.item.role }}"

- name: Validate image provenance
  ansible.builtin.import_tasks: provenance.yml

- name: Check the settlement deployer when no address was supplied
  ansible.builtin.stat:
    path: "{{ workloads_deploy_binary }}"
  register: workloads_deployer_stat
  when: workloads_settlement_address | length == 0

- name: Require a settlement address or the contract deployer
  ansible.builtin.assert:
    that: workloads_deployer_stat.stat.executable | default(false)
    fail_msg: Build kardamom-deploy or supply workloads_settlement_address; the batcher needs a real settlement.
  when: workloads_settlement_address | length == 0

- name: Check contract deployer automation support
  ansible.builtin.command:
    argv: ["{{ workloads_deploy_binary }}", --owner, "{{ workloads_l1_owner }}", addresses, --help]
  register: workloads_deployer_help
  changed_when: false
  check_mode: false
  when: workloads_settlement_address | length == 0

- name: Require a current contract deployer before changing jobs
  ansible.builtin.assert:
    that:
      - "'--json' in workloads_deployer_help.stdout"
      - "'--contract' in workloads_deployer_help.stdout"
    fail_msg: Rebuild kardamom-deploy; this playbook requires addresses --contract --json.
  when: workloads_settlement_address | length == 0

- name: Explain the dev lockbox placeholder
  ansible.builtin.debug:
    msg: No lockbox address configured; the da-watcher deposit path is disabled by its placeholder.
  when: workloads_lockbox_address | length == 0

- name: Validate a supplied settlement before changing any jobs
  ansible.builtin.assert:
    that:
      - workloads_settlement_address is match('^0x[0-9a-fA-F]{40}$')
      - workloads_settlement_address != '0x0000000000000000000000000000000000000000'
  when: workloads_settlement_address | length > 0

- name: Read and validate routing before submitting any job
  vars:
    workloads_map: "{{ lookup('file', workloads_cluster_dir ~ '/config/shard-map.toml') | community.general.from_toml }}"
  ansible.builtin.assert:
    that:
      - partition_count in [1, 2, 4, 8]
      - tx_ttl_ms is integer and tx_ttl_ms > 0
      - workloads_map.version is integer and workloads_map.version >= 0
      - workloads_map.table | length == 256
      - workloads_map.table | select('integer') | list | length == 256
      - workloads_map.table | min >= 0
      - workloads_map.table | max < 8

- name: Gate the release
  ansible.builtin.import_tasks: gate.yml
