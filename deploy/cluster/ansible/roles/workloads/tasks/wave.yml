---
# The end of a wave of a new cluster: wait for each job whose wait the
# wave deferred, then start the next wave with an empty list. The jobs of
# the wave already run together, so each wait is short after the first.
- name: Wait for the jobs of the wave
  ansible.builtin.include_tasks: wait.yml
  loop: "{{ workloads_deferred }}"
  loop_control:
    loop_var: workloads_wait_job

- name: Start the next wave
  ansible.builtin.set_fact:
    workloads_deferred: []
