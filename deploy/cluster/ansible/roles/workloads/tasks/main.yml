---
- name: Validate deployment inputs and image provenance
  ansible.builtin.import_tasks: preflight.yml

- name: Initialize deployment state
  ansible.builtin.set_fact:
    workloads_jobs: {}

- name: Deploy Aeron
  ansible.builtin.include_tasks: job.yml
  vars:
    workloads_job:
      name: aeron
      file: aeron.system.nomad.hcl
      retries: 200
      vars:
        archive_file_sync_level: "{{ workloads_archive_file_sync_level }}"

# The development L1: anvil runs only when no real L1 is given (L1_RPC).
# Behind the fault proxy, the followers walk finalized blocks, so anvil
# finalizes two blocks behind its head (one slot per epoch).
- name: Deploy the development L1
  ansible.builtin.include_tasks: job.yml
  vars:
    workloads_job:
      name: anvil
      vars: "{{ {'slots_in_an_epoch': '1'} if workloads_l1_fault_proxy | bool else {} }}"
  when: workloads_l1_rpc | length == 0

- name: Discover the in-cluster L1 through the Nomad API
  ansible.builtin.include_tasks: anvil.yml
  when:
    - workloads_l1_rpc | length == 0
    - workloads_settlement_address | length == 0
    - not ansible_check_mode

# The lying L1 of the chaos-l1 shard: every follower reads anvil through
# it, and the harness sets its faults. It comes up before its consumers.
- name: Deploy the L1 fault proxy
  ansible.builtin.include_tasks: job.yml
  vars:
    workloads_job: {name: l1-fault-proxy}
  when: workloads_l1_fault_proxy | bool

- name: Resolve settlement before deploying its consumers
  ansible.builtin.import_tasks: settlement.yml

# Submit sequencers without waiting: they may need downstream subscribers.
# Ingress must subscribe to receipts before executors start publishing them.
- name: Deploy the sealer
  ansible.builtin.include_tasks: sealer.yml
  vars:
    workloads_sealer_job:
      name: cluster
      retries: 100
      vars:
        cluster_retention: "{{ workloads_cluster_retention }}"
        cluster_snapshot_interval_s: "{{ workloads_cluster_snapshot_s }}"
        cluster_log_purge_keep_snapshots: "{{ workloads_cluster_log_purge_keep }}"
        cluster_da_lag_budget_blocks: "{{ workloads_da_lag_budget_blocks }}"
        cluster_file_sync_level: "{{ workloads_cluster_file_sync_level }}"
        cluster_remote_origins: "{{ workloads_remote_origins }}"

- name: Deploy pipeline dependencies
  ansible.builtin.include_tasks: job.yml
  loop:
    - name: sequencer
      wait: false
      vars:
        shard_table: "{{ (lookup('file', workloads_cluster_dir ~ '/config/shard-map.toml') | community.general.from_toml).table | to_json }}"
    # The cache before its readers and its writer: the ingress reads it,
    # the state mirror writes it.
    - {name: redis}
    - {name: ingress}
    - {name: executor, wait: false}
    - {name: state-mirror, wait: false}
    # The notifier taps the sequencers' and the ingress's status stream
    # and the executors' receipts; it needs none of them up to start.
    - {name: notifier, wait: false}
  loop_control:
    loop_var: workloads_job
    label: "{{ workloads_job.name }}"

- name: Deploy optional L1 light client
  ansible.builtin.include_tasks: job.yml
  vars:
    workloads_job:
      name: l1-light-client
      vars:
        execution_rpc: "{{ workloads_light_execution_rpc }}"
        consensus_rpc: "{{ workloads_light_consensus_rpc }}"
        checkpoint: "{{ workloads_light_checkpoint }}"
        network: "{{ workloads_light_network }}"
  when: workloads_light_execution_rpc | length > 0

- name: Deploy pipeline followers
  ansible.builtin.include_tasks: job.yml
  loop:
    - name: validator
      wait: false
      vars:
        l1_rpc_url: "{{ 'http://' ~ workloads_light_host ~ ':' ~ workloads_light_port if workloads_light_execution_rpc | length > 0 else '' }}"
        lockbox_address: "{{ workloads_lockbox_address if workloads_light_execution_rpc | length > 0 else '' }}"
    # The watcher derives the epochs the validator checks. It walks the
    # followers' L1 (workloads_followers_rpc): the fault proxy when it is
    # deployed, else the light client when one runs and can serve every
    # block, else the real L1; the in-cluster anvil otherwise.
    - name: da-watcher
      wait: false
      vars: >-
        {{ {'lockbox_address': workloads_lockbox_address}
           | combine({'l1_rpc': workloads_followers_rpc}
                     if workloads_l1_rpc_given | length > 0 or workloads_l1_fault_proxy | bool else {})
           | combine({'l1_light_client_rpc': workloads_followers_light_client} if workloads_followers_light_client | length > 0 else {}) }}
  loop_control:
    loop_var: workloads_job
    label: "{{ workloads_job.name }}"

# Prometheus scrapes every service by its Consul node name, so it comes
# up after the services it scrapes; Grafana provisions the dashboards.
# The host exporter is a system job; Prometheus discovers it through
# Consul. The nodes of the local profile share one host, so their
# exporters skip the host hardware collectors (see the job file).
- name: Deploy the host exporter and monitoring
  ansible.builtin.include_tasks: job.yml
  loop:
    - name: node-exporter
      file: node-exporter.system.nomad.hcl
      wait: false
      vars:
        host_hardware: "{{ 'off' if deployment_profile == 'local' else 'on' }}"
    - {name: monitoring, wait: false}
  loop_control:
    loop_var: workloads_job
    label: "{{ workloads_job.name }}"

- name: Wait for pipeline followers
  ansible.builtin.include_tasks: wait.yml
  loop: [sequencer, executor, state-mirror, notifier, validator, da-watcher, node-exporter, monitoring]
  loop_control:
    loop_var: workloads_wait_job
  when: not ansible_check_mode

# The DA layer is the batcher's writer side and every reader's source,
# behind one Consul service. Without an EigenDA network it is the
# file-backed stand-in (the local profile, the e2e suites); with one,
# the EigenDA proxy that the batcher's account pays for.
- name: Deploy the DA stand-in
  ansible.builtin.include_tasks: job.yml
  vars:
    workloads_job:
      name: da-store
  when: workloads_eigenda_network | length == 0

- name: Deploy the DA proxy
  ansible.builtin.include_tasks: job.yml
  vars:
    workloads_job:
      name: da-proxy
      vars:
        eigenda_network: "{{ workloads_eigenda_network }}"
        eigenda_eth_rpc: "{{ workloads_l1_rpc }}"
        eigenda_signer_key: "{{ workloads_batcher_key }}"
        eigenda_cert_verifier: "{{ workloads_eigenda_cert_verifier }}"
  when: workloads_eigenda_network | length > 0

- name: Wait for the DA proxy's API
  ansible.builtin.include_tasks: da_proxy.yml
  when:
    - workloads_da_proxy_probe | bool
    - not ansible_check_mode

# The indexer archives the posted batches and the epoch inputs; it
# walks the followers' L1 and reads the payloads from the DA proxy (the
# job's default, by its service record). It comes up before the
# batcher, which reads a lost cursor's batch from it. It follows
# finality: a real L1, or the in-cluster anvil behind the fault proxy,
# which finalizes two blocks behind its head.
- name: Deploy the inbox indexer
  ansible.builtin.include_tasks: job.yml
  vars:
    workloads_job:
      name: l1-indexer
      vars:
        l1_rpc: "{{ workloads_followers_rpc }}"
        l1_light_client_rpc: "{{ workloads_followers_light_client }}"
        settlement_address: "{{ workloads_resolved_settlement }}"
        lockbox_address: >-
          {{ workloads_lockbox_address if workloads_lockbox_address | length > 0 else workloads_zero_address }}
        start_block: "{{ workloads_indexer_start_block }}"
        poll_interval_secs: "{{ workloads_indexer_poll_s }}"
  when: workloads_indexer_deployed | bool

- name: Deploy the live batcher
  ansible.builtin.include_tasks: job.yml
  vars:
    workloads_job:
      name: batcher
      # The real L1 and the batcher's own key when one is given; the
      # job's defaults (the in-cluster anvil, the dev key) otherwise; the
      # fault proxy when it is deployed. The indexer, when it runs, so a
      # fresh batcher node reads its last batch from it.
      vars: >-
        {{ {'settlement_address': workloads_resolved_settlement}
           | combine({'l1_rpc': workloads_l1_rpc} if workloads_l1_rpc_given | length > 0 else {})
           | combine({'l1_rpc': workloads_fault_proxy_url} if workloads_l1_fault_proxy | bool else {})
           | combine({'batcher_key': workloads_batcher_key} if workloads_batcher_key | length > 0 else {})
           | combine({'blocks_per_batch': workloads_batcher_blocks_per_batch} if workloads_batcher_blocks_per_batch | length > 0 else {})
           | combine({'flush_ms': workloads_batcher_flush_ms} if workloads_batcher_flush_ms | length > 0 else {})
           | combine({'idle_flush_ms': workloads_batcher_idle_flush_ms} if workloads_batcher_idle_flush_ms | length > 0 else {})
           | combine({'settlement_deploy_block': workloads_settlement_deploy_block} if workloads_settlement_deploy_block | length > 0 else {})
           | combine({'indexer_url': 'http://' ~ workloads_indexer_host ~ ':' ~ workloads_indexer_port}
                     if workloads_indexer_deployed | bool else {}) }}

- name: Record the deployed manifest
  ansible.builtin.import_tasks: record.yml
  when: not ansible_check_mode
