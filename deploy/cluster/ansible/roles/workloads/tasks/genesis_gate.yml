---
# 5c. The carry from genesis. A sealer member takes genesisFeatures only
# when it starts at genesis: an empty log, no snapshot and no seed. A live
# chain turns the carry window on through upgrade transactions
# (docs/runbooks/carry-window-rollout.md). So the gate accepts a sealer job
# with genesis features only:
# - on a genesis bootstrap: KARDAMOM_CLUSTER_BOOTSTRAP=1 on a sealer job
#   that Nomad does not know, while Nomad knows no job of
#   workloads_genesis_pipeline_jobs either;
# - on a registered sealer job whose every member already carries the
#   same genesis features.
# The genesis features stay for the life of the chain: a member with no
# snapshot replays the log from genesis, and with other genesis features
# it forks. So no allowance removes them.
# The results:
# - workloads_gate_genesis: the rules that the rendered sealer job gives
#   each member at genesis: features, decisionVersion, carryWindow and
#   feed. workloads_gate_genesis_groups: the members of the rendered job.
# - workloads_gate_genesis_bootstrap: the deploy starts a new chain with
#   genesis features. No member runs yet, so the carry gates read the
#   rules of the members from the rendered job (sealer_rules.yml), and
#   sealer.yml reads their status after they start.
- name: Keep the genesis rules of the rendered sealer job
  ansible.builtin.set_fact:
    workloads_gate_genesis:
      features: "{{ workloads_gate_genesis_features }}"
      decisionVersion: "{{ {'': 3, '3': 4}.get(workloads_gate_genesis_features, 5) }}"
      carryWindow: "{{ workloads_gate_genesis_features == '3,4,5' }}"
      feed: "{{ 'on' if '-Dkardamom.cluster.feedAeronDir=' in workloads_gate_sealer_options else 'off' }}"
    workloads_gate_genesis_groups: "{{ workloads_job_definition.TaskGroups | map(attribute='Name') | list }}"
  vars:
    workloads_gate_sealer_options: "{{ workloads_job_definition.TaskGroups[0].Tasks[0].Env.JAVA_TOOL_OPTIONS }}"
    workloads_gate_genesis_features: >-
      {{ workloads_gate_sealer_options | regex_search('-Dkardamom[.]cluster[.]genesisFeatures=\S*') | default('', true)
         | regex_replace('^.*=', '') }}

- name: Keep whether the deploy starts a new chain with the genesis features
  ansible.builtin.set_fact:
    workloads_gate_genesis_bootstrap: >-
      {{ workloads_gate_genesis.features | length > 0 and workloads_cluster_bootstrap | bool
         and workloads_plan.json.Diff.Type == 'Added' }}

- name: Read the pipeline jobs of a genesis bootstrap
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/job/{{ item }}?namespace={{ workloads_namespace | urlencode }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
    status_code: [200, 404]
  loop: "{{ workloads_genesis_pipeline_jobs }}"
  register: workloads_gate_genesis_jobs
  check_mode: false
  when: workloads_gate_genesis_bootstrap | bool

- name: Refuse the genesis features on a chain that did not start with them
  ansible.builtin.assert:
    that: >-
      workloads_gate_genesis.features | length == 0
      or workloads_gate_genesis_registered | length == workloads_gate_genesis_groups | length
      or (workloads_gate_genesis_bootstrap | bool and workloads_gate_genesis_known | length == 0)
    fail_msg: >-
      Refused: KARDAMOM_GENESIS_CARRY=on starts a chain with the features {{ workloads_gate_genesis.features }} active
      at genesis, and the deploy starts no new chain. It needs a genesis bootstrap: KARDAMOM_CLUSTER_BOOTSTRAP=1 on a
      sealer job that Nomad does not know, and no job of {{ workloads_genesis_pipeline_jobs | join(', ') }}. Or it
      needs a registered sealer job whose every member carries genesisFeatures={{ workloads_gate_genesis.features }}.
      The sealer job is {{ 'registered' if workloads_gate_cluster_job.status == 200 else 'not registered' }}, with
      genesisFeatures on {{ workloads_gate_genesis_registered | length }} members; the bootstrap is
      {{ 'open' if workloads_cluster_bootstrap | bool else 'not set' }}; Nomad knows {{ workloads_gate_genesis_known }}.
      A live chain turns on the carry window by upgrade transactions: docs/runbooks/carry-window-rollout.md.
  vars:
    workloads_gate_genesis_registered: >-
      {{ [] if workloads_gate_cluster_job.status != 200 else
         workloads_gate_cluster_job.json.TaskGroups | map(attribute='Tasks') | map('first')
         | map(attribute='Env.JAVA_TOOL_OPTIONS')
         | select('search', '-Dkardamom[.]cluster[.]genesisFeatures=' ~ workloads_gate_genesis.features ~ '(\s|$)')
         | list }}
    workloads_gate_genesis_known: >-
      {{ workloads_gate_genesis_jobs.results | default([]) | selectattr('status', 'defined')
         | selectattr('status', 'equalto', 200) | map(attribute='item') | list }}

# A seeded member starts from the seed, not at genesis, so it never takes
# the genesis features. The retained file (carryBytes) has no section for
# the carry window.
- name: Refuse the genesis features with a seed or the retained file
  ansible.builtin.assert:
    that: workloads_gate_genesis_conflicts | length == 0
    fail_msg: >-
      Refused: KARDAMOM_GENESIS_CARRY=on, and the target or the registered sealer job names
      {{ workloads_gate_genesis_conflicts | join(', ') }}. A seeded member does not start at genesis, so it does not
      take the genesis features, and the retained file has no section for the carry window. Clear the setting.
  vars:
    workloads_gate_genesis_conflicts: >-
      {{ ([workloads_job_definition.TaskGroups[0].Tasks[0].Env.JAVA_TOOL_OPTIONS]
          + ([] if workloads_gate_cluster_job.status != 200 else
             workloads_gate_cluster_job.json.TaskGroups | map(attribute='Tasks') | map('first')
             | map(attribute='Env.JAVA_TOOL_OPTIONS') | list))
         | map('regex_findall', '-Dkardamom[.]cluster[.](?:seedSnapshot=\S+|carryBytes=true)') | flatten | unique }}
  when: workloads_gate_genesis.features | length > 0

- name: Refuse a change of the genesis features of a live chain
  ansible.builtin.assert:
    that: "'genesisFeatures' not in workloads_gate_sealer_changed"
    fail_msg: >-
      Refused: the target changes genesisFeatures of the registered sealer job. Every member keeps the genesis
      features for the life of the chain: a member with no snapshot replays the log from genesis, and with other
      genesis features it forks. KARDAMOM_ALLOW_MUST_MATCH does not cover this setting. Deploy with
      KARDAMOM_GENESIS_CARRY as the chain started.
