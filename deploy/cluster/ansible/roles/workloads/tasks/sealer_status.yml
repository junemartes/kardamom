---
# Read the admin status of every running sealer member. A member reports
# its status on its admin endpoint. The controller reaches it by the node
# address that the Nomad API advertises. workloads_sealer_groups names the
# configured members.
# The results:
# - workloads_sealer_running: the running allocations of the sealer.
# - workloads_sealer_down: the configured members without a running
#   allocation.
# - workloads_sealer_status: the status of each running member. The
#   allocation of a result is item.item.
# The tasks read only, so they also run in check mode.
- name: Read the running sealer allocations
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/job/cluster/allocations?namespace={{ workloads_namespace | urlencode }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
  register: workloads_sealer_allocations
  check_mode: false

- name: Keep the running members
  ansible.builtin.set_fact:
    workloads_sealer_running: "{{ workloads_sealer_running_allocs }}"
    workloads_sealer_down: >-
      {{ workloads_sealer_groups | difference(workloads_sealer_running_allocs | map(attribute='TaskGroup')) }}
  vars:
    workloads_sealer_running_allocs: >-
      {{ workloads_sealer_allocations.json
         | selectattr('ClientStatus', 'equalto', 'running')
         | selectattr('DesiredStatus', 'equalto', 'run') | list }}

- name: Read the node of every member
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/node/{{ item.NodeID }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
  loop: "{{ workloads_sealer_running }}"
  loop_control:
    label: "{{ item.TaskGroup }}"
  register: workloads_sealer_nodes
  check_mode: false

- name: Read the status of every member
  ansible.builtin.uri:
    url: "http://{{ item.json.HTTPAddr | regex_replace(':[0-9]+$', '') }}:{{ workloads_sealer_admin_port }}/status"
    return_content: true
  loop: "{{ workloads_sealer_nodes.results }}"
  loop_control:
    label: "{{ item.item.TaskGroup }}"
  register: workloads_sealer_status
  # A new member answers some seconds after it runs. A caller that waits
  # for it sets workloads_sealer_status_retries; every other read fails at
  # once.
  until: workloads_sealer_status.status | default(0) == 200
  retries: "{{ workloads_sealer_status_retries | default(0) }}"
  delay: "{{ workloads_poll_delay }}"
  check_mode: false
