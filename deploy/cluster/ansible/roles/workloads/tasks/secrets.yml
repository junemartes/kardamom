---
# The secrets of a job: keyed L1 endpoints and private keys. They live in
# the job's Nomad Variable, nomad/jobs/<job>. The tasks of the job read
# that path through their workload identity, with no ACL policy, and a
# template renders the items into the task environment. The job
# definition never holds a secret, so a job read does not show one.
# Every task here runs with no_log, so the play output does not show one.
- name: Read the secrets of {{ workloads_job.name }}
  ansible.builtin.uri:
    url: "{{ workloads_secrets_url }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
    status_code: [200, 404]
  register: workloads_secrets_current
  no_log: true

# An empty item is left out: the task then gets no variable, the same as
# an unset one. The write happens only on a change, so a repeated deploy
# does not re-render the template.
- name: Write the secrets of {{ workloads_job.name }}
  ansible.builtin.uri:
    url: "{{ workloads_secrets_url }}"
    method: PUT
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
    body_format: json
    body:
      Namespace: "{{ workloads_namespace }}"
      Path: "nomad/jobs/{{ workloads_job.name }}"
      Items: "{{ workloads_secrets_items }}"
  when: >-
    workloads_secrets_current.status == 404
    or workloads_secrets_current.json.Items != workloads_secrets_items
  changed_when: true
  no_log: true
