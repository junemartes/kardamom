---
# Compile, plan, register and wait for one job. The release gate compiles
# a job through compile.yml alone.
- name: Compile {{ workloads_job.name }}
  ansible.builtin.include_tasks: compile.yml

# The job's secrets go to its Nomad Variable before the job registers,
# so a new task finds them.
- name: Write the secrets of {{ workloads_job.name }}
  ansible.builtin.include_tasks: secrets.yml
  vars:
    workloads_secrets_url: >-
      {{ workloads_nomad_addr }}/v1/var/nomad/jobs/{{ workloads_job.name }}?namespace={{ workloads_namespace | urlencode }}
    workloads_secrets_items: >-
      {{ workloads_job.secrets | dict2items | rejectattr('value', 'equalto', '') | items2dict }}
  when:
    - workloads_job.secrets | default({}) | length > 0
    - not ansible_check_mode

# A job with submit: false stops here, planned but not registered: the
# sealer roll reads the plan and registers the groups one at a time.
- name: Plan and register {{ workloads_job.name }}
  ansible.builtin.include_tasks: register.yml
  vars:
    workloads_register_job: "{{ workloads_job.name }}"
    workloads_register_submit: "{{ workloads_job.submit | default(true) }}"

- name: Wait for startup dependency {{ workloads_job.name }}
  ansible.builtin.include_tasks: wait.yml
  vars:
    workloads_wait_job: "{{ workloads_job.name }}"
  when:
    - workloads_job.submit | default(true)
    - workloads_job.wait | default(true)
    - not ansible_check_mode
