---
# The attempt record, before the first registration. It holds the target
# (the manifest, a reference to the formats, the revision), the version of every job
# Nomad knows (the release that runs), and the rollback floor of the
# gate. Each registration adds the job to `changed`; the acceptance
# copies the attempt to `accepted`; a rollback fills `rolled_back`.
# README.md documents the schema.
# The job list gives only stubs, without the version. Each job's own
# record has it.
- name: List the jobs of the namespace
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/jobs?namespace={{ workloads_namespace | urlencode }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
  register: workloads_record_jobs

- name: Read the version of every job
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/job/{{ item.ID }}?namespace={{ workloads_namespace | urlencode }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
  loop: "{{ workloads_record_jobs.json }}"
  loop_control:
    label: "{{ item.ID }}"
  register: workloads_record_versions

- name: Keep the formats of the target
  ansible.builtin.set_fact:
    workloads_target_formats: "{{ lookup('file', workloads_formats_file, rstrip=false) }}"

- name: Keep the reference to the formats of the target
  ansible.builtin.set_fact:
    workloads_target_formats_ref: "sha256:{{ workloads_target_formats | hash('sha256') }}"

# The variable of a text is named by the hash of the text, so it holds the
# same text at each write. The record refers to the text by its hash.
- name: Store the formats of the target
  ansible.builtin.uri:
    url: >-
      {{ workloads_nomad_addr }}/v1/var/{{ workloads_formats_path }}/{{ workloads_target_formats_hash
      }}?namespace={{ workloads_namespace | urlencode }}
    method: PUT
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
    body_format: json
    body:
      Namespace: "{{ workloads_namespace }}"
      Path: "{{ workloads_formats_path }}/{{ workloads_target_formats_hash }}"
      Items:
        formats: "{{ workloads_target_formats }}"
  changed_when: true
  vars:
    workloads_target_formats_hash: "{{ workloads_target_formats_ref | regex_replace('^sha256:', '') }}"

- name: Compose the attempt record
  ansible.builtin.set_fact:
    workloads_attempt:
      env: "{{ workloads_env }}"
      status: started
      started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
      operator: "{{ workloads_operator }}"
      target:
        revision: "{{ workloads_target_revision }}"
        manifest: "{{ workloads_image_refs }}"
        formats: "{{ workloads_target_formats_ref }}"
        decision_version: "{{ workloads_gate_decision_version | default('') }}"
      before:
        revision: "{{ workloads_accepted.target.revision | default('') }}"
        decision_version: >-
          {{ workloads_accepted.target.decision_version | default('') if workloads_accepted | length > 0
             else workloads_gate_decision_version | default('') }}
        manifest: "{{ workloads_accepted.target.manifest | default({}) }}"
        formats: "{{ workloads_accepted.target.formats | default('') }}"
        jobs: >-
          {{ workloads_record_versions.results | map(attribute='json.ID')
             | zip(workloads_record_versions.results | map(attribute='json.Version') | map('community.general.dict_kv', 'before'))
             | community.general.dict }}
      changed: []
      rolled_back: []
      floor: "{{ workloads_floor }}"
    # The registrations of this play record themselves; a rollback's do not.
    workloads_recording: true

- name: Write the attempt record
  ansible.builtin.import_tasks: record_write.yml
