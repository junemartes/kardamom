---
# The DA proxy answers its API only after it loads the SRS points, tens
# of seconds after its allocation runs. The batcher's first dispersal
# must not race that: this waits for /health on the node that runs it.
- name: Read the DA proxy allocations
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/job/da-proxy/allocations?namespace={{ workloads_namespace | urlencode }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
  register: workloads_da_proxy_allocations

- name: Read the node that runs the DA proxy
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/node/{{ workloads_da_proxy_node }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
  vars:
    workloads_da_proxy_node: >-
      {{ (workloads_da_proxy_allocations.json | selectattr('ClientStatus', 'equalto', 'running')
          | map(attribute='NodeID') | first) }}
  register: workloads_da_proxy_node_info

- name: Wait for the DA proxy to answer
  ansible.builtin.uri:
    url: "http://{{ workloads_da_proxy_node_info.json.HTTPAddr | regex_replace(':[0-9]+$', '') }}:{{ workloads_da_proxy_port }}/health"
  register: workloads_da_proxy_health
  until: workloads_da_proxy_health.status == 200
  retries: "{{ workloads_poll_retries }}"
  delay: "{{ workloads_poll_delay }}"
