---
# Plan workloads_job_definition as workloads_register_job and register it
# when the plan shows a change. Both the deploy of a job and one step of
# the sealer roll come through here.
- name: Plan {{ workloads_register_job }}
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/job/{{ workloads_register_job }}/plan?namespace={{ workloads_namespace | urlencode }}"
    method: POST
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
    body_format: json
    body:
      Job: "{{ workloads_job_definition }}"
      Diff: true
  register: workloads_plan
  check_mode: false

# The registration and its record. The job joins the attempt record
# before the registration, so a controller that dies after the
# registration leaves no job out of it. The body of the registration is
# one expression, so JobModifyIndex stays an integer. A quoted template
# ("{{ ... }}", with or without `| int`) reaches the module as a string on
# ansible-core 2.17, the pin of the deploy path, and Nomad answers 400
# ("cannot unmarshal string into ... JobModifyIndex of type uint64").
# ansible-core 2.19 keeps the type either way.
- name: Register changed job {{ workloads_register_job }}
  when:
    - not ansible_check_mode
    - workloads_register_submit | bool
    - workloads_plan.json.Diff.Type != 'None'
  block:
    - name: Record the planned registration of {{ workloads_register_job }}
      ansible.builtin.include_tasks: record_change.yml
      when: workloads_recording | default(false)

    - name: Register changed job {{ workloads_register_job }}
      ansible.builtin.uri:
        url: "{{ workloads_nomad_addr }}/v1/jobs?namespace={{ workloads_namespace | urlencode }}"
        method: POST
        headers:
          X-Nomad-Token: "{{ workloads_nomad_token }}"
        body_format: json
        body: >-
          {{ {'Job': workloads_job_definition,
              'EnforceIndex': true,
              'JobModifyIndex': workloads_plan.json.JobModifyIndex} }}
      changed_when: true

    - name: Record the registration of {{ workloads_register_job }}
      when: workloads_recording | default(false)
      block:
        - name: Read the registered version of {{ workloads_register_job }}
          ansible.builtin.include_tasks: read_job.yml
          vars:
            workloads_read_job: "{{ workloads_register_job }}"

        - name: Record the registered version of {{ workloads_register_job }}
          ansible.builtin.include_tasks: record_change.yml
          vars:
            workloads_record_after: "{{ workloads_registered_job.json.Version }}"

- name: Report planned change for {{ workloads_register_job }}
  ansible.builtin.debug:
    msg: "{{ workloads_plan.json.Diff.Type }}"
  changed_when: workloads_plan.json.Diff.Type != 'None'
  when: ansible_check_mode

- name: Remember desired groups for readiness checks
  ansible.builtin.set_fact:
    workloads_jobs: "{{ workloads_jobs | combine({workloads_register_job: workloads_job_definition}) }}"
