---
# Read the registered job workloads_read_job. The result is
# workloads_registered_job: status 200 with the job, or 404 when Nomad does
# not know the job.
- name: Read the registered {{ workloads_read_job }}
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/job/{{ workloads_read_job }}?namespace={{ workloads_namespace | urlencode }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
    status_code: [200, 404]
  register: workloads_registered_job
  check_mode: false
