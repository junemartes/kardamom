---
# The check before each upgrade transaction of FEATURE_SEALER_V3: the
# decision rules version 3 of the sealer, on or off. A sealer member of an
# older release drops the feature activation (ingress kind 11) and keeps
# version 2, so the replicated state forks at the first frame that the two
# versions decide differently: a frame that ends at its record type. A
# member of a release that switches only on keeps version 3 after an
# activation that switches the rules off, so the state forks the same way.
# So every configured member must run a release that reads snapshot
# version 14: the layout that carries the rules of this release, which
# switch at a block boundary, on and off. Every sequencer must run a release
# that sends the activation, or no member gets it, and that watches the
# rules switch on and off (job meta sealer_feature_off). Every executor,
# validator, ingress and sequencer must run a release that uses the nonce
# of a skipped transaction (job meta nonce_burn). Every executor and
# validator must run a release that installs the KardamomChainState code
# with the first setFeature system deposit, and reads the flags once per
# block, frozen at its start (job meta chain_state_install).
# cluster/sealer-service/README.md ("Decision version") is the procedure.
- name: Read the registered sealer
  ansible.builtin.include_tasks: read_job.yml
  vars:
    workloads_read_job: cluster

- name: Refuse a check without a registered sealer
  ansible.builtin.assert:
    that: workloads_registered_job.status == 200
    fail_msg: "Refused: Nomad does not know the sealer job. Deploy the release, then run the check."

- name: Keep the configured sealer members
  ansible.builtin.set_fact:
    workloads_upgrade_groups: "{{ workloads_registered_job.json.TaskGroups | map(attribute='Name') | list }}"

- name: Read the sealer allocations
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/job/cluster/allocations?namespace={{ workloads_namespace | urlencode }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
  register: workloads_upgrade_allocs

# A member that is down runs its release again at its next start, so the
# check must read every configured member.
- name: Keep the running node of each member
  ansible.builtin.set_fact:
    workloads_upgrade_nodes: >-
      {{ workloads_upgrade_allocs.json | selectattr('ClientStatus', 'equalto', 'running')
         | selectattr('TaskGroup', 'in', workloads_upgrade_groups) | map(attribute='NodeID') | unique | list }}
    workloads_upgrade_down: >-
      {{ workloads_upgrade_groups | difference(workloads_upgrade_allocs.json
         | selectattr('ClientStatus', 'equalto', 'running') | map(attribute='TaskGroup') | list) }}

- name: Refuse a check while a configured member is down
  ansible.builtin.assert:
    that: workloads_upgrade_down | length == 0
    fail_msg: >-
      Refused: the sealer members {{ workloads_upgrade_down | join(', ') }} do not run. The check must read every
      configured member. Start it and let it catch up, then run the check again.

- name: Read the node of each member
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/node/{{ item }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
  loop: "{{ workloads_upgrade_nodes }}"
  register: workloads_upgrade_node

- name: Read the status of each member
  ansible.builtin.uri:
    url: "http://{{ item.json.HTTPAddr | regex_replace(':[0-9]+$', '') }}:{{ workloads_sealer_admin_port }}/status"
    return_content: true
  loop: "{{ workloads_upgrade_node.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: workloads_upgrade_status

# The release that takes the activation reads snapshot version 14. An older
# member reports a lower snapshotReadsMax: 12 or less for a release with no
# activation, and 13 for a release whose rules switch only on.
- name: Keep the snapshot read maximum of each member
  ansible.builtin.set_fact:
    workloads_upgrade_reads_max: >-
      {{ workloads_upgrade_status.results | map(attribute='json')
         | map(attribute='snapshotReadsMax', default=0) | list }}

- name: Refuse a member of an older release
  ansible.builtin.assert:
    that: workloads_upgrade_reads_max | min >= 14
    fail_msg: >-
      Refused: a sealer member reads only up to snapshot version {{ workloads_upgrade_reads_max | min }}
      ({{ workloads_upgrade_reads_max }}). A member of an older release drops the feature activation, or switches
      its rules only on, and forks the state. Deploy the release that reads version 14 to every member, then run
      the check again.

# Each service that executes or reads a skip must run this release: an
# older executor or validator does not use the nonce of a skipped
# transaction, and forks the state at the first such skip. On a genesis
# without the chain state code, an older executor or validator runs the
# upgrade deposit as a call to an empty account, and forks at once. The job meta of
# each names what its release does. A live allocation of an older job
# version can run an older release.
- name: Check the services of the release
  ansible.builtin.include_tasks: upgrade_check_job.yml
  loop: "{{ workloads_upgrade_jobs }}"
  loop_control:
    loop_var: workloads_upgrade_job
    label: "{{ workloads_upgrade_job.name }}"

- name: Report the passing check
  ansible.builtin.debug:
    msg: >-
      The upgrade check passed: {{ workloads_upgrade_groups | length }} sealer members read snapshot version 14,
      and the live allocations of {{ workloads_upgrade_jobs | map(attribute='name') | join(', ') }}
      run this release. An upgrade transaction of FEATURE_SEALER_V3, on or off, may go to the Safe.
