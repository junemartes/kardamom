---
# The record of this deploy. The attempt becomes the accepted release.
# The manifest it deployed becomes the environment's current one, and the
# one it replaced becomes the previous one, with their signature bundles:
# the re-render path of `just rollback-rerender <env>` deploys a manifest
# through the normal path when Nomad dropped the versions to revert to.
- name: Accept the release
  ansible.builtin.set_fact:
    workloads_attempt: >-
      {{ workloads_attempt | combine({'status': 'accepted', 'accepted_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')}) }}

- name: Keep the accepted release
  ansible.builtin.set_fact:
    workloads_accepted: "{{ workloads_attempt }}"

- name: Write the accepted record
  ansible.builtin.import_tasks: record_write.yml

- name: Read the recorded manifest
  ansible.builtin.stat:
    path: "{{ workloads_record_dir }}/images.digests"
  register: workloads_recorded

- name: Keep the replaced manifest as the previous one
  ansible.builtin.copy:
    src: "{{ workloads_record_dir }}/images.digests{{ item }}"
    dest: "{{ workloads_record_dir }}/images.digests.previous{{ item }}"
    remote_src: true
    mode: "0644"
  loop: ["", ".sigbundle"]
  when:
    - workloads_recorded.stat.exists
    - lookup('file', workloads_record_dir ~ '/images.digests') != lookup('file', workloads_manifest)
    - (workloads_record_dir ~ '/images.digests' ~ item) is file

- name: Record the deployed manifest
  ansible.builtin.copy:
    src: "{{ workloads_manifest }}{{ item }}"
    dest: "{{ workloads_record_dir }}/images.digests{{ item }}"
    remote_src: true
    mode: "0644"
  loop: ["", ".sigbundle"]
  when: (workloads_manifest ~ item) is file

- name: Drop a stale signature of the deployed manifest
  ansible.builtin.file:
    path: "{{ workloads_record_dir }}/images.digests.sigbundle"
    state: absent
  when: not (workloads_manifest ~ '.sigbundle') is file
