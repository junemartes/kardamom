---
# The sealer roll. One group per Raft member lets the role order the
# members: the followers first, the leader last. Each step registers the
# new definition of one group and keeps the current definition of the
# others, so Nomad replaces one member and the group's update stanza
# holds the next step until that member rejoined and caught up. A fresh
# job, or a job that still has the one shared group, registers in one
# step: there is no member to order.
- name: Plan the sealer
  ansible.builtin.include_tasks: job.yml
  vars:
    workloads_job: "{{ workloads_sealer_job | combine({'submit': false}) }}"

- name: Keep the planned sealer definition
  ansible.builtin.set_fact:
    workloads_sealer_new: "{{ workloads_job_definition }}"
    workloads_sealer_diff: "{{ workloads_plan.json.Diff.Type }}"

# The bootstrap opens only for a job that Nomad does not know: the blank
# members of a registered cluster seed from their peers. Nomad does not
# know a purged job either, so a purged cluster is re-registered without
# the flag.
- name: Decide the cluster bootstrap
  ansible.builtin.set_fact:
    workloads_sealer_bootstrap: >-
      {{ workloads_cluster_bootstrap | bool
         and workloads_sealer_diff == 'Added'
         and not ansible_check_mode }}

- name: Read the registered sealer
  ansible.builtin.include_tasks: read_job.yml
  vars:
    workloads_read_job: cluster
  when: workloads_sealer_diff == 'Edited'

- name: Keep the registered sealer
  ansible.builtin.set_fact:
    workloads_sealer_current: "{{ workloads_registered_job }}"
  when: workloads_sealer_diff == 'Edited'

- name: Decide the sealer roll
  ansible.builtin.set_fact:
    workloads_sealer_staged: >-
      {{ workloads_sealer_diff == 'Edited'
         and (workloads_sealer_current.json.TaskGroups | map(attribute='Name')
              | select('match', '^cluster-') | list | length > 0) }}

# The bootstrap variable lives only while the new cluster comes up: the
# job renders it into each member's bootstrap file (cluster.nomad.hcl).
# The role deletes it after the deployment, also when the deployment
# fails, so no later start of a blank member reads it.
- name: Register the sealer in one step
  when:
    - workloads_sealer_diff != 'None'
    - not workloads_sealer_staged | bool
  block:
    - name: Open the cluster bootstrap
      ansible.builtin.uri:
        url: "{{ workloads_nomad_addr }}/v1/var/nomad/jobs/cluster?namespace={{ workloads_namespace | urlencode }}"
        method: PUT
        headers:
          X-Nomad-Token: "{{ workloads_nomad_token }}"
        body_format: json
        body:
          Namespace: "{{ workloads_namespace }}"
          Path: nomad/jobs/cluster
          Items:
            bootstrap: "true"
      when: workloads_sealer_bootstrap | bool

    - name: Register the sealer
      ansible.builtin.include_tasks: job.yml
      vars:
        workloads_job: "{{ workloads_sealer_job }}"
  always:
    - name: Close the cluster bootstrap
      ansible.builtin.uri:
        url: "{{ workloads_nomad_addr }}/v1/var/nomad/jobs/cluster?namespace={{ workloads_namespace | urlencode }}"
        method: DELETE
        headers:
          X-Nomad-Token: "{{ workloads_nomad_token }}"
        status_code: [200, 204]
      when: workloads_sealer_bootstrap | bool

# The release gate read the rules of the members of a genesis bootstrap
# from the rendered sealer job (genesis_gate.yml). A sealer image that
# does not take genesisFeatures starts the new chain on decision version
# 3. So after the new members start, and before any other job registers,
# each member must report the genesis rules of the rendered job.
- name: Check the members of a genesis bootstrap
  when:
    - workloads_sealer_bootstrap | bool
    - workloads_gate_genesis_bootstrap | bool
  block:
    - name: Read the status of every new sealer member
      ansible.builtin.include_tasks: sealer_status.yml
      vars:
        workloads_sealer_groups: "{{ workloads_gate_genesis_groups }}"

    - name: Refuse a new sealer member without the genesis rules
      ansible.builtin.assert:
        that:
          - workloads_sealer_down | length == 0
          - workloads_genesis_members | length == workloads_gate_genesis_groups | length
        fail_msg: >-
          Refused: the new sealer members do not all report the genesis rules of the rendered sealer job:
          decisionVersion {{ workloads_gate_genesis.decisionVersion }}, carryWindow {{ workloads_gate_genesis.carryWindow }}
          and genesisFeatures "{{ workloads_gate_genesis.features }}". The members
          {{ workloads_sealer_status.results | map(attribute='item.item.TaskGroup') | list }} report decisionVersion
          {{ workloads_sealer_status.results | map(attribute='json') | map(attribute='decisionVersion', default='missing') | list }}, carryWindow
          {{ workloads_sealer_status.results | map(attribute='json') | map(attribute='carryWindow', default='missing') | list }} and
          genesisFeatures {{ workloads_sealer_status.results | map(attribute='json') | map(attribute='genesisFeatures', default='missing') | list }},
          and {{ workloads_sealer_down }} do not run. The sealer image does not take kardamom.cluster.genesisFeatures, or
          a member did not start at genesis. The deploy stops before any other job. Purge the new cluster, wipe its
          member state, and deploy a release whose sealer takes the setting.
      vars:
        workloads_genesis_members: >-
          {{ workloads_sealer_status.results | map(attribute='json')
             | selectattr('decisionVersion', 'defined')
             | selectattr('decisionVersion', 'equalto', workloads_gate_genesis.decisionVersion | int)
             | selectattr('carryWindow', 'defined') | selectattr('carryWindow', 'equalto', workloads_gate_genesis.carryWindow | bool)
             | selectattr('genesisFeatures', 'defined') | selectattr('genesisFeatures', 'equalto', workloads_gate_genesis.features)
             | list }}

- name: Order the members for the staged roll
  ansible.builtin.include_tasks: sealer_order.yml
  when:
    - workloads_sealer_staged | bool
    - not ansible_check_mode

- name: Roll the sealer one member at a time
  ansible.builtin.include_tasks: roll_step.yml
  loop: "{{ workloads_sealer_order | default([]) }}"
  loop_control:
    loop_var: workloads_roll_group
    index_var: workloads_roll_index
  vars:
    workloads_roll_job: cluster
    workloads_roll_new: "{{ workloads_sealer_new }}"
    workloads_roll_current: "{{ workloads_sealer_current }}"
    workloads_roll_order: "{{ workloads_sealer_order }}"
    workloads_roll_spec: "{{ workloads_sealer_job }}"
  when:
    - workloads_sealer_staged | bool
    - not ansible_check_mode
