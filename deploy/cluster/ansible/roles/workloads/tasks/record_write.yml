---
# Write the deploy record: the attempt and the accepted release to the
# Nomad variable, and the mirror under deployed/<env>/. The variable is
# the record that every operator and the rollout tooling read; the mirror
# is for an operator without the Nomad token. The write is a check-and-set
# on the modify index of the last read or write, so two controllers cannot
# write over each other: the second one stops here.
- name: Write the deploy record of {{ workloads_env }}
  ansible.builtin.uri:
    url: "{{ workloads_record_url }}&cas={{ workloads_record_index }}"
    method: PUT
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
    body_format: json
    body:
      Namespace: "{{ workloads_namespace }}"
      Path: "{{ workloads_record_path }}"
      Items: >-
        {{ {'attempt': workloads_attempt | to_json}
           | combine({'accepted': workloads_accepted | to_json} if workloads_accepted | length > 0 else {}) }}
    status_code: [200, 409]
  register: workloads_record_written
  changed_when: true

- name: Refuse to write over a record that another controller changed
  ansible.builtin.assert:
    that: workloads_record_written.status == 200
    fail_msg: >-
      The deploy record {{ workloads_record_path }} changed under this run (modify index
      {{ workloads_record_index }} is stale). Another deploy or rollback of {{ workloads_env }} runs.
      Let it finish, then read the record again.

- name: Keep the modify index of the record
  ansible.builtin.set_fact:
    workloads_record_index: "{{ workloads_record_written.json.ModifyIndex }}"

- name: Mirror the deploy record
  ansible.builtin.import_tasks: record_mirror.yml
