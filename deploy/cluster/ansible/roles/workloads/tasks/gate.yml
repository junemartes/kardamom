---
# The release gate: the checks that refuse a release before any job
# changes. Each refusal is distinct and names its cause:
# 1. The last attempt is not still running.
# 2. The chain stands on no halt and no pause. A purged sealer excuses
#    its own sealer_no_quorum halt.
# 3. The registry holds every image of the manifest.
# 4. The formats of the target are safe against the accepted release.
# 5. No sealer setting that every member must match changes in the
#    rolling path.
# 5a. The registered sealer job does not name decisionVersion=3.
# 6. The shard map does not change in the rolling path.
# 7. When the sealer job changes, the target reads the newest snapshot
#    of every sealer member.
# 7a. The sealer retention only rises on a live chain, and stays within
#     the cap in bytes.
# 8. The gates of the carry window (carry_gate.yml).
# The gate also reads the revision of the target tree, for the record.
# The gate reads only, so it also runs in check mode.

# The revision of the target tree, for the record and the floor.
- name: Read the revision of the target tree from git
  ansible.builtin.command:
    argv: [git, -C, "{{ workloads_repo_root }}", rev-parse, HEAD]
  register: workloads_gate_git
  failed_when: false
  changed_when: false
  check_mode: false

- name: Read the revision of the target tree from jj
  ansible.builtin.command:
    argv: [jj, -R, "{{ workloads_repo_root }}", log, -r, "@", --no-graph, -T, commit_id]
  register: workloads_gate_jj
  failed_when: false
  changed_when: false
  check_mode: false
  when:
    - workloads_revision | length == 0
    - workloads_gate_git.rc != 0
    - lookup('env', 'GITHUB_SHA') | length == 0

- name: Keep the target revision
  ansible.builtin.set_fact:
    workloads_target_revision: >-
      {{ workloads_revision if workloads_revision | length > 0
         else workloads_gate_git.stdout if workloads_gate_git.rc == 0
         else lookup('env', 'GITHUB_SHA') if lookup('env', 'GITHUB_SHA') | length > 0
         else workloads_gate_jj.stdout if workloads_gate_jj.rc | default(1) == 0
         else 'unknown' }}

# The record names the release that runs by its revision, so in a git
# checkout the revision must be a commit of the checkout that the deploy
# runs from. GITHUB_SHA of a workflow in another repository is not one.
- name: Check that the target revision is a commit of the checkout
  ansible.builtin.command:
    argv: [git, -C, "{{ workloads_repo_root }}", cat-file, -e, "{{ workloads_target_revision }}^{commit}"]
  register: workloads_gate_revision_commit
  failed_when: false
  changed_when: false
  check_mode: false
  when: workloads_gate_git.rc == 0

- name: Refuse a target revision that the checkout does not hold
  ansible.builtin.assert:
    that: workloads_gate_revision_commit.rc == 0
    fail_msg: >-
      Refused: the target revision {{ workloads_target_revision }} is not a commit of the checkout
      {{ workloads_repo_root }}, so the record would name a release that this tree is not.
      Set KARDAMOM_REVISION to the commit of this tree, or leave it empty.
  when: workloads_gate_git.rc == 0

# 1. The last attempt. One that is still `started` runs, or died. A deploy
# over a dead attempt records the mixed versions that run, so the operator
# names that choice.
- name: Read the deploy record
  ansible.builtin.import_tasks: record_read.yml

- name: Mirror the accepted release
  ansible.builtin.import_tasks: record_mirror.yml

- name: Refuse a release while the last attempt is still started
  ansible.builtin.assert:
    that: workloads_last_attempt.status | default('') != 'started' or workloads_replace_attempt | bool
    fail_msg: >-
      Refused: the attempt of {{ workloads_last_attempt.started_at | default('') }} by
      {{ workloads_last_attempt.operator | default('') }} is still started: it runs, or it died.
      Let it finish. If it died, roll it back (`just rollback {{ workloads_env }}`), or set
      KARDAMOM_REPLACE_ATTEMPT=1 to deploy over it; the record then holds the mixed versions that run.

# 2. The chain status, from a running ingress. A cluster without the
# ingress job has no chain to stand on a halt. An ingress job without a
# running allocation is what a failed release leaves, and no deploy goes
# over it unseen.
- name: Read the registered ingress
  ansible.builtin.include_tasks: read_job.yml
  vars:
    workloads_read_job: ingress

- name: Keep the registered ingress
  ansible.builtin.set_fact:
    workloads_gate_ingress_job: "{{ workloads_registered_job }}"

- name: Read the running ingress allocations
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/job/ingress/allocations?namespace={{ workloads_namespace | urlencode }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
  register: workloads_gate_ingress
  check_mode: false
  when: workloads_gate_ingress_job.status == 200

- name: Keep a node that runs the ingress
  ansible.builtin.set_fact:
    workloads_gate_ingress_node: >-
      {{ ((workloads_gate_ingress.json if workloads_gate_ingress_job.status == 200 else [])
          | selectattr('ClientStatus', 'equalto', 'running') | map(attribute='NodeID') | list + ['']) | first }}

- name: Refuse a release while no ingress runs
  ansible.builtin.assert:
    that: workloads_gate_ingress_node | length > 0
    fail_msg: >-
      Refused: the ingress job is registered and no allocation of it runs, so the chain status cannot be read.
      Bring the ingress back, or roll the last release back (`just rollback {{ workloads_env }}`).
  when: workloads_gate_ingress_job.status == 200

- name: Read the node of the ingress
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/node/{{ workloads_gate_ingress_node }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
  register: workloads_gate_node
  check_mode: false
  when: workloads_gate_ingress_node | length > 0

- name: Read the chain status
  ansible.builtin.uri:
    url: "http://{{ workloads_gate_node.json.HTTPAddr | regex_replace(':[0-9]+$', '') }}:{{ workloads_ingress_rpc_port }}"
    method: POST
    body_format: json
    body: {jsonrpc: "2.0", id: 1, method: kardamom_chainStatus, params: []}
    return_content: true
  register: workloads_gate_status
  check_mode: false
  when: workloads_gate_ingress_node | length > 0

# A sealer that Nomad does not know is stopped on purpose: the coordinated
# restart of the sealer purges the job, and this deploy brings it back.
# The ingress then halts on sealer_no_quorum, and the gate excuses that
# root and the upstream pauses on it. A registered sealer gets no excuse.
- name: Read the registered sealer for the chain status
  ansible.builtin.include_tasks: read_job.yml
  vars:
    workloads_read_job: cluster

- name: Keep the registered sealer
  ansible.builtin.set_fact:
    workloads_gate_cluster_job: "{{ workloads_registered_job }}"

- name: Keep the halt causes that a stopped sealer excuses
  ansible.builtin.set_fact:
    workloads_gate_excused: "{{ ['sealer_no_quorum'] if workloads_gate_cluster_job.status == 404 else [] }}"
    workloads_gate_pauses: >-
      {{ ([workloads_gate_status.json.result.sealer.pause, workloads_gate_status.json.result.ingress.pause]
          + (workloads_gate_status.json.result.services | map(attribute='pause') | list)) | reject('none') | list
         if workloads_gate_ingress_node | length > 0 else [] }}

# A deploy cannot tell a failed release from a halted environment, so it
# starts only on a chain that stands on nothing.
- name: Refuse a release while the chain stands on a halt or a pause
  ansible.builtin.assert:
    that:
      - workloads_gate_status.json.result.roots | rejectattr('cause', 'in', workloads_gate_excused) | list | length == 0
      - >-
        workloads_gate_pauses | length == workloads_gate_pauses | selectattr('reason', 'defined')
        | selectattr('reason', 'equalto', 'upstream') | selectattr('root', 'defined') | rejectattr('root', 'none')
        | selectattr('root.cause', 'in', workloads_gate_excused) | list | length
    fail_msg: >-
      Refused: the chain stands on a halt or a pause.
      Roots: {{ workloads_gate_status.json.result.roots | map(attribute='cause') | list }}.
      Paused: {{ (workloads_gate_status.json.result.services | rejectattr('pause', 'none') | map(attribute='service') | list)
                 + (['sealer'] if workloads_gate_status.json.result.sealer.pause is not none else [])
                 + (['ingress'] if workloads_gate_status.json.result.ingress.pause is not none else []) }}.
      Clear them first (docs/runbooks/). A deploy cannot tell a failed release from a halted environment.
  when: workloads_gate_ingress_node | length > 0

# 3. The images. A digest that the registry does not hold fails the first
# pull, after the first job changed. Only the local profile may skip the
# check: its registry has no credentials to need.
- name: Refuse to skip the image check outside the local profile
  ansible.builtin.assert:
    that: workloads_registry_url != 'off' or deployment_profile == 'local'
    fail_msg: >-
      Refused: KARDAMOM_REGISTRY_URL=off skips the image check, and the {{ deployment_profile }} profile
      does not allow that. Set KARDAMOM_REGISTRY_URL to the registry API.

- name: Check every image of the manifest in the registry
  ansible.builtin.uri:
    url: >-
      {{ workloads_registry_url }}/v2/{{ item.value | regex_replace('^[^/]+/', '') | regex_replace('[:@].*$', '') }}/manifests/{{
         item.value | regex_replace('^.*@', '') }}
    method: HEAD
    headers:
      Accept: "{{ workloads_gate_manifest_types }}"
    status_code: [200, 401, 404]
  loop: "{{ workloads_image_refs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: workloads_gate_images
  check_mode: false
  when: workloads_registry_url != 'off'

# A registry such as ghcr.io answers 401 without a token, also for a
# public image. The challenge names the token service and the scope; an
# anonymous token reads a public image.
- name: Get a pull token for each image that the registry refuses without one
  ansible.builtin.uri:
    url: >-
      {{ challenge | regex_findall('realm="([^"]+)"') | first }}?service={{
         challenge | regex_findall('service="([^"]+)"') | first | urlencode }}&scope={{
         challenge | regex_findall('scope="([^"]+)"') | first | urlencode }}
    return_content: true
  vars:
    challenge: "{{ item.www_authenticate | default('') }}"
  loop: "{{ workloads_gate_images.results | selectattr('status', 'defined') | selectattr('status', 'equalto', 401) | list }}"
  loop_control:
    label: "{{ item.item.key }}"
  register: workloads_gate_tokens
  check_mode: false
  no_log: true
  when: workloads_registry_url != 'off'

- name: Check with the pull token each image that the registry refused without one
  ansible.builtin.uri:
    url: "{{ item.item.url }}"
    method: HEAD
    headers:
      Accept: "{{ workloads_gate_manifest_types }}"
      Authorization: "Bearer {{ item.json.token | default(item.json.access_token) }}"
    status_code: [200, 404]
  loop: "{{ workloads_gate_tokens.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.key }}"
  register: workloads_gate_token_images
  check_mode: false
  no_log: true
  when: workloads_registry_url != 'off'

- name: Refuse a release whose image is not in the registry
  ansible.builtin.assert:
    that: missing | length == 0
    fail_msg: >-
      Refused: the registry {{ workloads_registry_url }} does not hold the image of {{ missing | join(', ') }}.
      Push the images (`just images`) or fix the manifest.
  vars:
    missing: >-
      {{ (workloads_gate_images.results | selectattr('status', 'equalto', 404) | map(attribute='item.key') | list)
         + (workloads_gate_token_images.results | selectattr('status', 'equalto', 404)
            | map(attribute='item.item.item.key') | list) }}
  when: workloads_registry_url != 'off'

# 4. The formats, against the accepted release (docs/formats.md). Without
# an accepted release there is no base to compare with.
- name: Keep whether the accepted release has formats to compare with
  ansible.builtin.set_fact:
    workloads_gate_has_base: "{{ workloads_accepted.target.formats | default('') | length > 0 }}"

# The deploy binary of the release holds the comparison: every release
# ships it, signed, so the gate needs no other binary.
- name: Compare the formats of the target with the accepted release
  ansible.builtin.command:
    argv:
      - "{{ workloads_deploy_binary }}"
      - formats
      - --base
      - "{{ workloads_record_dir }}/accepted.formats.toml"
      - --root
      - "{{ workloads_repo_root }}"
  register: workloads_gate_formats
  changed_when: false
  check_mode: false
  when: workloads_gate_has_base | bool

# A retired format is coordinated, unless KARDAMOM_ALLOW_RETIRED names it
# and the format is neither shared nor permanent. The operator names it
# only when the release removes the service that owned the format: a
# running service that renames a format stops updating the old file, and
# a rollback reads that stale file. A finding without the `shared` or the
# `permanent` field stays coordinated.
- name: Sort the format findings
  ansible.builtin.set_fact:
    workloads_one_way: "{{ workloads_gate_findings | selectattr('rule', 'equalto', 'rollback') | list }}"
    workloads_retirable: "{{ workloads_gate_retirable }}"
    workloads_retired_allowed: "{{ workloads_gate_retired_allowed }}"
    workloads_coordinated: >-
      {{ workloads_gate_findings | rejectattr('rule', 'equalto', 'rollback')
         | reject('in', workloads_gate_retired_allowed) | list }}
  vars:
    workloads_gate_findings: "{{ workloads_gate_formats.stdout | from_json if workloads_gate_has_base | bool else [] }}"
    workloads_gate_retirable: >-
      {{ workloads_gate_findings | selectattr('rule', 'equalto', 'retired')
         | selectattr('shared', 'defined') | rejectattr('shared')
         | selectattr('permanent', 'defined') | rejectattr('permanent') | list }}
    workloads_gate_retired_allowed: >-
      {{ workloads_gate_retirable | selectattr('id', 'in', workloads_allow_retired) | list }}

- name: Report the retired formats that KARDAMOM_ALLOW_RETIRED names
  ansible.builtin.debug:
    msg: >-
      KARDAMOM_ALLOW_RETIRED accepts the retirement of {{ workloads_retired_allowed | map(attribute='id') | join(', ') }}.
      The release removes the service that owned each one.
  when: workloads_retired_allowed | length > 0

- name: Refuse a coordinated format change in the rolling path
  ansible.builtin.assert:
    that: workloads_coordinated | length == 0
    fail_msg: >-
      Refused: a rolling deploy cannot carry a coordinated format change:
      {{ workloads_coordinated | map(attribute='id') | unique | join(', ') }}.
      A mixed fleet of the accepted release and this one cannot run. Stop the writers, or follow the
      runbook of the format (docs/formats.md), then deploy.
      {{ ('When the release removes the service that owned ' ~ (workloads_gate_unallowed | join(', '))
          ~ ', set KARDAMOM_ALLOW_RETIRED=' ~ (workloads_gate_unallowed | join(',')) ~ '.')
         if workloads_gate_unallowed | length > 0 else '' }}
  vars:
    workloads_gate_unallowed: >-
      {{ workloads_retirable | map(attribute='id') | difference(workloads_allow_retired) }}

- name: Refuse a one-way format change that KARDAMOM_ALLOW_ONE_WAY does not name
  ansible.builtin.assert:
    that: workloads_one_way | map(attribute='id') | difference(workloads_allow_one_way) | length == 0
    fail_msg: >-
      Refused: the release writes a version that the accepted release cannot read:
      {{ workloads_one_way | map(attribute='id') | join(', ') }}.
      After the first write a rollback is not safe. Set
      KARDAMOM_ALLOW_ONE_WAY={{ workloads_one_way | map(attribute='id') | join(',') }} to accept a rollback floor at this release.

- name: Refuse an allowance that covers no one-way change
  ansible.builtin.assert:
    that: workloads_allow_one_way | difference(workloads_one_way | map(attribute='id')) | length == 0
    fail_msg: >-
      Refused: KARDAMOM_ALLOW_ONE_WAY names {{ workloads_allow_one_way | difference(workloads_one_way | map(attribute='id')) | join(', ') }},
      and the release has no one-way change of it. Unset it.

- name: Refuse an allowance that covers no retired format
  ansible.builtin.assert:
    that: workloads_allow_retired | difference(workloads_retirable | map(attribute='id')) | length == 0
    fail_msg: >-
      Refused: KARDAMOM_ALLOW_RETIRED names {{ workloads_allow_retired | difference(workloads_retirable | map(attribute='id')) | join(', ') }},
      and the release retires no format of that id that is neither shared nor permanent. Unset it.

# The floor: the versions this release writes that the accepted release
# cannot read. The rollback does not cross it.
- name: Set the rollback floor
  ansible.builtin.set_fact:
    workloads_floor: >-
      {{ {} if workloads_one_way | length == 0 else
         {'formats': workloads_one_way | items2dict(key_name='id', value_name='head'),
          'revision': workloads_target_revision} }}

# 5. The sealer settings that every member must match, by the registered
# cluster. KARDAMOM_ALLOW_MUST_MATCH names the settings of a documented
# procedure, such as the return from a seeded start.
- name: Compile the sealer for the member settings check
  ansible.builtin.include_tasks: compile.yml
  vars:
    workloads_job: "{{ workloads_sealer_job }}"

# The plan of the sealer roll. A new image digest or any other change of
# the sealer job shows as a diff, and only then do the members restart.
- name: Plan the sealer for the snapshot check
  ansible.builtin.include_tasks: plan.yml
  vars:
    workloads_register_job: cluster

- name: Keep whether the sealer members restart on the target
  ansible.builtin.set_fact:
    workloads_gate_sealer_rolls: "{{ workloads_gate_cluster_job.status == 200 and workloads_plan.json.Diff.Type != 'None' }}"

- name: Keep the sealer settings that change
  ansible.builtin.set_fact:
    workloads_gate_sealer_changed: >-
      {{ ([] if workloads_gate_cluster_job.status != 200 else
          workloads_gate_cluster_job.json.TaskGroups | map(attribute='Tasks') | map('first')
          | map(attribute='Env.JAVA_TOOL_OPTIONS') | map('regex_findall', workloads_gate_pattern)
          | map('map', 'join', '=') | map('symmetric_difference', workloads_gate_new) | flatten)
         | map('regex_replace', '=.*$', '') | unique }}
  vars:
    workloads_gate_pattern: '-Dkardamom\.cluster\.({{ workloads_sealer_must_match | join("|") }})=(\S*)'
    workloads_gate_new: >-
      {{ workloads_job_definition.TaskGroups[0].Tasks[0].Env.JAVA_TOOL_OPTIONS
         | regex_findall(workloads_gate_pattern) | map('join', '=') | list }}

- name: Refuse a rolling change of a sealer setting that every member must match
  ansible.builtin.assert:
    that: workloads_gate_sealer_changed | difference(workloads_allow_must_match) | length == 0
    fail_msg: >-
      Refused: a rolling deploy cannot change a sealer setting that every member must match:
      {{ workloads_gate_sealer_changed | join(', ') }}.
      Members on two values decide differently and fork the replicated state.
      Change it through a coordinated restart of the sealer. A documented procedure names the settings in
      KARDAMOM_ALLOW_MUST_MATCH={{ workloads_gate_sealer_changed | join(',') }}.

# 5b. The sealer retention. It is not a setting that every member must
# match: two members with two windows decide the same. A member with a
# lower window answers more cursors with REPLAY_UNAVAILABLE, and a reader
# whose cursor sits between the two windows loses its source. So a rolling
# deploy only raises it. KARDAMOM_ALLOW_MUST_MATCH=retention allows a lower
# value. A member that is mid-roll keeps its own value, so the gate
# compares with the highest value of the registered groups.
- name: Keep the sealer retention of the target and of the registered sealer
  ansible.builtin.set_fact:
    workloads_gate_retention_new: >-
      {{ workloads_job_definition.TaskGroups[0].Tasks[0].Env.JAVA_TOOL_OPTIONS
         | regex_search('-Dkardamom[.]cluster[.]retention=[0-9]+') | regex_replace('^.*=', '') | int }}
    workloads_gate_retention_now: >-
      {{ ([] if workloads_gate_cluster_job.status != 200 else
          workloads_gate_cluster_job.json.TaskGroups | map(attribute='Tasks') | map('first')
          | map(attribute='Env.JAVA_TOOL_OPTIONS') | map('regex_search', '-Dkardamom[.]cluster[.]retention=[0-9]+')
          | select | map('regex_replace', '^.*=', '') | map('int') | list) | max | default(0, true) }}

- name: Keep whether the target lowers the sealer retention
  ansible.builtin.set_fact:
    workloads_gate_retention_lowered: "{{ workloads_gate_retention_new | int < workloads_gate_retention_now | int }}"

- name: Refuse a lower sealer retention in the rolling path
  ansible.builtin.assert:
    that: not workloads_gate_retention_lowered | bool or 'retention' in workloads_allow_must_match
    fail_msg: >-
      Refused: the target lowers the sealer retention from {{ workloads_gate_retention_now }} to
      {{ workloads_gate_retention_new }} frames. A rolling deploy only raises it: a member with the lower window
      answers more cursors with REPLAY_UNAVAILABLE. Lower it only on purpose, with KARDAMOM_ALLOW_MUST_MATCH=retention.

# The v2 loop of the sequencers goes off when the registered sequencer
# job carries v2_loop and the target does not turn it on (8d of
# carry_gate.yml). KARDAMOM_ALLOW_MUST_MATCH=admission allows that move.
- name: Read the registered sequencer for the v2 loop
  ansible.builtin.include_tasks: read_job.yml
  vars:
    workloads_read_job: sequencer

- name: Keep whether the target turns the v2 loop off
  ansible.builtin.set_fact:
    workloads_gate_admission_off: >-
      {{ workloads_registered_job.status == 200
         and ((workloads_registered_job.json.Meta | default({}, true)).v2_loop | default('')) == 'true'
         and workloads_sequencer_admission != 'on' }}

- name: Refuse an allowance that covers no sealer setting change
  ansible.builtin.assert:
    that: workloads_allow_must_match | difference(workloads_gate_allowable) | length == 0
    fail_msg: >-
      Refused: KARDAMOM_ALLOW_MUST_MATCH names {{ workloads_allow_must_match | difference(workloads_gate_allowable) | join(', ') }},
      and the release does not change it. Unset it.
  vars:
    workloads_gate_allowable: >-
      {{ workloads_gate_sealer_changed + (['retention'] if workloads_gate_retention_lowered | bool else [])
         + (['admission'] if workloads_gate_admission_off | bool else []) }}

# 5a. A registered sealer job that names decisionVersion=3 ran a build
# that applied nonce releases (ingress kind 10) from its start. This
# release drops kind 10, so a member that restarts replays its log after
# its snapshot with other rules and forks. The remedy is a rebuild of the
# sealer from a seed.
- name: Refuse a rolling deploy onto a sealer that started on decision version 3
  ansible.builtin.assert:
    that: >-
      workloads_gate_cluster_job.status != 200
      or workloads_gate_cluster_job.json.TaskGroups | map(attribute='Tasks') | map('first')
         | map(attribute='Env.JAVA_TOOL_OPTIONS') | select('search', '-Dkardamom\.cluster\.decisionVersion=3(\s|$)')
         | list | length == 0
    fail_msg: >-
      Refused: the registered sealer job names decisionVersion=3. Its members applied nonce releases from their
      start, and this release drops them when it replays their logs, so the state forks. Rebuild the sealer from
      a seed with the operator's word (docs/runbooks/sealer-fleet-rebuild.md: purge the job and wipe the member
      state), then deploy.

# 6. The shard map, by the registered ingress.
- name: Refuse a shard map change in the rolling path
  ansible.builtin.assert:
    that:
      - workloads_gate_registered_map.version == workloads_gate_file_map.version
      - workloads_gate_registered_map.table == workloads_gate_file_map.table
    fail_msg: >-
      Refused: config/shard-map.toml (version {{ workloads_gate_file_map.version }}) differs from the
      shard map of the registered ingress (version {{ workloads_gate_registered_map.version }}).
      A rolling deploy cannot change the routing. Use the resize controller (kardamom-cluster scale-sequencers).
  vars:
    workloads_gate_file_map: "{{ lookup('file', workloads_cluster_dir ~ '/config/shard-map.toml') | community.general.from_toml }}"
    workloads_gate_registered_map: >-
      {{ workloads_gate_ingress_job.json.TaskGroups[0].Tasks[0].Templates
         | selectattr('DestPath', 'equalto', 'local/shard-map.toml') | map(attribute='EmbeddedTmpl') | first
         | community.general.from_toml }}
  when: workloads_gate_ingress_job.status == 200

# 7. The sealer snapshot (snapshot_check.yml). A cluster that Nomad does
# not know has no member to read. A running member reads no snapshot, so
# the check runs only when the sealer job changes. A release that does
# not change the sealer passes while a member is down, so it can be the
# fix of that outage.
- name: Report the skip of the snapshot check
  ansible.builtin.debug:
    msg: >-
      The sealer job does not change, so no sealer member restarts on the target release. The gate skips the
      snapshot check.
  when:
    - workloads_gate_cluster_job.status == 200
    - not workloads_gate_sealer_rolls | bool

# The formats of the sealer release come from its revision, not from the
# checkout. A deploy of an older manifest can run from a newer checkout.
# One sealer image holds one set of snapshot versions. The revision of
# the target sealer image comes from the first source that names it:
# - A deploy record that names the image.
# - The checkout, when every registered member runs the image, or the
#   manifest pins no sealer image. The members run that image, or the
#   image builds from this tree. A registered job whose groups run more
#   than one image (a roll that stopped half way) does not name the image.
# - The tag of the image. A release tags it main-<12 hex of the commit>,
#   or vX.Y.Z.
# - KARDAMOM_REVISION.
# A sealer image that no source names is refused.
- name: Name the revision of the target sealer release
  ansible.builtin.set_fact:
    workloads_gate_sealer_revision: >-
      {{ (([workloads_last_attempt.before | default({}), workloads_accepted.target | default({}),
            workloads_last_attempt.target | default({})]
           | selectattr('manifest', 'defined') | selectattr('revision', 'defined')
           | selectattr('manifest.cluster', 'defined')
           | selectattr('manifest.cluster', 'equalto', workloads_gate_sealer_image)
           | rejectattr('revision', 'in', ['', 'unknown']) | map(attribute='revision') | list)
          + ([workloads_target_revision]
             if workloads_gate_sealer_image == ''
                or workloads_gate_sealer_registered | unique | list == [workloads_gate_sealer_image]
             else [])
          + (workloads_gate_sealer_tag | regex_findall('^main-([0-9a-f]{12})$'))
          + (workloads_gate_sealer_tag | regex_findall('^v[0-9]+\.[0-9]+\.[0-9]+$'))
          + ([workloads_revision] if workloads_revision | length > 0 else [])
          + ['']) | first }}
  vars:
    workloads_gate_sealer_image: "{{ workloads_image_refs.cluster | default('') }}"
    workloads_gate_sealer_registered: >-
      {{ workloads_gate_cluster_job.json.TaskGroups | map(attribute='Tasks') | map('first')
         | map(attribute='Config.image', default='') | list }}
    workloads_gate_sealer_tag: "{{ workloads_gate_sealer_image | regex_replace('@.*$', '') | regex_replace('^.*:', '') }}"
  when: workloads_gate_sealer_rolls | bool

- name: Refuse a sealer image whose revision the gate cannot name
  ansible.builtin.assert:
    that: workloads_gate_sealer_revision | length > 0
    fail_msg: >-
      Refused: no deploy record names the sealer image {{ workloads_image_refs.cluster }}, not every registered
      sealer member runs it, and its tag names no release revision (main-<12 hex> or vX.Y.Z). So the gate cannot read the snapshot
      versions that this sealer reads. Set KARDAMOM_REVISION to the revision of that image, then deploy.
  when: workloads_gate_sealer_rolls | bool

- name: Check the sealer snapshot against the target
  ansible.builtin.include_tasks: snapshot_check.yml
  vars:
    workloads_sealer_groups: "{{ workloads_gate_cluster_job.json.TaskGroups | map(attribute='Name') | list }}"
    workloads_snapshot_revision: "{{ workloads_gate_sealer_revision }}"
  when: workloads_gate_sealer_rolls | bool

# 7a. The sealer retention in bytes. A replay over a cluster session
# queues every wanted frame at once, and the sealer closes a session whose
# backlog passes 64 MiB. So the frames of a full window, at the mean size
# of the frames that the members hold now, stay within 48 MiB
# (workloads_retention_cap_bytes), well below that limit. The members hold the same frames, so the mean is the retained
# bytes over the retained frames of all members, from the member status:
# the values of the gauges kardamom_sealer_retained_bytes and
# kardamom_sealer_retained_frames. Members that hold no frame give no mean.
- name: Refuse a sealer retention whose window passes the cap in bytes
  ansible.builtin.assert:
    that: workloads_gate_retention_new | int * workloads_gate_mean_bytes | float <= workloads_retention_cap_bytes | int
    fail_msg: >-
      Refused: the sealer retention {{ workloads_gate_retention_new }} frames at the mean frame size of the members,
      {{ workloads_gate_mean_bytes | float | round(1) }} bytes, is
      {{ (workloads_gate_retention_new | int * workloads_gate_mean_bytes | float) | int }} bytes, above the cap of
      {{ workloads_retention_cap_bytes }} bytes. A replay of the whole window would pass the backlog limit of a
      cluster session. Set at most {{ (workloads_retention_cap_bytes | int / [workloads_gate_mean_bytes | float, 1] | max) | int }}
      frames.
  vars:
    workloads_gate_frames: >-
      {{ workloads_sealer_status.results | map(attribute='json') | map(attribute='retainedFrames', default=0)
         | map('int') | sum }}
    workloads_gate_mean_bytes: >-
      {{ 0 if workloads_gate_frames | int == 0 else
         (workloads_sealer_status.results | map(attribute='json') | map(attribute='retainedBytes', default=0)
          | map('int') | sum) / workloads_gate_frames | int }}
  when:
    - workloads_gate_sealer_rolls | bool
    - workloads_gate_retention_new | int != workloads_gate_retention_now | int

# 8. The carry window.
- name: Gate the moves of the carry window
  ansible.builtin.import_tasks: carry_gate.yml
