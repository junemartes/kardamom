---
# Read the gauges workloads_metrics_gauges of every running allocation of
# the job workloads_metrics_job, from /metrics on the port
# workloads_metrics_port. The controller reaches each allocation by the
# node address that the Nomad API advertises, as sealer_status.yml does.
# A gauge name can carry its labels, such as
# kardamom_sealer_feature_state{feature="5"}.
# The result is workloads_metrics_of[<job>]:
# - groups: the task group of each running allocation;
# - one list for each gauge, in the order of groups. The value is -1 when
#   the allocation does not answer or does not report the gauge.
# A job that Nomad does not know has no allocation. The tasks read only,
# so they also run in check mode.
- name: Read the allocations of {{ workloads_metrics_job }}
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/job/{{ workloads_metrics_job }}/allocations?namespace={{ workloads_namespace | urlencode }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
    status_code: [200, 404]
  register: workloads_metrics_allocations
  check_mode: false

- name: Read the node of every running {{ workloads_metrics_job }}
  ansible.builtin.uri:
    url: "{{ workloads_nomad_addr }}/v1/node/{{ item.NodeID }}"
    headers:
      X-Nomad-Token: "{{ workloads_nomad_token }}"
  loop: >-
    {{ (workloads_metrics_allocations.json if workloads_metrics_allocations.status == 200 else [])
       | selectattr('ClientStatus', 'equalto', 'running')
       | selectattr('DesiredStatus', 'equalto', 'run') | list }}
  loop_control:
    label: "{{ item.TaskGroup }}"
  register: workloads_metrics_nodes
  check_mode: false

# A page that does not answer stays in the result with no content.
- name: Read the metrics of every running {{ workloads_metrics_job }}
  ansible.builtin.uri:
    url: "http://{{ item.json.HTTPAddr | regex_replace(':[0-9]+$', '') }}:{{ workloads_metrics_port }}/metrics"
    return_content: true
    timeout: 10
  loop: "{{ workloads_metrics_nodes.results }}"
  loop_control:
    label: "{{ item.item.TaskGroup }}"
  register: workloads_metrics_pages
  failed_when: false
  check_mode: false

- name: Keep the allocations of {{ workloads_metrics_job }}
  ansible.builtin.set_fact:
    workloads_metrics_of: >-
      {{ workloads_metrics_of | default({}) | combine({workloads_metrics_job:
           {'groups': workloads_metrics_pages.results | map(attribute='item.item.TaskGroup') | list}}) }}

- name: Keep each gauge of {{ workloads_metrics_job }}
  ansible.builtin.set_fact:
    workloads_metrics_of: >-
      {{ workloads_metrics_of | combine({workloads_metrics_job: {item: workloads_metrics_pages.results
           | map(attribute='content', default='') | map('default', '', true)
           | map('regex_search', '(?m)^' ~ (item | regex_escape) ~ ' [-+0-9.eE]+$')
           | map('default', 'none -1', true) | map('split', ' ') | map('last') | map('float') | list}}, recursive=true) }}
  loop: "{{ workloads_metrics_gauges }}"
