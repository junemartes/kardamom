---
- name: Install nomad software on an unprepared node
  ansible.builtin.import_tasks: install.yml
  when: not (common_node_software_preinstalled | default(false) | bool)

- name: Render the Nomad configuration
  # The rendered file carries tokens on the production profile; log nothing about it there.
  no_log: "{{ deployment_profile == 'production' }}"
  when: not (image_build | default(false) | bool)
  ansible.builtin.template:
    src: nomad.hcl.j2
    dest: /etc/nomad.d/nomad.hcl
    owner: nomad
    group: nomad
    mode: "0640"
  notify: Restart nomad

- name: Install the Nomad systemd unit
  ansible.builtin.template:
    src: nomad.service.j2
    dest: /etc/systemd/system/nomad.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart nomad

- name: Enable and start Nomad
  when: not (image_build | default(false) | bool)
  ansible.builtin.systemd:
    name: nomad
    enabled: true
    state: started
    daemon_reload: true
