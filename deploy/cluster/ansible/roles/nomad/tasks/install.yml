---

- name: Create the nomad system group
  ansible.builtin.group:
    name: nomad
    system: true

- name: Create the nomad system user
  ansible.builtin.user:
    name: nomad
    group: nomad
    system: true
    shell: /usr/sbin/nologin
    home: /opt/nomad
    create_home: false

- name: Create nomad directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: nomad
    group: nomad
    mode: "0750"
  loop:
    - /etc/nomad.d
    - /opt/nomad

- name: Download and install the Nomad binary
  ansible.builtin.unarchive:
    src: "https://releases.hashicorp.com/nomad/{{ nomad_version }}/nomad_{{ nomad_version }}_linux_{{ common_hashicorp_arch }}.zip"
    dest: /usr/local/bin
    remote_src: true
    owner: root
    group: root
    mode: "0755"
    creates: /usr/local/bin/nomad
  register: nomad_download
  until: nomad_download is succeeded
  retries: 5
  delay: 10
