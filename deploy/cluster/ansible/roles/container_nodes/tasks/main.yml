---
- name: Configure Linux host networking
  ansible.builtin.import_tasks: host.yml

- name: Inspect existing cluster network
  community.docker.docker_network_info:
    name: "{{ container_nodes_network }}"
  register: container_nodes_existing_network

- name: Reject network drift without deleting running nodes
  ansible.builtin.assert:
    that:
      - container_nodes_existing_network.network.Driver == 'bridge'
      - container_nodes_existing_network.network.IPAM.Config | map(attribute='Subnet') | list == [container_nodes_subnet]
      - container_nodes_existing_network.network.Options['com.docker.network.bridge.name'] | default('') == container_nodes_bridge
    fail_msg: Existing cluster network differs; explicitly reset the cluster to replace it.
  when: container_nodes_existing_network.exists

- name: Create cluster bridge
  community.docker.docker_network:
    name: "{{ container_nodes_network }}"
    driver: bridge
    driver_options:
      com.docker.network.bridge.name: "{{ container_nodes_bridge }}"
    ipam_config:
      - subnet: "{{ container_nodes_subnet }}"
    labels:
      io.kardamom.cluster: "{{ container_nodes_network }}"
  when: not container_nodes_existing_network.exists

- name: Read bridge multicast snooping
  ansible.builtin.command:
    argv: [cat, "/sys/class/net/{{ container_nodes_bridge }}/bridge/multicast_snooping"]
  register: container_nodes_snooping
  changed_when: false
  when: not ansible_check_mode

- name: Enable multicast flooding on the isolated test bridge
  become: true
  ansible.builtin.command:
    argv: [tee, "/sys/class/net/{{ container_nodes_bridge }}/bridge/multicast_snooping"]
    stdin: "0"
  changed_when: true
  when:
    - not ansible_check_mode
    - container_nodes_snooping.stdout | trim != '0'

- name: Build systemd node image
  community.docker.docker_image_build:
    name: "{{ container_nodes_image }}"
    path: "{{ container_nodes_docker_dir }}"
    dockerfile: node.Dockerfile
    rebuild: always

- name: Converge node containers
  ansible.builtin.include_tasks: node.yml
  loop: "{{ topology_nodes }}"
  loop_control:
    loop_var: container_nodes_node
    label: "{{ container_nodes_node.name }}"
