---
- name: Discover managed nodes and volumes including removed topology classes
  community.docker.docker_host_info:
    containers: true
    containers_all: true
    containers_filters:
      label: "{{ container_nodes_label }}={{ container_nodes_network }}"
    volumes: true
    volumes_filters:
      label: "{{ container_nodes_label }}={{ container_nodes_network }}"
  register: container_nodes_managed

- name: Remove labeled node containers
  community.docker.docker_container:
    name: "{{ item.Id }}"
    state: absent
    force_kill: true
  loop: "{{ container_nodes_managed.containers }}"
  loop_control:
    label: "{{ item.Names }}"

# Support nodes created by the retired shell deployer, which had no labels.
- name: Remove canonical node containers
  community.docker.docker_container:
    name: "kardamom-{{ item.name }}"
    state: absent
    force_kill: true
  loop: "{{ topology_nodes }}"

- name: Remove labeled storage volumes
  community.docker.docker_volume:
    name: "{{ item.Name }}"
    state: absent
  loop: "{{ container_nodes_managed.volumes }}"

- name: Remove canonical storage volumes
  community.docker.docker_volume:
    name: "kardamom-{{ item.0.name }}-{{ item.1 }}"
    state: absent
  loop: "{{ topology_nodes | product(['docker', 'containerd']) | list }}"

- name: Remove cluster bridge without disconnecting foreign containers
  community.docker.docker_network:
    name: "{{ container_nodes_network }}"
    state: absent
    force: false
