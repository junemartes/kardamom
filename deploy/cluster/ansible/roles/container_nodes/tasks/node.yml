---
- name: Inspect existing node
  community.docker.docker_container_info:
    name: "kardamom-{{ container_nodes_node.name }}"
  register: container_nodes_existing

- name: Validate existing node address before reusing its durable state
  ansible.builtin.assert:
    that:
      - container_nodes_network in container_nodes_existing.container.NetworkSettings.Networks
      - >-
        container_nodes_existing.container.NetworkSettings.Networks[container_nodes_network].IPAMConfig.IPv4Address
        | default(container_nodes_existing.container.NetworkSettings.Networks[container_nodes_network].IPAddress, true)
        == container_nodes_node.ip
    fail_msg: Existing node topology differs; explicitly reset the cluster to replace it.
  when: container_nodes_existing.exists

- name: Create inner Docker storage volumes
  community.docker.docker_volume:
    name: "kardamom-{{ container_nodes_node.name }}-{{ item }}"
    labels:
      io.kardamom.cluster: "{{ container_nodes_network }}"
  loop: [docker, containerd]

- name: Create missing node
  community.docker.docker_container:
    name: "kardamom-{{ container_nodes_node.name }}"
    hostname: "{{ container_nodes_node.name }}"
    image: "{{ container_nodes_image }}"
    state: started
    privileged: true
    cgroupns_mode: host
    shm_size: 512m
    tmpfs: [/run, /run/lock]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - "kardamom-{{ container_nodes_node.name }}-docker:/var/lib/docker"
      - "kardamom-{{ container_nodes_node.name }}-containerd:/var/lib/containerd"
    networks:
      - name: "{{ container_nodes_network }}"
        ipv4_address: "{{ container_nodes_node.ip }}"
    labels:
      io.kardamom.cluster: "{{ container_nodes_network }}"
  when: not container_nodes_existing.exists

# Updating the image on an existing container would destroy its rootfs state.
- name: Start existing node without recreating it
  community.docker.docker_container:
    name: "kardamom-{{ container_nodes_node.name }}"
    state: started
    comparisons:
      '*': ignore
  when: container_nodes_existing.exists

- name: Wait for systemd readiness
  community.docker.docker_container_exec:
    container: "kardamom-{{ container_nodes_node.name }}"
    argv: [systemctl, is-system-running]
  register: container_nodes_systemd
  changed_when: false
  failed_when: container_nodes_systemd.stdout | default('') | trim not in ['running', 'degraded']
  until: container_nodes_systemd.stdout | default('') | trim in ['running', 'degraded']
  retries: 30
  delay: 2
  when: not ansible_check_mode
