---
- name: Validate local lifecycle operation
  ansible.builtin.assert:
    that: local_runner_operation in ['all', 'build', 'up', 'reset', 'down']

- name: Read Docker CLI context
  ansible.builtin.command:
    argv: [docker, context, inspect]
  register: local_runner_context
  changed_when: false
  check_mode: false

- name: Resolve the Docker daemon endpoint
  ansible.builtin.set_fact:
    local_runner_docker_host: >-
      {{ lookup('ansible.builtin.env', 'DOCKER_HOST') |
         default((local_runner_context.stdout | from_json)[0].Endpoints.docker.Host, true) }}
    local_runner_environment:
      REGISTRY_PUSH_NODE: control-0

- name: Forward configured test environment
  ansible.builtin.set_fact:
    local_runner_environment: "{{ local_runner_environment | combine({item: lookup('ansible.builtin.env', item)}) }}"
  loop: "{{ local_runner_environment_keys }}"
  when: lookup('ansible.builtin.env', item) | length > 0

- name: Manage local Docker resources
  module_defaults:
    group/community.docker.docker:
      docker_host: "{{ local_runner_docker_host }}"
  block:
    - name: Build Linux artifacts and controller
      ansible.builtin.include_tasks: build.yml
      when:
        - local_runner_build | bool
        - not ansible_check_mode

    - name: Inspect existing Linux controller
      community.docker.docker_container_info:
        name: "{{ local_runner_container }}"
      register: local_runner_existing
      when: local_runner_operation != 'build'

    - name: Require existing controller to use this checkout
      ansible.builtin.assert:
        that:
          - >-
            local_runner_existing.container.Mounts | selectattr('Destination', 'equalto', '/work')
            | map(attribute='Source') | list == [local_runner_root]
        fail_msg: "{{ local_runner_container }} uses another checkout; choose a new local_runner_container."
      when:
        - local_runner_operation != 'build'
        - local_runner_existing.exists

    - name: Create Linux controller
      community.docker.docker_container:
        name: "{{ local_runner_container }}"
        image: kardamom-orchestrator:latest
        privileged: true
        network_mode: host
        pid_mode: host
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - "{{ local_runner_root }}:/work"
        state: started
      when:
        - local_runner_operation != 'build'
        - not local_runner_existing.exists

    - name: Start existing controller without interrupting another run
      community.docker.docker_container:
        name: "{{ local_runner_container }}"
        state: started
        comparisons:
          '*': ignore
      when:
        - local_runner_operation != 'build'
        - local_runner_existing.exists

    # The lifecycle of the Makefile, run inside the controller: the
    # Terraform state under /work is the record of the running cluster.
    - name: Run the cluster lifecycle inside the Linux controller
      when:
        - local_runner_operation != 'build'
        - not ansible_check_mode
      block:
        - name: Destroy the previous cluster for reset or down
          community.docker.docker_container_exec:
            container: "{{ local_runner_container }}"
            argv: [make, -C, /work/deploy/cluster, container-down]
          when: local_runner_operation in ['reset', 'down']

        - name: Create, provision and deploy the cluster
          community.docker.docker_container_exec:
            container: "{{ local_runner_container }}"
            argv:
              - make
              - -C
              - /work/deploy/cluster
              - container-up
              - "CLUSTER_VARS={{ local_runner_vars | to_json if local_runner_vars else '' }}"
            env: "{{ local_runner_environment }}"
          register: local_runner_converge
          when: local_runner_operation != 'down'

        - name: Show convergence output
          ansible.builtin.debug:
            var: local_runner_converge.stdout_lines
          when: local_runner_operation != 'down'

        - name: Run the smoke, load and chaos gates
          community.docker.docker_container_exec:
            container: "{{ local_runner_container }}"
            argv: [make, -C, /work/deploy/cluster, container-test]
            env: "{{ local_runner_environment }}"
          register: local_runner_verdict
          when:
            - local_runner_operation != 'down'
            - local_runner_tests | bool

        - name: Show test verdicts
          ansible.builtin.debug:
            var: local_runner_verdict.stdout_lines
          when:
            - local_runner_operation != 'down'
            - local_runner_tests | bool
      rescue:
        - name: Save the original failure
          ansible.builtin.set_fact:
            local_runner_failure: "{{ ansible_failed_result }}"

        - name: Collect diagnostics before teardown
          community.docker.docker_container_exec:
            container: "{{ local_runner_container }}"
            argv: [make, -C, /work/deploy/cluster, container-diagnostics]
          register: local_runner_diagnostics
          failed_when: false

        - name: Show failure diagnostics
          ansible.builtin.debug:
            var: local_runner_diagnostics.stdout_lines

        - name: Report the original lifecycle failure
          ansible.builtin.fail:
            msg: "{{ local_runner_failure }}"
      always:
        - name: Destroy the cluster unless KEEP was requested
          community.docker.docker_container_exec:
            container: "{{ local_runner_container }}"
            argv: [make, -C, /work/deploy/cluster, container-down]
          when:
            - not local_runner_keep | bool
            - local_runner_operation != 'down'
