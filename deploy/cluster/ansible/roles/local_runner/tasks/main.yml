---
- name: Validate local lifecycle operation
  ansible.builtin.assert:
    that: local_runner_operation in ['all', 'build', 'up', 'reset', 'down']

- name: Read Docker CLI context
  ansible.builtin.command:
    argv: [docker, context, inspect]
  register: local_runner_context
  changed_when: false
  check_mode: false

- name: Resolve the Docker daemon endpoint
  ansible.builtin.set_fact:
    local_runner_docker_host: >-
      {{ lookup('ansible.builtin.env', 'DOCKER_HOST') |
         default((local_runner_context.stdout | from_json)[0].Endpoints.docker.Host, true) }}
    local_runner_environment:
      REGISTRY_PUSH_NODE: control-0

- name: Forward configured test environment
  ansible.builtin.set_fact:
    local_runner_environment: "{{ local_runner_environment | combine({item: lookup('ansible.builtin.env', item)}) }}"
  loop: "{{ local_runner_environment_keys }}"
  when: lookup('ansible.builtin.env', item) | length > 0

- name: Manage local Docker resources
  module_defaults:
    group/community.docker.docker:
      docker_host: "{{ local_runner_docker_host }}"
  block:
    - name: Build Linux artifacts and controller
      ansible.builtin.include_tasks: build.yml
      when:
        - local_runner_build | bool
        - not ansible_check_mode

    - name: Inspect existing Linux controller
      community.docker.docker_container_info:
        name: "{{ local_runner_container }}"
      register: local_runner_existing
      when: local_runner_operation != 'build'

    - name: Require existing controller to use this checkout
      ansible.builtin.assert:
        that:
          - >-
            local_runner_existing.container.Mounts | selectattr('Destination', 'equalto', '/work')
            | map(attribute='Source') | list == [local_runner_root]
          - >-
            local_runner_existing.container.Mounts | selectattr('Destination', 'equalto', '/tmp/kardamom-cluster-locks')
            | map(attribute='Name', default='') | list == ['kardamom-lifecycle-locks']
        fail_msg: >-
          {{ local_runner_container }} uses another checkout or lacks the shared lock volume;
          choose a new local_runner_container.
      when:
        - local_runner_operation != 'build'
        - local_runner_existing.exists

    - name: Create Linux controller
      community.docker.docker_container:
        name: "{{ local_runner_container }}"
        image: kardamom-orchestrator:latest
        privileged: true
        network_mode: host
        pid_mode: host
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - kardamom-lifecycle-locks:/tmp/kardamom-cluster-locks
          - "{{ local_runner_root }}:/work"
        state: started
      when:
        - local_runner_operation != 'build'
        - not local_runner_existing.exists

    - name: Start existing controller without interrupting another run
      community.docker.docker_container:
        name: "{{ local_runner_container }}"
        state: started
        comparisons:
          '*': ignore
      when:
        - local_runner_operation != 'build'
        - local_runner_existing.exists

    - name: Run Ansible lifecycle inside Linux controller
      community.docker.docker_container_exec:
        container: "{{ local_runner_container }}"
        argv:
          - ansible-playbook
          - -i
          - localhost,
          - /work/deploy/cluster/ansible/run.yml
          - --extra-vars
          - "{{ local_runner_vars | combine({'cluster_run_operation': 'up' if local_runner_operation == 'all' else local_runner_operation}) | to_json }}"
        env: "{{ local_runner_environment }}"
      register: local_runner_result
      failed_when: local_runner_result.rc != 0
      when:
        - local_runner_operation != 'build'
        - not ansible_check_mode

    - name: Show cluster lifecycle output
      ansible.builtin.debug:
        var: local_runner_result.stdout_lines
      when:
        - local_runner_operation != 'build'
        - not ansible_check_mode
