---
local_runner_operation: all
local_runner_container: kardamom-orch
local_runner_build: "{{ local_runner_operation in ['all', 'build'] }}"
local_runner_root: "{{ (playbook_dir ~ '/../../..') | realpath }}"
# Keep the nodes after the run, also after a failure. KEEP=1 sets it.
local_runner_keep: "{{ lookup('ansible.builtin.env', 'KEEP') | default('0', true) == '1' }}"
# Run one shard's gates after the deployment (SHARD selects it: load,
# semantics, chaos-executor, chaos-ingress, chaos-sequencer, chaos-cluster,
# chaos-retention).
local_runner_tests: true
local_runner_shard: "{{ lookup('ansible.builtin.env', 'SHARD') | default('load', true) }}"
# Extra vars for cluster.yml, as a JSON object (the CLUSTER_VARS of the Makefile).
local_runner_vars: {}
local_runner_environment_keys:
  - KEEP
  - RUN_LOAD
  - KARDAMOM_CHAOS_CASES
  - LOAD_DURATION_S
  - LOAD_TARGET_TPS
  - LOAD_SENDERS
  - LOAD_MAX_GAP
  - CHAOS_TPS
  - CHAOS_CASE_S
  - CHAOS_RESTART_SLO_S
  - CHAOS_RESCHEDULE_SLO_S
  - CHAOS_LEADER_SLO_S
  - KARDAMOM_CLUSTER_RETENTION
