---
# Reads the node contract of terraform/containers, adds the nodes to the
# in-memory inventory, and prepares the host network. containers.yml and
# resume.yml start with this play.
- name: Read the node contract and prepare the host
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    node_contract_file: "{{ playbook_dir }}/../terraform/containers/node-contract.json"
    node_contract: "{{ lookup('ansible.builtin.file', node_contract_file) | from_json }}"
  tasks:
    - name: Require node contract version 1
      ansible.builtin.assert:
        that:
          - node_contract.version | int == 1
          - node_contract.nodes | length > 0
        fail_msg: "{{ node_contract_file }} is not a version 1 node contract; run `tofu apply` in terraform/containers."

    - name: Add container nodes to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: "{{ [item.role, 'container_nodes'] }}"
        ansible_host: "{{ item.container }}"
        # The short name routes to community.docker.docker. The Mitogen
        # strategy (the CI shard step) maps only the short name to its own
        # docker transport, which keeps one Python process for each node.
        ansible_connection: docker
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
        kardamom_in_container: true
        kardamom_node: "{{ item.name }}"
        node_ip: "{{ item.ip }}"
        role: "{{ item.role }}"
        node_roles: "{{ item.roles }}"
        tier: "{{ item.tier }}"
        node_index: "{{ item.index }}"
        control_plane: "{{ item.control_plane }}"
      loop: "{{ node_contract.nodes | dict2items | map(attribute='value') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Keep the bridge name for the plays after provisioning
      ansible.builtin.set_fact:
        node_contract_bridge: "{{ node_contract.network.bridge }}"

    # A replaced node joins the bridge that the bring-up prepared
    # (replace-node.yml), so the host settings are already in place.
    - name: Prepare the host network for Aeron multicast
      ansible.builtin.include_role:
        name: host_prep
      vars:
        host_prep_bridge: "{{ node_contract_bridge }}"
      when: not (container_host_prepared | default(false) | bool)
