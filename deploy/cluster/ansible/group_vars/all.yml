# Canonical cluster contract — single source of truth for the whole deploy.
# Vagrantfile, Ansible roles, Nomad job templates, and config templates all
# derive their values from here (or mirror it; see deploy/cluster/README.md).
---
# --- versions -------------------------------------------------------------
nomad_version: "1.9.5"
consul_version: "1.20.1"
docker_apt_channel: "stable"
aeron_version: "1.45.0"          # must match rusteron-archive 0.1.x
ubuntu_codename: "jammy"         # 22.04, matches the Aeron image base (temurin jammy)

# Controller signing tool. The checksum covers the Linux amd64 release binary.
cosign_pinned_version: "v3.1.3"
cosign_pinned_sha256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"

# --- deployment profile ---------------------------------------------------
# One playbook, two profiles. `local` is the Vagrant VM path and the
# container CI path: one control node, a plain-HTTP registry, and an
# explicit node_ip on every inventory host. `production` is the Hetzner
# profile: three voting Consul and Nomad servers on the dedicated core, a
# private interface selector in place of fixed addresses, gossip
# encryption, ACLs, agent TLS and the host firewall.
# inventories/hetzner/group_vars/all.yml sets the production values, and
# roles/profile checks them before any role changes a host.
# See docs/agents/hetzner-hybrid-infra-spec.md.
deployment_profile: "local"
# Deployment identity. Nomad registers its own Consul services under
# cluster_id, so two clusters in one Consul datacenter cannot join each
# other. The Nomad jobs constrain on datacenter.
cluster_id: "kardamom-dev"
datacenter: "dc1"
nomad_region: "global"
# Consul join addresses. The local profile joins the control node. The
# production profile joins infrastructure DNS names of the dedicated
# Consul servers. Consul never bootstraps through its own service records.
consul_retry_join: ["{{ control_ip }}"]
consul_server_expect: 1
nomad_server_expect: 1
# The Consul HTTP and DNS listener address. Nomad and the applications use
# the local agent at 127.0.0.1. The local profile also listens on the node
# address for the smoke and chaos scripts.
consul_client_addr: "0.0.0.0"
# Production security inputs. An empty value disables its block, and the
# production profile refuses empty values. Supply them from the secret
# store through protected Ansible inputs (a vault file), never through
# node labels, user data or logs.
consul_gossip_key: ""
consul_acl_enabled: false
consul_agent_token: ""
nomad_acl_enabled: false
nomad_consul_token: ""
# The directory with the agent TLS material on each host: ca.pem,
# cert.pem, key.pem. An empty value disables TLS (local profile only).
consul_tls_dir: ""
nomad_tls_dir: ""
# The private interface selector. A production host resolves its own
# address from this interface at bootstrap. The local inventories pass
# node_ip explicitly. A dedicated host on the vSwitch VLAN uses its
# vswitch_address. See roles/netinfo.
private_interface: ""
# The private ranges that may reach the Consul, Nomad and Aeron ports on
# a production host (roles/firewall). The local profile runs no host
# firewall.
private_cidrs: []
# The ranges that may reach SSH on the public interface.
ssh_allowed_cidrs: ["0.0.0.0/0"]
# Public TCP ports open on a production host. The RPC edge reaches the
# proxies over the private network, so the list is empty by default.
public_tcp_ports: []

# --- image registry -------------------------------------------------------
registry_host: "192.168.56.10"   # cp1 (control plane)
registry_port: 5000
image_tag: "dev"
# Fully-qualified image refs used by Nomad job specs.
image_prefix: "{{ registry_host }}:{{ registry_port }}/kardamom"
# The plain-HTTP registries the Docker daemon trusts: the in-cluster
# registry of the local profile only. Production pulls from a TLS registry.
docker_insecure_registries: "{{ [registry_host ~ ':' ~ registry_port] if deployment_profile == 'local' else [] }}"

# --- L2 chain -------------------------------------------------------------
chain_id: 412346                 # matches chains/dev.toml
partition_count: 2               # M active sequencer shards: 1, 2, 4, or 8
# The lane plane is fixed at 8 tx_data lanes in code
# (kardamom_types::shard_map::LANE_COUNT). Every process opens all 8.
# The ingress and the sequencers take partition_count; the executor, the
# validator, and the batcher take no count. Mirrors, checked by
# scripts/check-contract.py: ingress.nomad.hcl --shards,
# sequencer.nomad.hcl --partition-count, config/sequencer.toml.tpl.
# The transaction lifetime, in ms. A transaction that waits on a nonce gap
# in a sequencer expires after this time with an explicit error. The
# ingress parks a submit for the same time. One value drives both:
# sequencer.nomad.hcl --tx-ttl-ms (both groups), ingress.nomad.hcl
# --pending-receipt-timeout-ms, and the chain-semantics park default in
# scripts/ci-stages.sh. scripts/check-contract.py checks the mirrors.
tx_ttl_ms: 30000

# --- ports ----------------------------------------------------------------
ports:
  nomad_http: 4646
  nomad_rpc: 4647
  nomad_serf: 4648
  consul_http: 8500
  consul_dns: 8600
  consul_server: 8300
  consul_serf_lan: 8301
  consul_serf_wan: 8302
  registry: 5000
  ingress_rpc: 8545            # eth JSON-RPC on the ingress node
  # The executor's read-only account nonce query (eth_getTransactionCount).
  # The sequencers ask it for the committed nonce of a cold sender. See
  # docs/specs/dynamic-sequencer-sizing.md, section 3.4. Mirrors, checked
  # by scripts/check-contract.py: executor.nomad.hcl --nonce-query-addr,
  # sequencer.nomad.hcl --executor-query-endpoints (both groups).
  executor_nonce_query: 9024
  anvil_l1: 8546              # in-cluster L1 (anvil) for the smoke test
  # Aeron archive control/response/replication (see aeron image EXPOSE).
  aeron_archive_control: 8010
  aeron_archive_control_response: 8011
  aeron_archive_recording_events: 8020
  aeron_archive_replication: 8021
  # Base UDP port for kardamom data/ordering channels; per-channel offsets
  # are assigned in config/channels.toml.tpl.
  aeron_channel_base: 40000

# --- on-node filesystem layout (bind-mounted into containers) -------------
paths:
  base: /opt/kardamom
  aeron_mount: /opt/kardamom/aeron-mount   # tmpfs; aeron.dir = <mount>/dir
  archive_dir: /opt/kardamom/archive       # recorder Archive segments (persistent)
  state_dir: /opt/kardamom/state           # executor StateWriter (libmdbx) data
  checkpoints_dir: /opt/kardamom/checkpoints # executor state checkpoints (fast recovery)
  batcher_dir: /opt/kardamom/batcher       # live batcher cursor file + DA blob store (#39)
  config_dir: /opt/kardamom/config         # rendered service configs + genesis

# tmpfs size for the Aeron media-driver shared-memory dir.
aeron_tmpfs_size: "2g"

# --- cluster topology (node classes) --------------------------------------
# The cluster is defined as a small set of node CLASSES, each with a replica
# `count` — NOT a hand-enumerated list of nodes. Ansible's topology role
# materialises `count` instances per class, names them <class>-<i>, assigns each
# a static IP from the class's `ip_start` lane on `ip_prefix`.0/24, and tags each
# with two Nomad node-meta attributes: `role` (= the class name, for unique
# placement) and `tier` (a coarse group, for collocation/exclusion). Scaling a
# class is a one-line `count` change — no node lists, inventories, or IP mirrors.
#
# Each worker-tier class runs ONE pipeline service. (The old standalone
# recorders are gone: durability is archive-at-the-sealer, folded into the
# Aeron Cluster members.)
#
# Replication semantics:
#   control     1    singleton: consul+nomad server, registry, anvil L1
#   sequencer   2    partition_count=2 active lanes, P=2 racing replicas per
#                    lane: one job group per lane (seq-<lane>, count=2,
#                    distinct_hosts), generated by scripts/render-sequencer-job.py
#                    from config/shard-map.toml. Ports form a lane (metrics
#                    9001 + 10 * lane, egress 40210 + 10 * lane), so lanes
#                    share a node. Keep count >= 2 so both replicas of a lane
#                    land on distinct nodes. The Aeron Cluster dedups the
#                    racing refs (canonical_id first-seen), so a replica kill
#                    costs no lane downtime. scripts/scale-sequencers.sh
#                    changes the active lane count at run time.
#   ingress     2    active/active RPC front door        (tier: worker)
#                    ingress-0@.31, ingress-1@.32; both join the tx_receipts
#                    multicast group and route to all sequencer shards. Scale by
#                    bumping count (no channel edits — receipts are multicast,
#                    correlation_id is namespaced by --ingress-id).
#   executor    3    state-machine replica appliers      (tier: worker)
#   sealer      3    3-member Aeron Cluster (Raft) sealer — ordering +
#                    durability fold into the Raft log + archive; members at
#                    .51/.52/.53
#   aux         1    validator + da_watcher + batcher    (tier: worker)
ip_prefix: "192.168.56"
node_classes:
  control: { count: 1, ip_start: 10, tier: control }
  sequencer: { count: 2, ip_start: 21, tier: sequencer }
  ingress: { count: 2, ip_start: 31, tier: worker } # active/active: ingress-0@.31, ingress-1@.32
  executor: { count: 3, ip_start: 41, tier: worker } # 3 state-machine replicas
  sealer: { count: 3, ip_start: 51, tier: worker } # 3-member Aeron Cluster (Raft) sealer (.51/.52/.53)
  aux: { count: 1, ip_start: 61, tier: worker } # validator + da_watcher + batcher

# Concrete addresses derived from the class lanes (first instance of each), for
# the few places that need a fixed target rather than Consul discovery.
control_ip: "192.168.56.10"      # control-0 — consul/nomad server, registry, anvil
ingress_ip: "192.168.56.31"      # ingress-0 — smoke.sh default RPC target
executor_ip: "192.168.56.41"     # executor-0
sealer_ip: "192.168.56.51"       # sealer-0 (Aeron Cluster member 0)

# Aeron Cluster (Raft) sealer member ports (uniform per role; unique by node IP).
cluster_member_count: 3
cluster_ports:
  ingress: 40200          # client-facing ingress (sequencer cluster-client connects here)
  consensus: 40201        # Raft consensus
  log: 40202              # log replication
  catchup: 40203          # replay / catch-up (log replication uses an OS-assigned port)
  archive_control: 40204
cluster_ingress_stream_id: 101
cluster_egress_stream_id: 102
cluster_egress_port: 40210   # per-client egress response port (on the client's node IP)
