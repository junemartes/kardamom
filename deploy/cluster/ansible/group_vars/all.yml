# Canonical cluster contract — single source of truth for the whole deploy.
# Vagrantfile, Ansible roles, Nomad job templates, and config templates all
# derive their values from here (or mirror it; see deploy/cluster/README.md).
---
# --- versions -------------------------------------------------------------
nomad_version: "1.9.5"
consul_version: "1.20.1"
docker_apt_channel: "stable"
aeron_version: "1.45.0"          # must match rusteron-archive 0.1.x
ubuntu_codename: "jammy"         # 22.04, matches the Aeron image base (temurin jammy)

# --- image registry -------------------------------------------------------
registry_host: "192.168.56.10"   # cp1 (control plane)
registry_port: 5000
image_tag: "dev"
# Fully-qualified image refs used by Nomad job specs.
image_prefix: "{{ registry_host }}:{{ registry_port }}/kardamom"

# --- L2 chain -------------------------------------------------------------
chain_id: 412346                 # matches chains/dev.toml
partition_count: 2               # M sequencers

# --- ports ----------------------------------------------------------------
ports:
  nomad_http: 4646
  nomad_rpc: 4647
  nomad_serf: 4648
  consul_http: 8500
  consul_dns: 8600
  consul_server: 8300
  consul_serf_lan: 8301
  consul_serf_wan: 8302
  registry: 5000
  ingress_rpc: 8545            # eth JSON-RPC on the ingress node
  anvil_l1: 8546              # in-cluster L1 (anvil) for the smoke test
  # Aeron archive control/response/replication (see aeron image EXPOSE).
  aeron_archive_control: 8010
  aeron_archive_control_response: 8011
  aeron_archive_recording_events: 8020
  aeron_archive_replication: 8021
  # Base UDP port for kardamom data/ordering channels; per-channel offsets
  # are assigned in config/channels.toml.tpl.
  aeron_channel_base: 40000

# --- on-node filesystem layout (bind-mounted into containers) -------------
paths:
  base: /opt/kardamom
  aeron_mount: /opt/kardamom/aeron-mount   # tmpfs; aeron.dir = <mount>/dir
  archive_dir: /opt/kardamom/archive       # recorder Archive segments (persistent)
  state_dir: /opt/kardamom/state           # executor StateWriter (libmdbx) data
  config_dir: /opt/kardamom/config         # rendered service configs + genesis

# tmpfs size for the Aeron media-driver shared-memory dir.
aeron_tmpfs_size: "1g"

# --- cluster topology (node classes) --------------------------------------
# The cluster is defined as a small set of node CLASSES, each with a replica
# `count` — NOT a hand-enumerated list of nodes. scripts/ci-cluster.sh
# materialises `count` instances per class, names them <class>-<i>, assigns each
# a static IP from the class's `ip_start` lane on `ip_prefix`.0/24, and tags each
# with two Nomad node-meta attributes: `role` (= the class name, for unique
# placement) and `tier` (a coarse group, for collocation/exclusion). Scaling a
# class is a one-line `count` change — no node lists, inventories, or IP mirrors.
#
# Each worker-tier class runs ONE pipeline service. The 3 RECORDERS are NOT their
# own class: they are a count=3 job COLLOCATED onto the worker tier (tier=worker)
# with `distinct_hosts`, so each lands on a distinct worker node alongside that
# node's service. (Step toward eventually merging the recorder + worker roles.)
# Per-replica identity (recorder_id, partition-index) comes from
# `${NOMAD_ALLOC_INDEX}`, not node meta.
#
# Replication semantics:
#   control     1    singleton: consul+nomad server, registry, anvil L1
#   sequencer   2    partition_count=2 (partition-index = alloc index)
#   ingress     1+   scalable RPC front door            (tier: worker)
#   executor    3    state applier; ONE RECORDER COLLOCATED PER EXECUTOR
#   sealer      3    3-member Aeron Cluster (Raft) sealer — ordering +
#                    durability fold into the Raft log + archive; members at
#                    .51/.52/.53 (was a singleton tx_ordering MDC publisher)
#   aux         1    da_watcher + batcher collocated     (tier: worker)
#   recorder    3    quorum N=3, COLLOCATED 1:1 on the executor nodes
#                    (role==executor, distinct_hosts; recorder_id = alloc index)
ip_prefix: "192.168.56"
node_classes:
  control: { count: 1, ip_start: 10, tier: control }
  sequencer: { count: 2, ip_start: 21, tier: sequencer }
  ingress: { count: 1, ip_start: 31, tier: worker }
  executor: { count: 3, ip_start: 41, tier: worker } # 3 exec nodes, each with a recorder
  sealer: { count: 3, ip_start: 51, tier: worker } # 3-member Aeron Cluster (Raft) sealer (.51/.52/.53)
  aux: { count: 1, ip_start: 61, tier: worker } # da_watcher + batcher

# Number of recorders to collocate across the worker tier (quorum N; Q in
# channels.toml). Must be <= the worker-tier node count (distinct_hosts).
recorder_count: 3

# Concrete addresses derived from the class lanes (first instance of each), for
# the few places that need a fixed target rather than Consul discovery.
control_ip: "192.168.56.10"      # control-0 — consul/nomad server, registry, anvil
ingress_ip: "192.168.56.31"      # ingress-0 — smoke.sh default RPC target
executor_ip: "192.168.56.41"     # executor-0
sealer_ip: "192.168.56.51"       # sealer-0 (publishes tx_ordering)

# tx_ordering MDC publisher control endpoints. Each publisher binds <node_ip>:40110
# (uniform port — uniqueness comes from the node IP), and subscribers attach to
# all of them. These MUST match tx_ordering_mdc_publishers in
# config/channels.toml.tpl: seq0@.21, seq1@.22, sealer@.51, all on port 40110.
# (Vestigial in cluster mode — tx_ordering is carried by the Aeron Cluster — but
# still parsed by the config templates.)
tx_ordering_mdc_port: 40110

# Aeron Cluster (Raft) sealer member ports (uniform per role; unique by node IP).
cluster_member_count: 3
cluster_ports:
  ingress: 40200          # client-facing ingress (sequencer cluster-client connects here)
  consensus: 40201        # Raft consensus
  log: 40202              # log replication
  catchup: 40203          # replay / catch-up (replicationChannel)
  archive_control: 40204
cluster_ingress_stream_id: 101
cluster_egress_stream_id: 102
cluster_egress_port: 40210   # per-client egress response port (on the client's node IP)
