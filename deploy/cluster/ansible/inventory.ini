# kardamom cluster inventory for the STATIC (Vagrant VM) path — `make provision`.
#
# Mirrors the node-class model in group_vars/all.yml (node_classes: class ->
# {count, ip_start, tier}); keep in sync (nodes are <class>-<i> at
# ip_prefix.<ip_start+i>). The container-based CI path does NOT use this file:
# scripts/ci-cluster.sh generates its own inventory from node_classes at run
# time. Every host defines the vars the role templates require —
# node_ip/role/tier/node_index (see roles/nomad/templates/nomad.hcl.j2) — so a
# rendered nomad.hcl carries the same node meta the Nomad jobs constrain on
# (${meta.role}, ${meta.tier}, ${meta.node_index}).

[control]
control-0 ansible_host=192.168.56.10 kardamom_node=control-0 node_ip=192.168.56.10 role=control tier=control node_index=0 control_plane=true

[sequencer]
sequencer-0 ansible_host=192.168.56.21 kardamom_node=sequencer-0 node_ip=192.168.56.21 role=sequencer tier=sequencer node_index=0
sequencer-1 ansible_host=192.168.56.22 kardamom_node=sequencer-1 node_ip=192.168.56.22 role=sequencer tier=sequencer node_index=1

[ingress]
ingress-0 ansible_host=192.168.56.31 kardamom_node=ingress-0 node_ip=192.168.56.31 role=ingress tier=worker node_index=0
ingress-1 ansible_host=192.168.56.32 kardamom_node=ingress-1 node_ip=192.168.56.32 role=ingress tier=worker node_index=1

[executor]
executor-0 ansible_host=192.168.56.41 kardamom_node=executor-0 node_ip=192.168.56.41 role=executor tier=worker node_index=0
executor-1 ansible_host=192.168.56.42 kardamom_node=executor-1 node_ip=192.168.56.42 role=executor tier=worker node_index=1
executor-2 ansible_host=192.168.56.43 kardamom_node=executor-2 node_ip=192.168.56.43 role=executor tier=worker node_index=2

[sealer]
sealer-0 ansible_host=192.168.56.51 kardamom_node=sealer-0 node_ip=192.168.56.51 role=sealer tier=worker node_index=0
sealer-1 ansible_host=192.168.56.52 kardamom_node=sealer-1 node_ip=192.168.56.52 role=sealer tier=worker node_index=1
sealer-2 ansible_host=192.168.56.53 kardamom_node=sealer-2 node_ip=192.168.56.53 role=sealer tier=worker node_index=2

[aux]
aux-0 ansible_host=192.168.56.61 kardamom_node=aux-0 node_ip=192.168.56.61 role=aux tier=worker node_index=0

[cluster:children]
control
sequencer
ingress
executor
sealer
aux
