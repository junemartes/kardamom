# kardamom 5-node cluster inventory.
# IPs / roles / ids mirror group_vars/all.yml (cluster_nodes); keep in sync.

[recorders]
r1 ansible_host=192.168.56.11 kardamom_node=r1 role=recorder recorder_id=0 control_plane=true
r2 ansible_host=192.168.56.12 kardamom_node=r2 role=recorder recorder_id=1
r3 ansible_host=192.168.56.13 kardamom_node=r3 role=recorder recorder_id=2

[workers]
w1 ansible_host=192.168.56.21 kardamom_node=w1 role=worker sequencer_id=0
w2 ansible_host=192.168.56.22 kardamom_node=w2 role=worker sequencer_id=1

[control]
r1

[cluster:children]
recorders
workers
