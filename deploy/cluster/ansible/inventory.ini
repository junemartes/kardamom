# kardamom 11-node cluster inventory (isolated-role topology).
# IPs / roles / ids mirror group_vars/all.yml (cluster_nodes); keep in sync.

[control]
cp1 ansible_host=192.168.56.10 kardamom_node=cp1 role=control control_plane=true

[recorders]
r1 ansible_host=192.168.56.11 kardamom_node=r1 role=recorder recorder_id=0
r2 ansible_host=192.168.56.12 kardamom_node=r2 role=recorder recorder_id=1
r3 ansible_host=192.168.56.13 kardamom_node=r3 role=recorder recorder_id=2

[sequencers]
sq1 ansible_host=192.168.56.21 kardamom_node=sq1 role=sequencer sequencer_id=0
sq2 ansible_host=192.168.56.22 kardamom_node=sq2 role=sequencer sequencer_id=1

[workers]
exec1 ansible_host=192.168.56.31 kardamom_node=exec1 role=worker
ingress1 ansible_host=192.168.56.32 kardamom_node=ingress1 role=worker
sealer1 ansible_host=192.168.56.33 kardamom_node=sealer1 role=worker
dawatcher1 ansible_host=192.168.56.34 kardamom_node=dawatcher1 role=worker
batcher1 ansible_host=192.168.56.35 kardamom_node=batcher1 role=worker

[cluster:children]
control
recorders
sequencers
workers
