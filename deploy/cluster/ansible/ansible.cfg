[defaults]
inventory = inventory.ini
host_key_checking = False
remote_user = vagrant
# The Vagrantfile sets `config.ssh.insert_key = false`, so every VM accepts
# the shared Vagrant insecure key — which lets one playbook run authenticate
# against all 5 hosts (per-machine generated keys would not).
private_key_file = ~/.vagrant.d/insecure_private_key
retry_files_enabled = False
stdout_callback = yaml
# group_vars/all.yml is the single source of truth for the deploy.

[privilege_escalation]
become = True
become_method = sudo
become_user = root
