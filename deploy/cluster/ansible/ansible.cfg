[defaults]
host_key_checking = False
# Connect as root. The container harness (scripts/ci-cluster.sh) provisions
# privileged systemd node containers over the community.docker.docker connection,
# which exec as root; a real-host run would SSH as root with the operator's keys.
# The inventory is ALWAYS passed explicitly with -i (the harness generates one),
# so there is no default inventory here.
remote_user = root
retry_files_enabled = False
stdout_callback = yaml
# group_vars/all.yml is the single source of truth for the deploy.

[privilege_escalation]
become = True
become_method = sudo
become_user = root
