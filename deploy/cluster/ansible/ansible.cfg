[defaults]
# The local profile builds its inventory from the node contract
# (containers.yml); the production profile keeps inventories/hetzner.
host_key_checking = False
retry_files_enabled = False
# The yaml stdout callback left community.general 12; the builtin default
# callback renders the same result format.
stdout_callback = default
callback_result_format = yaml
# group_vars/all.yml is the single source of truth for the deploy.

[privilege_escalation]
become = True
become_method = sudo
become_user = root
