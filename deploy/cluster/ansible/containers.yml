---
# Container substrate: reads the node contract of terraform/containers and
# provisions the nodes. `just container-up` applies the root, writes the
# contract and runs this playbook through cluster.yml.
- name: Read the node contract and prepare the host
  ansible.builtin.import_playbook: container-nodes.yml

- name: Provision container substrate
  ansible.builtin.import_playbook: bootstrap.yml
  vars:
    provision_hosts: container_nodes

- name: Restore host multicast settings after Docker startup
  ansible.builtin.import_playbook: container-host.yml
