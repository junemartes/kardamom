---
- name: Check that every sealer member and every service runs a release that takes the upgrade transaction
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Check the members and the sequencers
      ansible.builtin.include_role:
        name: workloads
        tasks_from: upgrade_check
