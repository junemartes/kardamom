# Container-node inventory for the cluster e2e (cluster-e2e.yml).
# Same hosts/roles/ids as inventory.ini, but Ansible connects over the
# community.docker connection plugin (no SSH) and kardamom_in_container=true
# skips the host-global sysctl task (see roles/common). The container names
# match scripts/ci-cluster.sh (kardamom-<node>).
#
# Isolated-role topology: control plane on its own node (cp1); pure recorders
# (r1-r3); dedicated sequencers (sq1-sq2); one pipeline service per worker node
# (exec1/ingress1/sealer1/dawatcher1/batcher1).

[control]
cp1 ansible_host=kardamom-cp1 kardamom_node=cp1 role=control control_plane=true

[recorders]
r1 ansible_host=kardamom-r1 kardamom_node=r1 role=recorder recorder_id=0
r2 ansible_host=kardamom-r2 kardamom_node=r2 role=recorder recorder_id=1
r3 ansible_host=kardamom-r3 kardamom_node=r3 role=recorder recorder_id=2

[sequencers]
sq1 ansible_host=kardamom-sq1 kardamom_node=sq1 role=sequencer sequencer_id=0
sq2 ansible_host=kardamom-sq2 kardamom_node=sq2 role=sequencer sequencer_id=1

[workers]
exec1 ansible_host=kardamom-exec1 kardamom_node=exec1 role=worker
ingress1 ansible_host=kardamom-ingress1 kardamom_node=ingress1 role=worker
sealer1 ansible_host=kardamom-sealer1 kardamom_node=sealer1 role=worker
dawatcher1 ansible_host=kardamom-dawatcher1 kardamom_node=dawatcher1 role=worker
batcher1 ansible_host=kardamom-batcher1 kardamom_node=batcher1 role=worker

[cluster:children]
control
recorders
sequencers
workers

[all:vars]
ansible_connection=community.docker.docker
ansible_python_interpreter=/usr/bin/python3
kardamom_in_container=true
