# kardamom-executor config — intentionally empty of settings.
#
# The binary presence-checks --config but takes all runtime tuning via CLI
# flags (see nomad/executor.nomad.hcl, which renders this file into the alloc
# via file()). This comment also keeps the rendered Nomad template non-empty,
# which job validation requires.
#
# The [cluster] block below is now PARSED by the executor binary (schema:
# crates/executor/src/config.rs ExecutorFileConfig): the executor consumes the
# totally-ordered tx_ordering stream from the Aeron Cluster egress — cluster
# mode is the only mode.

[cluster]
ingress_endpoints = "0=sealer-0.node.consul:40200,1=sealer-1.node.consul:40200,2=sealer-2.node.consul:40200"
initial_leader_member_id = 0
ingress_stream_id = 101
egress_stream_id = 102
keep_alive_interval_ms = 1000
# egress_channel is set per-node by --cluster-egress-endpoint (the node IP differs).
