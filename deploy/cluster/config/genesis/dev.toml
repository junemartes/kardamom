# kardamom cluster dev chain genesis.
#
# Copied from chains/dev.toml and extended to prefund the first 16
# Anvil/Hardhat-derived accounts (the well-known test mnemonic
# "test test test test test test test test test test test junk") so the
# transfers smoke test (scripts/smoke.sh) has funded signers. Account #0 is the
# canonical kardamom dev account; #0..#15 each get 1000 ETH.
#
# Shipped to the executor alloc via the Nomad `template` stanza in
# nomad/executor.nomad.hcl and passed with `--chain`.
#
# Do NOT use these accounts on real chains — the private keys are public.

