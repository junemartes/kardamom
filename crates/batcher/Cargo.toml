[package]
name = "kardamom-batcher"
version.workspace = true
edition.workspace = true
build = "build.rs"


[features]
default = []
# Real Aeron container e2e. Implies the in-memory testing helpers from
# `log` because the harness re-uses some of them.
docker-e2e = ["kardamom-log/docker-e2e", "kardamom-log/testing"]

[dependencies]
kardamom-types.workspace = true
kardamom-log.workspace = true
# Reconstruction (rebuild-from-L1) re-executes the decoded DA blocks through the
# shared engine into a trie-aware state DB — the inverse of the live executor.
kardamom-engine = { path = "../engine" }
kardamom-state = { path = "../state" }
# Pulled in as a regular dependency (not just dev-dep) primarily to force
# build-order: kardamom-deployer's build.rs runs forge install + forge build,
# populating `contracts/out/`. Our `sol!` macro in `settlement.rs` loads
# `contracts/out/KardamomL2Settlement.sol/KardamomL2Settlement.json` at
# compile time and cargo guarantees a crate's deps are compiled (and their
# build scripts run) before the crate itself is compiled. Without this,
# parallel build-script execution races on forge install.
kardamom-deployer = { path = "../deployer" }

alloy-primitives.workspace = true
# `kzg` gives us the trusted-setup-backed sidecar builder (real blob commitments
# + versioned hashes) for the live L1 broadcast path.
alloy-eips = { workspace = true, features = ["kzg"] }
alloy-consensus.workspace = true
alloy-network.workspace = true
alloy-provider.workspace = true
alloy-contract.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-sol-types.workspace = true
alloy-signer-local.workspace = true

bytes.workspace = true
rkyv.workspace = true
zstd = "0.13"

anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
kardamom-obs = { path = "../obs" }

clap.workspace = true
# Live L1 posting + the `kardamom-reconstruct` binary are async; genesis is TOML.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml.workspace = true

[dev-dependencies]
kardamom-log = { workspace = true, features = ["testing"] }
tempfile.workspace = true
proptest = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
criterion = { version = "0.7", features = ["html_reports"] }
alloy-node-bindings.workspace = true
alloy-consensus.workspace = true
alloy-network.workspace = true
alloy-signer-local.workspace = true
serde_json.workspace = true
reqwest = { workspace = true }

[[bin]]
name = "kardamom-batcher"
path = "src/bin/kardamom-batcher.rs"

[[bin]]
name = "kardamom-reconstruct"
path = "src/bin/kardamom-reconstruct.rs"

[[bench]]
name = "pack_throughput"
harness = false
