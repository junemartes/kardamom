[package]
name = "kardamom-batcher"
version.workspace = true
edition.workspace = true
build = "build.rs"


[features]
default = []
# Real Aeron container e2e. Implies the in-memory testing helpers from
# `log` because the harness re-uses some of them.
docker-e2e = ["kardamom-log/docker-e2e", "kardamom-log/testing"]

[dependencies]
kardamom-types.workspace = true
kardamom-log.workspace = true
# NOTE: the batcher is state-free — it produces and decodes DA blobs but never
# opens a state DB. Rebuild-from-L1 (which re-executes decoded blobs through the
# engine into a trie-aware state DB) lives in the separate `kardamom-reconstruct`
# crate, keeping the state DB confined to the executor, validator, and that tool.
# Pulled in as a regular dependency (not just dev-dep) primarily to force
# build-order: kardamom-deployer's build.rs runs forge install + forge build,
# populating `contracts/out/`. Our `sol!` macro in `settlement.rs` loads
# `contracts/out/KardamomL2Settlement.sol/KardamomL2Settlement.json` at
# compile time and cargo guarantees a crate's deps are compiled (and their
# build scripts run) before the crate itself is compiled. Without this,
# parallel build-script execution races on forge install.
kardamom-deployer = { path = "../deployer" }

alloy-primitives.workspace = true
# `kzg` gives us the trusted-setup-backed sidecar builder (real blob commitments
# + versioned hashes) for the live L1 broadcast path.
alloy-eips = { workspace = true, features = ["kzg"] }
alloy-consensus.workspace = true
alloy-network.workspace = true
alloy-provider.workspace = true
alloy-contract.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-sol-types.workspace = true
alloy-signer-local.workspace = true

bytes.workspace = true
rkyv.workspace = true
zstd = "0.13"

anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
kardamom-obs = { path = "../obs" }

# Live mode (#39): the batcher is a third cluster-egress consumer, reusing the
# executor/validator reader stack (cluster tx_ordering subscription + tx_data
# join + archive refetch) verbatim.
kardamom-engine.workspace = true
crossbeam-channel.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

clap.workspace = true
# Live L1 posting is async; genesis is TOML.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml.workspace = true

[dev-dependencies]
kardamom-log = { workspace = true, features = ["testing"] }
tempfile.workspace = true
proptest = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
criterion = { version = "0.7", features = ["html_reports"] }
alloy-node-bindings.workspace = true
alloy-consensus.workspace = true
alloy-network.workspace = true
alloy-signer-local.workspace = true
serde_json.workspace = true
reqwest = { workspace = true }

[[bin]]
name = "kardamom-batcher"
path = "src/bin/kardamom-batcher.rs"

[[bin]]
name = "kardamom-archive-rereplicate"
path = "src/bin/kardamom-archive-rereplicate.rs"

[[bench]]
name = "pack_throughput"
harness = false

[[bin]]
name = "kardamom-proof-submitter"
path = "src/bin/kardamom-proof-submitter.rs"
