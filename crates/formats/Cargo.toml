[package]
name = "kardamom-formats"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

# The format registry (`formats.toml` at the workspace root) and its
# release check. The crates that own a format use the library in their
# tests. The `kardamom-formats` binary compares the registry with the
# registry of a base revision.

[features]
default = []
# The command-line binary. The library and its users do not need clap.
cli = ["dep:clap"]

[[bin]]
name = "kardamom-formats"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { workspace = true, optional = true }
# The archived layout fingerprint of a frozen rkyv format.
rkyv.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
