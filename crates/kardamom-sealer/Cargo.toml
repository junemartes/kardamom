[package]
name = "kardamom-sealer"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kardamom-sealer"
path = "src/bin/kardamom-sealer.rs"

[features]
default = []
# In-memory testing fakes for downstream-crate unit tests. Mirrors the
# convention used by kardamom-sequencer / kardamom-log: a `testing` feature
# gates the in-process mocks so that crate consumers can re-use the
# sealer's election + emission code without a real Aeron environment.
testing = ["kardamom-log/testing"]
# Real Aeron wiring. Off by default so the crate builds on hosts without the
# Aeron C library installed. CI runs `--all-features --locked` on a host with
# Aeron available.
aeron-live = ["kardamom-log/aeron-live"]
# Docker-driven real-Aeron e2e gate. Implies `testing` for the harness import.
docker-e2e = ["testing", "kardamom-log/docker-e2e"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
kardamom-leases.workspace = true
kardamom-log = { workspace = true, features = ["testing"] }
kardamom-types.workspace = true
metrics.workspace = true
rkyv.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# criterion 0.7 with the async_tokio feature (the workspace pin is 0.5 which
# doesn't have `b.to_async`); kardamom-ingress already does the same override.
criterion = { version = "0.7", features = ["async_tokio"] }
# Re-pull our own `testing` feature so tests under `tests/` always have the
# in-memory fakes without needing `cargo test --features testing`.
kardamom-sealer = { path = ".", features = ["testing"] }
proptest = "1"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[[bench]]
name = "boundary_emit"
harness = false
