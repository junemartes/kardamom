[package]
name = "kardamom-ingress"
version.workspace = true
edition.workspace = true


[features]
default = ["binary-protocol"]
# Length-prefixed RLP TCP+UDS binary protocol. On by default.
binary-protocol = []
# Gates a Docker-backed e2e test (real Aeron via kardamom-log testcontainers
# harness). Off by default so `cargo test` works without Docker. Implies
# `kardamom-log/docker-e2e` for the AeronTestCluster harness.
docker-e2e = ["kardamom-log/docker-e2e"]

[dependencies]
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-rlp.workspace = true
alloy-rpc-types-eth.workspace = true
anyhow.workspace = true
async-trait = "0.1"
bytes.workspace = true
clap.workspace = true
dashmap = "6"
governor = "0.10"
hyper = { version = "1", features = ["http1", "server"] }
jsonrpsee.workspace = true
kardamom-log = { workspace = true, features = ["testing"] }
kardamom-obs = { path = "../obs" }
kardamom-types.workspace = true
metrics.workspace = true
nonzero_ext = "0.3"
secp256k1 = { version = "0.31", features = ["recovery", "global-context"] }
thiserror.workspace = true
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "kardamom-ingress"
path = "src/bin/kardamom-ingress.rs"

[dev-dependencies]
alloy-signer-local.workspace = true
criterion = { version = "0.7", features = ["async_tokio"] }
futures.workspace = true
jsonrpsee = { version = "0.26", features = ["server", "macros", "client", "http-client"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
kardamom-log = { workspace = true, features = ["testing"] }
metrics = { workspace = true }
rand = "0.9"
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "throughput"
harness = false

