[package]
name = "kardamom-e2e"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
# Run the full-pipeline cross-component test under real Aeron in Docker.
# Implies `aeron-live` + `docker-e2e` everywhere it touches. Off by default
# so the standard CI stays fast; the dedicated docker-e2e CI job opts in.
full-pipeline-e2e = [
    "kardamom-log/aeron-live",
    "kardamom-log/docker-e2e",
    "kardamom-log/testing",
]

[lib]
path = "src/lib.rs"

[dependencies]
kardamom-log.workspace = true
kardamom-types.workspace = true

alloy-primitives.workspace = true
bytes.workspace = true
rkyv.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Note: aeron-live and docker-e2e are activated only when the
# `full-pipeline-e2e` feature is enabled (see [features] above). Plain
# `cargo test -p kardamom-e2e` does not pull rusteron / cmake / docker.
kardamom-executor = { path = "../kardamom-executor" }
kardamom-state = { path = "../kardamom-state" }
tempfile.workspace = true
tracing-subscriber.workspace = true
