[package]
name = "kardamom-executor"
version.workspace = true
edition.workspace = true


[dependencies]
# : shared types live in kardamom-types.
kardamom-types = { workspace = true }
kardamom-log = { workspace = true }
kardamom-obs = { path = "../obs" }
revm.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-rlp.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
metrics = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
toml.workspace = true
crossbeam-channel = "0.5"
dashmap = { workspace = true }

[[bin]]
name = "kardamom-executor"
path = "src/bin/kardamom-executor.rs"

[dev-dependencies]
# : hermetic unit tests use kardamom-log's in-memory fakes.
# Real-Aeron e2e tests pull `docker-e2e` to bring in the testcontainers harness.
kardamom-log = { workspace = true, features = ["testing"] }
alloy-signer-local.workspace = true
alloy-network.workspace = true
alloy-eips.workspace = true
tempfile = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }
rand = "0.9"
rand_chacha = "0.9"
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
metrics = { workspace = true }

[[bench]]
name = "sequential_throughput"
harness = false
