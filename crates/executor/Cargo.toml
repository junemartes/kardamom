[package]
name = "kardamom-executor"
version.workspace = true
edition.workspace = true


[dependencies]
rkyv.workspace = true
alloy-eip7928.workspace = true
alloy-rlp.workspace = true
# Execution core (reader/join topology, revm execution, delta accumulation,
# reader→exec→commit orchestration) lives in the shared engine crate.
kardamom-engine = { workspace = true }
# : shared types live in kardamom-types.
kardamom-types = { workspace = true }
kardamom-log = { workspace = true }
# Cluster (Raft) transport adapter (`reader::cluster`). tx_ordering ALWAYS comes
# from the cluster egress — non-optional, there is no non-cluster path.
kardamom-cluster-adapter = { path = "../cluster-adapter" }
kardamom-obs = { path = "../obs" }
# libmdbx-backed production state backend (StateWriter + snapshot-swap channel).
kardamom-state = { path = "../state" }
# Block-STM engine for --parallel-execution (scheduler unification B2).
kardamom-stm = { path = "../stm" }
kardamom-footprint = { path = "../footprint" }
revm.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
metrics = { workspace = true }
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
toml.workspace = true
crossbeam-channel = "0.5"
dashmap = { workspace = true }

[[bin]]
name = "kardamom-executor"
path = "src/bin/kardamom-executor.rs"

[dev-dependencies]
# : hermetic unit tests use kardamom-log's in-memory fakes.
# Real-Aeron e2e tests pull `docker-e2e` to bring in the testcontainers harness.
kardamom-log = { workspace = true, features = ["testing"] }
kardamom-cluster-adapter = { path = "../cluster-adapter", features = ["testing"] }
alloy-signer-local.workspace = true
alloy-network.workspace = true
alloy-eips.workspace = true
tempfile = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }
rand = "0.9"
rand_chacha = "0.9"
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "sequential_throughput"
harness = false
