[package]
name = "kardamom-sequencer"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kardamom-sequencer"
path = "src/bin/kardamom-sequencer/main.rs"


[features]
# In-memory fakes for downstream-crate unit tests. Enables the `fakes` modules
# under `inbound` / `outbound`, and the `testkit` module's signed-envelope
# fixtures. On by default in this crate's `[dev-dependencies]` pull-back; off
# in production.
#
# `testkit` needs `alloy-network` (the `TxSignerSync` trait) and
# `alloy-signer-local` (`PrivateKeySigner`) as real, non-dev dependencies:
# `tests/*.rs` and `benches/*.rs` link this crate through the
# `[dev-dependencies]` self pull-back below, which builds the library with
# `--features testing` but WITHOUT this crate's own `[dev-dependencies]` in
# scope. A `testing`-gated item that named a dev-only crate would compile
# under `cargo test --lib` (cfg(test) does see dev-deps) and fail for every
# `tests/`/`benches/` binary.
testing = ["dep:alloy-network", "dep:alloy-signer-local"]
# Real-Aeron Docker e2e test gate. Implies `testing` for the harness import.
docker-e2e = ["testing", "kardamom-log/docker-e2e"]

[dependencies]
crossbeam-channel.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
# `testkit`-only: see the `testing` feature doc above.
alloy-network = { workspace = true, optional = true }
alloy-rlp.workspace = true
# `testkit`-only: see the `testing` feature doc above.
alloy-signer-local = { workspace = true, optional = true }
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
core_affinity = "0.8"
# Cluster (Raft) transport adapter (`outbound::cluster`). tx_ordering ALWAYS goes
# to the cluster ingress — non-optional, there is no non-cluster path.
kardamom-cluster-adapter = { path = "../cluster-adapter" }
kardamom-log = { workspace = true, features = ["testing"] }
kardamom-obs = { path = "../obs" }
kardamom-types.workspace = true
metrics.workspace = true
# The nonce lookup client (`lookup`): one JSON-RPC POST per cold sender.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
# alloy-network and alloy-signer-local moved to [dependencies] (optional,
# behind the `testing` feature): see that feature's doc comment.
alloy-eips.workspace = true
criterion.workspace = true
# DHAT heap profiling for the ignored-by-default allocation harness
# (tests/alloc_profile.rs) — same setup as crates/bench/tests/alloc_profile.rs.
dhat = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Pull in our own `testing` feature so integration tests under `tests/`
# always have access to the `fakes` modules without needing
# `cargo test --features testing` (matches the convention CI uses).
kardamom-sequencer = { path = ".", features = ["testing"] }
kardamom-log = { workspace = true, features = ["testing"] }
kardamom-cluster-adapter = { path = "../cluster-adapter", features = ["testing"] }
kardamom-obs = { path = "../obs", features = ["test-support"] }
proptest = "1"
rand = "0.9"

[[bench]]
name = "throughput"
harness = false
