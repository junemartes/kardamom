[package]
name = "kardamom-sequencer"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kardamom-sequencer"
path = "src/bin/kardamom-sequencer.rs"


[features]
# In-memory fakes for downstream-crate unit tests. Enables the `fakes` modules
# under `inbound` / `outbound`. On by default in this crate's `[dev-dependencies]`
# pull-back; off in production.
testing = []
# Real-Aeron Docker e2e test gate. Implies `testing` for the harness import.
docker-e2e = ["testing", "kardamom-log/docker-e2e"]

[dependencies]
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-rlp.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
core_affinity = "0.8"
# Cluster (Raft) transport adapter (`outbound::cluster`). tx_ordering ALWAYS goes
# to the cluster ingress — non-optional, there is no non-cluster path.
kardamom-cluster-adapter = { path = "../cluster-adapter" }
kardamom-log = { workspace = true, features = ["testing"] }
kardamom-obs = { path = "../obs" }
kardamom-types.workspace = true
metrics.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
alloy-eips.workspace = true
alloy-network.workspace = true
alloy-signer-local.workspace = true
criterion.workspace = true
# DHAT heap profiling for the ignored-by-default allocation harness
# (tests/alloc_profile.rs) — same setup as crates/bench/tests/alloc_profile.rs.
dhat = "0.3"
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Pull in our own `testing` feature so integration tests under `tests/`
# always have access to the `fakes` modules without needing
# `cargo test --features testing` (matches the convention CI uses).
kardamom-sequencer = { path = ".", features = ["testing"] }
kardamom-log = { workspace = true, features = ["testing"] }
kardamom-cluster-adapter = { path = "../cluster-adapter", features = ["testing"] }
proptest = "1"
rand = "0.9"

[[bench]]
name = "throughput"
harness = false
