[package]
name = "kardamom-l1-indexer"
version.workspace = true
edition.workspace = true
description = "The inbox indexer: an archive of the batches and the epoch inputs, read from a verified L1 view"

[dependencies]
kardamom-batcher = { path = "../batcher" }
kardamom-da-watcher = { path = "../da_watcher" }
kardamom-types = { workspace = true }
kardamom-obs = { path = "../obs" }
kardamom-log = { workspace = true }

alloy-primitives = { workspace = true, features = ["serde"] }
alloy-rpc-types-eth.workspace = true
alloy-sol-types.workspace = true

anyhow.workspace = true
async-trait = "0.1"
clap.workspace = true
jsonrpsee = { workspace = true }
metrics = { workspace = true }
reqwest = { workspace = true }
rkyv.workspace = true
serde.workspace = true
serde_json = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true }
tracing = { workspace = true }

[features]
default = []
# Exposes the recording block sink to other crates' tests.
testing = []

[dev-dependencies]
kardamom-da-watcher = { path = "../da_watcher", features = ["testing"] }
kardamom-batcher = { path = "../batcher", features = ["test-support"] }
tempfile = { workspace = true }
