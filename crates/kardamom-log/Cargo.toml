[package]
name = "kardamom-log"
version.workspace = true
edition.workspace = true

[features]
default = []
# Exposes in-memory pub/sub fakes that mimic the Aeron-backed channel surface,
# for other crates' unit tests. Real Aeron is still required for e2e (see
# tests/docker_e2e.rs).
testing = []
# Gates the Docker-driven e2e test (testcontainers). Off by default so
# `cargo test` works in environments without a Docker daemon.
docker-e2e = ["testing"]
# Gates code that depends on the live rusteron Aeron client/archive bindings.
# Off by default so the crate compiles cleanly on hosts without the Aeron C
# library installed. Real Aeron deployments and the docker-e2e harness enable
# this feature.
aeron-live = ["dep:rusteron-client", "dep:rusteron-archive"]

[dependencies]
alloy-primitives.workspace = true
bytes.workspace = true
futures.workspace = true
io-uring.workspace = true
kardamom-types.workspace = true
libc.workspace = true
rkyv.workspace = true
rusteron-archive = { workspace = true, optional = true }
rusteron-client = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
testcontainers.workspace = true
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[[bench]]
name = "fsync_watermark_latency"
harness = false
