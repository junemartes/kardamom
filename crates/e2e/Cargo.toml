[package]
name = "e2e"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
# Run the full-pipeline cross-component test under real Aeron in Docker.
# Implies the `docker-e2e` testcontainers harness. Off by default so the
# standard CI stays fast; the dedicated docker-e2e CI job opts in.
full-pipeline-e2e = ["log/docker-e2e", "log/testing"]

[lib]
path = "src/lib.rs"

[dependencies]
log.workspace = true
types.workspace = true

alloy-primitives.workspace = true
bytes.workspace = true
rkyv.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Note: docker-e2e is activated only when the `full-pipeline-e2e`
# feature is enabled (see [features] above).
criterion.workspace = true
hdrhistogram.workspace = true
executor = { path = "../executor", package = "kardamom-executor" }
state = { path = "../state", package = "kardamom-state" }
tempfile.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "e2e_throughput"
harness = false
# Bench only compiles when full-pipeline-e2e is enabled (real Aeron + Docker).
required-features = ["full-pipeline-e2e"]
