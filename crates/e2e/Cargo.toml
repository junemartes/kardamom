[package]
name = "e2e"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
# Enable the chain-semantics harness + scenario drivers (src/harness,
# src/scenarios) and the full-pipeline tests that bind them to the local
# stack. Also implies the `docker-e2e` testcontainers harness used by the
# throughput bench. Off by default so the standard CI stays fast; the
# chain-semantics-e2e CI job opts in.
full-pipeline-e2e = [
    "kardamom-log/docker-e2e",
    "kardamom-log/testing",
    "dep:alloy-consensus",
    "dep:alloy-contract",
    "dep:alloy-eips",
    "dep:alloy-network",
    "dep:alloy-node-bindings",
    "dep:alloy-provider",
    "dep:alloy-signer-local",
    "dep:alloy-sol-types",
    "dep:anyhow",
    "dep:hex",
    "dep:jsonrpsee",
    "dep:kardamom-bench",
    "dep:kardamom-da-watcher",
    "dep:kardamom-deployer",
    "dep:kardamom-state",
    "dep:libc",
    "dep:serde_json",
    "dep:tempfile",
]

[lib]
path = "src/lib.rs"

[dependencies]
kardamom-log.workspace = true
kardamom-types.workspace = true

alloy-primitives.workspace = true
bytes.workspace = true
rkyv.workspace = true
tokio.workspace = true
tracing.workspace = true

# Chain-semantics harness deps — optional, activated by `full-pipeline-e2e`
# so the default build stays as light as before.
alloy-consensus = { workspace = true, optional = true }
alloy-contract = { workspace = true, optional = true }
alloy-eips = { workspace = true, optional = true }
alloy-network = { workspace = true, optional = true }
alloy-node-bindings = { workspace = true, optional = true }
alloy-provider = { workspace = true, optional = true }
alloy-signer-local = { workspace = true, optional = true }
alloy-sol-types = { workspace = true, optional = true }
kardamom-da-watcher = { path = "../da_watcher", optional = true }
kardamom-deployer = { path = "../deployer", optional = true }
anyhow = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }
jsonrpsee = { workspace = true, features = ["http-client"], optional = true }
kardamom-bench = { path = "../bench", optional = true }
kardamom-state = { path = "../state", optional = true }
libc = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
# Note: docker-e2e is activated only when the `full-pipeline-e2e`
# feature is enabled (see [features] above).
alloy-consensus.workspace = true
alloy-contract.workspace = true
alloy-network.workspace = true
alloy-node-bindings.workspace = true
alloy-provider.workspace = true
alloy-rlp.workspace = true
alloy-signer-local.workspace = true
alloy-sol-types.workspace = true
anyhow.workspace = true
async-trait = "0.1"
criterion.workspace = true
crossbeam-channel.workspace = true
hex = "0.4"
libc.workspace = true
hdrhistogram.workspace = true
jsonrpsee = { workspace = true, features = ["http-client"] }
kardamom-da-watcher = { path = "../da_watcher" }
kardamom-deployer = { path = "../deployer" }
kardamom-executor = { path = "../executor" }
kardamom-ingress = { path = "../ingress" }
kardamom-sequencer = { path = "../sequencer", features = ["testing"] }
kardamom-state = { path = "../state" }
serde_json.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "e2e_throughput"
harness = false
# Bench only compiles when full-pipeline-e2e is enabled (real Aeron + Docker).
required-features = ["full-pipeline-e2e"]
