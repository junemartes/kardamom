[package]
name = "e2e"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
# Run the full-pipeline cross-component test under real Aeron in Docker.
# Implies `aeron-live` + `docker-e2e` everywhere it touches. Off by default
# so the standard CI stays fast; the dedicated docker-e2e CI job opts in.
full-pipeline-e2e = ["log/aeron-live", "log/docker-e2e", "log/testing"]

[lib]
path = "src/lib.rs"

[dependencies]
log.workspace = true
types.workspace = true

alloy-primitives.workspace = true
bytes.workspace = true
rkyv.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Note: aeron-live and docker-e2e are activated only when the
# `full-pipeline-e2e` feature is enabled (see [features] above). Plain
# `cargo test -p e2e` does not pull rusteron / cmake / docker.
criterion.workspace = true
hdrhistogram.workspace = true
executor = { path = "../executor" }
state = { path = "../state" }
tempfile.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "e2e_throughput"
harness = false
# Bench only compiles when full-pipeline-e2e is enabled (real Aeron + Docker).
required-features = ["full-pipeline-e2e"]
