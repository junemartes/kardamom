[package]
name = "kardamom-recorder"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kardamom-recorder"
path = "src/bin/kardamom-recorder.rs"

[features]
# Real-Aeron Docker e2e test gate (mirrors the other service crates): pulls the
# kardamom-log testcontainers harness into integration tests.
docker-e2e = ["kardamom-log/docker-e2e"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
ctrlc = { version = "3", features = ["termination"] }
kardamom-log.workspace = true
kardamom-types.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
