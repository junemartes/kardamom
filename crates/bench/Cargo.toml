[package]
name = "kardamom-bench"
version.workspace = true
edition.workspace = true

[lib]
name = "kardamom_bench"
path = "src/lib.rs"

[[bin]]
name = "kardamom-bench"
path = "src/main.rs"

[[bin]]
name = "kardamom-bench-harness"
path = "src/bin/harness.rs"

[[bin]]
name = "kardamom-load"
path = "src/bin/load.rs"

[[bin]]
name = "kardamom-stm-p0"
path = "src/bin/stm-p0.rs"

[[bin]]
name = "kardamom-perf"
path = "src/bin/perf.rs"

[dependencies]
kardamom-types.workspace = true
kardamom-ingress = { path = "../ingress" }

alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-rlp.workspace = true
alloy-network.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-eips.workspace = true
alloy-signer-local = { workspace = true, features = ["mnemonic"] }

rand = "0.8"
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
humantime = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-flame.workspace = true
hdrhistogram.workspace = true
jsonrpsee = { workspace = true }
# `frame-pointer` is required on macOS arm64: the default unwinder
# (libunwind via `backtrace`) is not signal-safe and SIGTRAPs under load.
# Apple Silicon enables frame pointers by default, so no extra rustflags
# are needed here.
pprof = { version = "0.14", features = ["flamegraph", "frame-pointer"] }
# STM lab (src/stm): offline capture through the real engine.
revm.workspace = true
kardamom-engine.workspace = true

[dev-dependencies]
revm.workspace = true
kardamom-validator.workspace = true
dhat = "0.3"
kardamom-engine.workspace = true
kardamom-types.workspace = true
