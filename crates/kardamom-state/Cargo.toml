[package]
name = "kardamom-state"
version.workspace = true
edition.workspace = true

[features]
default = []
# Bench-only feature that exposes a few internal helpers. The workspace builds
# fine without it.
bench-internals = []
# Gates the real-Aeron Docker e2e test (). Off by default so
# `cargo test` works in environments without a Docker daemon. CI runs the
# Docker harness via `--features docker-e2e -- --ignored`.
docker-e2e = ["kardamom-log/docker-e2e", "kardamom-log/testing"]

[dependencies]
# `rlp` feature enables RlpEncodable/RlpDecodable on Address, B256, U256.
alloy-primitives = { workspace = true, features = ["rlp"] }
alloy-rlp = { workspace = true, features = ["derive"] }
anyhow.workspace = true
bytes.workspace = true
crossbeam-channel = "0.5"
kardamom-log.workspace = true
kardamom-types.workspace = true
# libmdbx binding. We use the signet-libmdbx fork (MIT/Apache, idiomatic 0.8
# API) rather than vorot93/libmdbx (MPL-2.0) : the MIT/Apache fork
# is preferred when the licensing matters. The on-disk format is identical
# (both wrap upstream libmdbx).
signet-libmdbx = "0.8"
metrics.workspace = true
# rkyv 0.8: receipts and `BlockDelta` are stored as rkyv archives at rest.
# `Receipt` upstream already derives Archive/Serialize/Deserialize.
rkyv.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion = { version = "0.7", features = ["html_reports"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "write_throughput"
harness = false

[[bench]]
name = "snapshot_open"
harness = false
