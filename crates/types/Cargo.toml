[package]
name = "kardamom-types"
version.workspace = true
edition.workspace = true

# `no_std`-compatible: the exec-core / zk-guest build disables the default
# `std` feature. Dependencies are declared directly (not `workspace = true`)
# because workspace deps carry default features that cannot be subtracted by
# a member; version requirements MUST stay in sync with the workspace root so
# the graph resolves to a single copy of each crate.

[features]
default = ["std"]
std = [
    "alloy-primitives/std",
    "alloy-rlp/std",
    "bytes/std",
    "rkyv/std",
    "serde/std",
    "thiserror/std",
]

[dependencies]
# `rlp` is required by epoch::source_hash — the RLP encoding of the L1 block
# hash is part of the consensus rule, so the feature is explicit here rather
# than inherited transitively from whoever else happens to enable it.
# `source_hash` is a CONSENSUS rule (RLP-encoded, OP-aligned), so it lives
# with the shared types rather than in a service crate — see epoch.rs.
alloy-primitives = { version = "1.6", default-features = false, features = ["serde", "rlp"] }
alloy-rlp = { version = "0.3", default-features = false }
bytes = { version = "1", default-features = false }
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck", "bytes-1"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
# rkyv roundtrip tests only — nothing I/O
# `sol!`-generated encoder: the compiler-grade oracle the hand-rolled
# `xchain::deliver_calldata` is pinned byte-identical against.
alloy-sol-types = { workspace = true }
