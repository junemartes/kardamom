[package]
name = "kardamom-log"
version.workspace = true
edition.workspace = true


[features]
default = []
# Exposes in-memory pub/sub fakes that mimic the Aeron-backed channel surface,
# for other crates' unit tests. Real Aeron is still required for e2e (see
# tests/docker_e2e.rs).
testing = []
# Gates the Docker-driven e2e test (testcontainers). Off by default so
# `cargo test` works in environments without a Docker daemon. Pulls
# `testcontainers` in as a real (non-dep) dep because the e2e harness in
# `testing::AeronTestCluster` is reused by other crates' integration tests.
docker-e2e = ["testing", "dep:testcontainers"]

[dependencies]
crossbeam-channel.workspace = true
futures.workspace = true
kardamom-types.workspace = true
rkyv.workspace = true
rusteron-archive.workspace = true
rusteron-client.workspace = true
serde.workspace = true
testcontainers = { workspace = true, optional = true }
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
dhat = "0.3"
# alloy-primitives / bytes are used only by the integration tests in tests/,
# not by the library crate itself.
alloy-primitives.workspace = true
bytes.workspace = true
tempfile.workspace = true
testcontainers.workspace = true
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
