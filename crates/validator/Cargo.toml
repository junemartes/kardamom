[package]
name = "kardamom-validator"
version.workspace = true
edition.workspace = true

# Monolithic validator node: follows the sequencer by subscribing to the live
# channels, re-executes every block through the shared kardamom-engine core,
# produces a canonical Ethereum MPT state root (trie-aware state writer), and
# cross-checks itself against the executor's receipts (tx_receipts) and per-block
# BAL (tx_bal). Fail-stop on divergence. Off the hot path; no HA.

[dependencies]
# Epoch verification reads L1 through the SAME source the producer uses, so a
# derivation bug cannot cancel itself out between the two sides.
kardamom-da-watcher = { path = "../da_watcher" }
kardamom-interop-feed = { workspace = true }
jsonrpsee = { workspace = true }
async-trait = "0.1"
bytes.workspace = true
serde_json.workspace = true
revm.workspace = true
rkyv.workspace = true
alloy-eip7928.workspace = true
alloy-rlp.workspace = true
kardamom-engine = { workspace = true }
# Named directly so the startup builder can hold the cluster session guard
# as a concrete field instead of a generic parameter (see `wiring::Startup`).
kardamom-cluster-adapter = { path = "../cluster-adapter" }
# `reqwest::Url` is the type `alloy_provider::connect_http` requires. Named
# directly so the attester config holds a parsed URL, not a raw string.
reqwest = { workspace = true }
# The shared persistent worker pool (scheduler unification B1): BAL-seeded
# batches dispatch onto it instead of spawning one OS thread per batch.
kardamom-stm = { path = "../stm" }
kardamom-types = { workspace = true }
kardamom-log = { workspace = true }
kardamom-state = { path = "../state" }
kardamom-obs = { path = "../obs" }
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-provider.workspace = true
alloy-network.workspace = true
alloy-contract.workspace = true
alloy-signer-local.workspace = true
alloy-sol-types.workspace = true
alloy-rpc-types-eth.workspace = true
anyhow.workspace = true
clap.workspace = true
metrics = { workspace = true }
serde = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
toml.workspace = true

[[bin]]
name = "kardamom-validator"
path = "src/bin/kardamom-validator/main.rs"

[dev-dependencies]
alloy-consensus.workspace = true
alloy-eips.workspace = true
crossbeam-channel = "0.5"
tempfile.workspace = true
alloy-network.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-contract.workspace = true
alloy-sol-types.workspace = true
alloy-node-bindings.workspace = true
alloy-signer-local.workspace = true
kardamom-deployer = { path = "../deployer" }
# `MockStateDatabaseBuilder` is not re-exported through
# `kardamom_engine::state` (only the built `MockStateDatabase` is); the
# shared test fixtures need to name the builder type directly.
kardamom-exec-core = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
