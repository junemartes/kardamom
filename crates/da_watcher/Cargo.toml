[package]
name = "kardamom-da-watcher"
version.workspace = true
edition.workspace = true

[features]
default = []
# Exposes the in-memory L1 source / epoch publisher fakes to other crates.
testing = []
# Exposes the interop test seam to other crates (e2e): the scripted mock
# validator feed (a real jsonrpsee WS server) and the in-memory remote-epoch
# publisher fake.
test-support = []

[dependencies]
kardamom-types = { workspace = true }
kardamom-obs = { path = "../obs" }

alloy-primitives = { workspace = true, features = ["serde"] }
alloy-provider.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-rlp.workspace = true
alloy-sol-types.workspace = true

bytes.workspace = true
async-trait = "0.1"
jsonrpsee = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true

# Binary-only deps. These are unused by the library itself; they support the
# `kardamom-da-watcher` CLI binary defined under `src/bin/`.
kardamom-log = { workspace = true }
anyhow.workspace = true
clap.workspace = true

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "kardamom-da-watcher"
path = "src/bin/kardamom-da-watcher.rs"
