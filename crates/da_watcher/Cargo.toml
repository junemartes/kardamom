[package]
name = "kardamom-da-watcher"
version.workspace = true
edition.workspace = true

[features]
default = []
# Exposes the in-memory L1 source / epoch publisher fakes to other crates.
testing = []
# Exposes the interop test seam to other crates (e2e): the scripted mock
# validator feed (a real jsonrpsee WS server) and the in-memory remote-epoch
# publisher fake.
test-support = []

[dependencies]
kardamom-types = { workspace = true }
kardamom-interop-feed = { workspace = true }
kardamom-obs = { path = "../obs" }
kardamom-cluster-adapter = { path = "../cluster-adapter" }

alloy-primitives = { workspace = true, features = ["serde"] }
alloy-provider.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-sol-types.workspace = true
alloy-transport.workspace = true

async-trait = "0.1"
futures.workspace = true
jsonrpsee = { workspace = true }
metrics = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true

# Binary-only deps. These are unused by the library itself; they support the
# `kardamom-da-watcher` CLI binary defined under `src/bin/`.
kardamom-log = { workspace = true }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
tokio-util = { workspace = true }
toml.workspace = true

[dev-dependencies]
# The format registry: a test checks this crate's format layout against it.
kardamom-formats.workspace = true
# Enables the in-memory fakes for this crate's own integration tests.
kardamom-da-watcher = { path = ".", features = ["testing", "test-support"] }
kardamom-obs = { path = "../obs", features = ["test-support"] }
kardamom-cluster-adapter = { path = "../cluster-adapter", features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[[bin]]
name = "kardamom-da-watcher"
path = "src/bin/kardamom-da-watcher.rs"
