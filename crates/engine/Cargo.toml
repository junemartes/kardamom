[package]
name = "kardamom-engine"
version.workspace = true
edition.workspace = true

# Role-agnostic execution engine: the reader/join topology, per-tx revm
# execution, delta/write-set accumulation, and the reader→exec→commit
# orchestration behind the `StateWriterQueue` / `TxReceiptsPublication` seams.
# Shared by the sequencer-side `kardamom-executor` and the `kardamom-validator`.
# The pure per-tx execution slice lives in `kardamom-exec-core` (`no_std`,
# zk-guest-linkable) and is re-exported from this crate's root.

[dependencies]
kardamom-exec-core = { workspace = true }
smallvec.workspace = true
alloy-eip7928.workspace = true
alloy-rlp.workspace = true
kardamom-types = { workspace = true }
kardamom-log = { workspace = true }
# Cluster (Raft) transport adapter (`reader::cluster`). tx_ordering ALWAYS comes
# from the cluster egress — non-optional, there is no non-cluster path.
kardamom-cluster-adapter = { path = "../cluster-adapter" }
kardamom-state = { path = "../state" }
kardamom-obs = { path = "../obs" }
# P1 footprint shadow (`crate::shadow`): the P0 classifier/grader core.
kardamom-footprint = { path = "../footprint" }
serde = { workspace = true }
revm.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
bytes.workspace = true
metrics = { workspace = true }
tracing.workspace = true
thiserror.workspace = true
crossbeam-channel = "0.5"
dashmap = { workspace = true }
# bin_support: shared wiring for the two engine-driven binaries (executor +
# validator) — CLI arg mirror, genesis loading, async→sync stream bridging,
# tracing/shutdown helpers. Both engine consumers are those binaries.
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
# Only needed to sign a `LegacyTx` test fixture; optional, behind
# `test-support`, so a production build of this crate never links a
# signer.
alloy-network = { workspace = true, optional = true }
alloy-signer-local = { workspace = true, optional = true }

[features]
# Exposes `actor::fixtures` (the signed-legacy-tx builder and the
# channel-backed `ChannelHarness`) as `pub`, so an integration test in
# another crate (`kardamom-validator`, `kardamom-executor`) can reach it
# instead of copying it. Off by default: a production build never
# compiles test fixtures in.
test-support = ["dep:alloy-network", "dep:alloy-signer-local"]

[dev-dependencies]
kardamom-log = { workspace = true, features = ["testing"] }
kardamom-cluster-adapter = { path = "../cluster-adapter", features = ["testing"] }
alloy-signer-local.workspace = true
alloy-network.workspace = true
alloy-eips.workspace = true
tempfile = { workspace = true }
